rules = ["file:tools/refactor/AstRecipe.scala"]
AstRecipe {
  manifest = "refactor-audit/import-registry/prerequisite-build-1/sources.tsv"
  report = "refactor-audit/import-registry/api-codec-preview-1"
  edits = [
    {
      path = "modules/db/src/main/scala/com/histmersion/domain/library/sources/SourceColumns.scala"
      before = """given apiStatus: DbCodec[com.histmersion.api.library.Source.Status] =
  Vocab.codec(
    s => com.histmersion.api.library.Source.Status.values.find(_.wire.equalsIgnoreCase(s)),
    _.wire,
    com.histmersion.api.library.Source.Status.Unassessed
  )"""
      after = ""
    },
    {
      path = "modules/db/src/main/scala/com/histmersion/domain/library/sources/SourceRepo.scala"
      before = "import SourceColumns.given"
      after = "import com.histmersion.api.library.SourceColumns.given"
    },
    {
      path = "modules/db/src/main/scala/com/histmersion/domain/library/citations/CitationRepo.scala"
      before = "import com.histmersion.domain.library.sources.SourceColumns.given"
      after = "import com.histmersion.api.library.SourceColumns.given"
    },
    {
      path = "modules/db/src/main/scala/com/histmersion/domain/research/articles/ArticleRepo.scala"
      before = "import com.histmersion.api.library.Filter"
      after = """import com.histmersion.api.library.Filter
import com.histmersion.api.library.SourceColumns.given"""
    }
  ]
  creates {
    "modules/db/src/main/scala/com/histmersion/api/library/SourceColumns.scala" = """package com.histmersion.api.library

import com.augustnagro.magnum.DbCodec
import com.histmersion.util.database.Vocab

private[histmersion] object SourceColumns:
  given apiStatus: DbCodec[Source.Status] =
    Vocab.codec(s => Source.Status.values.find(_.wire.equalsIgnoreCase(s)), _.wire, Source.Status.Unassessed)
"""
  }
}
