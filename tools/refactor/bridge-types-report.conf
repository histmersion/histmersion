# G44 bridges: `To(x.value)` with `x` of another newtype. Report only: one row per bridge with both types' base,
# constraint and the source type's declaration count, so the pairs that are one concept can be aliased.
rules = ["file:tools/refactor/BridgeTypes.scala"]
BridgeTypes {
  report = "target/refactor/bridge-types.tsv"
}
