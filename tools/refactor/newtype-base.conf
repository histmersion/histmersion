# Step 3a: every newtype companion extends com.histmersion.Newtype instead of Iron's RefinedType.
# hello-lib stands for a third-party library (it does not see Histmersion's modules), so it keeps Iron's RefinedType.
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh \
#     --config tools/refactor/newtype-base.conf --sourceroot . --auto-classpath --auto-classpath-roots target/out --files modules/<m>
# Fixture: .claude/skills/scalafix/scripts/run-rule.sh tools/refactor/NewtypeBase.scala tools/refactor/newtype-base-fixture/input tools/refactor/newtype-base-fixture/expected
rules = ["file:tools/refactor/NewtypeBase.scala"]
NewtypeBase {
  exclude = ["modules/plugin-fixtures/hello-lib/", "modules/newtype/"]
}
