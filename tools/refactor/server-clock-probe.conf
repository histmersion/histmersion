rules = ["file:tools/refactor/AstRecipe.scala"]
AstRecipe {
  manifest = "refactor-audit/import-registry/ownership-build-1/sources.tsv"
  report = "refactor-audit/server-clock/probe-preview-2"
  edits = [
    {
      path = "modules/server/src/test/scala/com/histmersion/util/basemap/BasemapServiceSuite.scala"
      before = "Deps(cfg, ds)"
      after = "Deps(cfg, ds, clock = java.time.Clock.fixed(java.time.Instant.parse(\"2000-01-02T03:04:05Z\"), java.time.ZoneOffset.UTC))"
      count = 2
    },
    {
      path = "modules/server/src/test/scala/com/histmersion/util/basemap/BasemapServiceSuite.scala"
      before = "assert(st.available, st.toString)"
      after = """locally {
  assert(st.available, st.toString)
  assertEquals(st.layers.map(l => l.layer -> l.fetchedAt), List("vector", "terrain", "labels", "bathymetry").map(_ -> Some("2000-01-02T03:04:05Z")))
}"""
    }
  ]
}
