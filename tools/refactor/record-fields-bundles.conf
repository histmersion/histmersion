# Row 32 (ADR 0029 section 5, slice 4): a bundle carries each record's creator, so an import writes who made the
# record on the instance it came from instead of "not recorded". AddRecordFields appends `creator` to the twelve
# stamped records of the bundle format. The creator is provenance, not content: it is left out of the record's rev.
# The bundle format is a supporting area (util.data) and names no domain's type, so the creator travels as the stored
# document itself (JSON, as a goal's plan does), checked against the stored shape when an import writes it.
# After `sbt Test/compile`, from the worktree root:
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh --config tools/refactor/record-fields-bundles.conf \
#     --sourceroot . --auto-classpath --auto-classpath-roots target/out --files modules/api/src/main
rules = ["file:tools/refactor/AddRecordFields.scala"]
AddRecordFields {
  report = "refactor-audit/provenance/record-fields-bundles.tsv"
  imports = []
  fields {
    "com/histmersion/api/exchange/Bundle.Source#" = "creator: Option[Json] = None"
    "com/histmersion/api/exchange/Bundle.Finding#" = "creator: Option[Json] = None"
    "com/histmersion/api/exchange/Bundle.Article#" = "creator: Option[Json] = None"
    "com/histmersion/api/exchange/Bundle.ArticleVersion#" = "creator: Option[Json] = None"
    "com/histmersion/api/exchange/Bundle.Asset#" = "creator: Option[Json] = None"
    "com/histmersion/api/exchange/Bundle.AssetLink#" = "creator: Option[Json] = None"
    "com/histmersion/api/exchange/Bundle.Attestation#" = "creator: Option[Json] = None"
    "com/histmersion/api/exchange/Bundle.Event#" = "creator: Option[Json] = None"
    "com/histmersion/api/exchange/Bundle.Goal#" = "creator: Option[Json] = None"
    "com/histmersion/api/exchange/Bundle.QueueItem#" = "creator: Option[Json] = None"
    "com/histmersion/api/exchange/Bundle.Place#" = "creator: Option[Json] = None"
    "com/histmersion/api/exchange/Bundle.Period#" = "creator: Option[Json] = None"
  }
}
