  declarations = "refactor-audit/architecture/declarations.tsv"
  manifest = "refactor-audit/architecture/sources.tsv"
  report = "refactor-audit/copy-migration/inspect"
  deferredOwners {
    "com/histmersion/api/automation/Goal.Plans.ArticleDraft#" = "kindlings-exported-DraftMode-type-assertion"
    "com/histmersion/api/automation/Goal.Plans.GoalSchedule#" = "kindlings-exported-ScheduleKind-type-assertion"
    "com/histmersion/domain/automation/agents/AgentDef#" = "kindlings-exported-AgentRole-type-assertion"
  }
}
