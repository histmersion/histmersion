rules = ["file:tools/refactor/AstRecipe.scala"]
AstRecipe {
  manifest = "tools/refactor/model-definitions-fixture/sources.tsv"
  report = "target/model-definitions-fixture-5"
  definitionRoots = ["tools/refactor/model-definitions-fixture/src/main/"]
  defer { "fixture.Payload.bytes" = "Payload-level type required; retain binary representation" }
  reuse {
    "fixture.Entry.label" = "Token"
    "fixture.Token.value" = "fixture.Token.Value"
    "fixture.Choice.kind" = "fixture.Choice.Kind"
  }
}
