rules = ["file:tools/refactor/RelocateOwners.scala"]
RelocateOwners {
  mode = preview
  report = "refactor-audit/shared-title/preview-1"
  roots = [modules]
  moves = [{
    from = "modules/values/src/main/scala/com/histmersion/domain/library/Title.scala"
    to = "modules/values/src/main/scala/com/histmersion/domain/Title.scala"
    oldPackage = "com.histmersion.domain.library"
    newPackage = "com.histmersion.domain"
    names = [Title]
    symbols {
      "com/histmersion/domain/library/Title$package.Title#" = Title
      "com/histmersion/domain/library/Title$package.Title." = Title
    }
  }]
}
