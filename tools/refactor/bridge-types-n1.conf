# Owner decision N1 (2026-11-27): "same-name pairs only". Each newtype in bridge-aliases-n1.txt (generated by
# bridge-aliases.py from the BridgeTypes report) becomes an alias of its group's canonical type; ValueOntoType then
# drops the round trips the aliases leave. Different-name pairs are not merged; they stay for review one at a time.
rules = ["file:tools/refactor/BridgeTypes.scala"]
BridgeTypes {
  aliasesFrom = "tools/refactor/bridge-aliases-n1.txt"
  report = "target/refactor/bridge-types-n1.tsv"
}
