# Server-side Booleans, step server (after boolean-enums-db.conf): each Boolean newtype of modules/server becomes a
# two-case enum whose companion extends the codec-free TwoCases. Where it sits in JSON (MCP tool inputs, settings,
# stored records), the api's NewtypeCodecs.twoCases lifts its codec and NewtypeCodecs.twoCasesSchema its schema at the
# boundary: JSON true/false, a boolean schema, as the Boolean was. Run order as in boolean-enums-core.conf.
