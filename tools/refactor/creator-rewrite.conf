# Row 32 (ADR 0029 §7, slice 3), dry run: lists every record INSERT given its creator, every `(using Creator.New)`
# clause added, every test file given TestCreators, and every `stop` (a creator written by hand). Changes nothing.
# Run after `sbt Test/compile` (current SemanticDB), from the worktree root:
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh --config tools/refactor/creator-rewrite.conf \
#     --sourceroot . --files modules
# creator-rewrite-apply.conf is this with `apply = true`. Keep the two in step. The tables are ADR 0029 §3's.
#
# CreatorRewrite: every INSERT into a record table writes the record's creator, and no create path compiles without
# one in scope. The shape follows WritePermitRewrite, whose permit is demanded the same way:
#   - each INSERT into a table of `tables` (main code) gets `creator` at the end of its column list and the bound
#     creator at the end of its VALUES row (or of its SELECT list, before the SELECT's own FROM);
#   - an INSERT ... SELECT ... FROM a table of `copySources` (an edge waiting for its target, resolved) copies that
#     row's own `creator`, and needs no creator in scope;
#   - the def around it (the innermost) gets `(using creator: Creator.New)` and binds
#     `${StoredCreator.column(creator)}::jsonb`; in a file matching `unrecordedFiles` (a bundle's import: a bundle
#     carries no creator yet) it binds `${StoredCreator.write(Creator.unrecorded)}::jsonb` and takes no clause;
#   - the clause follows the def up the call graph, `(using Creator.New)`, and across every override (a service
#     trait's method, its Implementation, its InMemory), test sources included;
#   - it stops at an endpoint (a public def of a `boundaryFiles` file: the binding knows the surface): where the file
#     matches a pattern of `endpointGivens` and the def's body is a block, the body starts with
#     `given Creator.New = <the pattern's creator>` (a `given` row); else a `stop` row for a creator written by hand,
#     as at a def that overrides a method outside the project and at a reference outside any def;
#   - a test file that calls a def needing a creator gets `testImport`.
# A creator is a value: unlike a permit, carrying it into a function literal that runs later is fine, so a lambda is
# no stop. A def that already takes a Creator or Creator.New (the work lists' explicit parameter) is left as it is.
# An INSERT whose shape the rule does not know (no column list, several VALUES rows) is a `stop`.
rules = ["file:tools/refactor/CreatorRewrite.scala"]
CreatorRewrite {
  report = "refactor-audit/provenance/creator-rewrite.tsv"
  apply = false
  boundaryFiles = ".*(Routes|Tools)\\.scala"
  # a binding's requests name no identity yet (ADR 0029 section 1): REST's and the MCP's own surface, unattributed
  endpointGivens {
    ".*Routes\\.scala" = "Creator.New.Unattributed(Creator.Surface.Rest)"
    ".*(?<!Agent)Tools\\.scala" = "Creator.New.Unattributed(Creator.Surface.Mcp)"
  }
  tables = [
    sources, findings, edges, unresolved_edges, assessments, source_candidates, candidate_watches,
    articles, article_versions, review_ledgers,
    assets, asset_links,
    events, places, periods, attestations, corrections, place_overrides, event_link_candidates,
    queue_items, goals, goal_links, goal_schedules, approvals, jobs, agent_managers, manager_hints,
    notes, bookmarks
  ]
}
