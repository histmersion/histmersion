# The owner's category defaults of 2026-11-24 applied to the newtypes that kept client splices in s"…": a text the
# server or the page composes (rationales, titles, names, texts, a noun's written form) and an id shown as an
# identifier are shown as written. Wire spellings (labels), timestamps (a local date/time form), years and
# coordinates (their formatters), counts and measures, and the owner's "decide" items are not here.
rules = ["file:tools/refactor/DisplayAsIs.scala"]
DisplayAsIs {
  types = [
    "com/histmersion/api/Years.Text.",
    "com/histmersion/api/BBox.Text.",
    "com/histmersion/api/Plural.Noun.Form.",
    "com/histmersion/api/automation/Goal.Title.",
    "com/histmersion/api/automation/Goal.Plans.GoalLink.Ref.",
    "com/histmersion/api/automation/Queue.QueueItem.Text.",
    "com/histmersion/api/automation/Autopilot.Rationale.",
    "com/histmersion/api/automation/PlanQuota.Rationale.",
    "com/histmersion/api/automation/Managers.Rationale.",
    "com/histmersion/api/library/Hit.Rationale.",
    "com/histmersion/api/library/CollectionFieldValue.Name.",
    "com/histmersion/api/log/LogEvent.Trace.",
    "com/histmersion/api/log/LogEvent.Key.",
    "com/histmersion/api/personal/ItemKey.",
    "com/histmersion/api/personal/Note.Id.",
    "com/histmersion/web/settings/Draft.Text.",
    "com/histmersion/web/ui/Clipboard.FallbackWhat.",
    "com/histmersion/web/settings/StartPlace.ChooserName.",
    "com/histmersion/web/ManagersView.WriteLabel."
  ]
  forms = [
    { newtype = "com/histmersion/api/automation/Agents.ApprovalInfo.Id.", instance = "given Display[T] = Display(id => s\"${id.value}\")" }
  ]
}
