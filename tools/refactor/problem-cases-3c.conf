rules = ["file:tools/refactor/ProblemCaseRewrite.scala"]
ProblemCaseRewrite {
  rewrites = [
    { from = "Run.Unsettled", to = "{q}Run.AtStep($1, {q}Run.StepFailure.Unsettled($2))" }
    { from = "Run.ProviderDown", to = "{q}Run.AtStep($1, {q}Run.StepFailure.ProviderDown($2))" }
    { from = "Run.BudgetSpent", to = "{q}Run.AtStep($1, {q}Run.StepFailure.BudgetSpent)" }
    { from = "Run.NoValidAnswer", to = "{q}Run.AtStep($1, {q}Run.StepFailure.NoValidAnswer($2, $3))" }
    { from = "Run.OutputCapped", to = "{q}Run.AtStep($1, {q}Run.StepFailure.OutputCapped($2, $3, $4, $5))" }
  ]
}
