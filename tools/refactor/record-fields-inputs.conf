# Row 32 (ADR 0029 section 5, slice 4): every write input names its creator. AddRecordFields appends the fields and the
# parent to each class below, by SemanticDB symbol, and imports Creation where it adds them:
#   - a REST body (api): `createdBy` (plugin, workflow and the agent's definition, provider and model) and `via`
#     (rest | cli | web), parent Creation.Requested;
#   - an MCP tool's own input (server): `createdBy` alone, parent Creation.Named (the MCP is its surface).
# The classes are the inputs of attribute-endpoints.conf's dry run (refactor-audit/provenance/attribute-endpoints.tsv)
# whose endpoint creates a record, minus: the supporting areas' inputs (maintenance, backup, exchange, aliases, basemap:
# no domain), the personal ones (personal does not depend on automation), the queue's (it has its own), the multipart
# ones (Ingest.Params, SourceCoverParams: by hand) and query/path parameters (no body). Request metadata never lives
# in a stored or checkpointed content type: a source's patch is checkpointed (an agent's proposal holds one), so the
# fields go on its request type, Source.Patch.Request (the patch's fields, flat), and Source.Patch stays as it was.
# After `sbt Test/compile`, from the worktree root:
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh --config tools/refactor/record-fields-inputs.conf \
#     --sourceroot . --auto-classpath --auto-classpath-roots target/out --files modules/api/src/main --files modules/server/src/main
rules = ["file:tools/refactor/AddRecordFields.scala"]
