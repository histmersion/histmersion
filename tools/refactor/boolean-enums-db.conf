# Server-side Booleans, step db (after boolean-enums-core.conf): each Boolean newtype of modules/db becomes a two-case
# enum whose companion extends the codec-free TwoCases. Its column stays `boolean` (NewtypeColumns.twoStates reads and
# writes it through TwoCases); where it sits in JSON, the api's NewtypeCodecs.twoCases lifts its codec at the boundary.
# Run order as in boolean-enums-core.conf (the rule pass over every module: server uses db's enums).
rules = ["file:tools/refactor/BooleanEnums.scala"]
BooleanEnums {
  semanticdbRoots = ["target/out/jvm/scala-{scalaVersion}"]
  report = "target/refactor/boolean-enums-db.tsv"
  parent = "TwoCases"
