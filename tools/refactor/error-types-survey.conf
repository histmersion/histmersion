# ErrorTypesToProblems' collect pass over every module (no `only`): the verdicts a round would reach everywhere, into a
# scratch report (target/error-types/survey-report.tsv). Read-only; run as error-types-collect.conf is.
rules = ["file:tools/refactor/ErrorTypesToProblems.scala"]
ErrorTypesToProblems {
  mode = collect
  plan = "target/error-types/survey-plan.tsv"
  report = "target/error-types/survey-report.tsv"
  carriers = "target/error-types/survey-carriers.tsv"
}
