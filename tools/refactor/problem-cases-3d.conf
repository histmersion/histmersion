rules = ["file:tools/refactor/ProblemCaseRewrite.scala"]
ProblemCaseRewrite {
  rewrites = [
    { from = "Run.Exhausted", to = "{q}Run.NoModel($1, {q}Run.Shortfall.Exhausted($2, $3), $4)" }
    { from = "Run.Unassigned", to = "{q}Run.NoModel($1, {q}Run.Shortfall.Unassigned($2), Vector.empty)" }
    { from = "Run.Cooling", to = "{q}Run.Skipped({q}Run.Skip.Cooling($1))" }
    { from = "Run.BelowFloor", to = "{q}Run.Skipped({q}Run.Skip.BelowFloor($1, $2))" }
    { from = "Run.BelowAllowance", to = "{q}Run.Skipped({q}Run.Skip.BelowAllowance($1))" }
    { from = "Run.AllowanceUnread", to = "{q}Run.Skipped({q}Run.Skip.AllowanceUnread($1))" }
    { from = "Run.PlanOnly", to = "{q}Run.Skipped({q}Run.Skip.PlanOnly($1))" }
    { from = "Run.AllowanceReached", to = "{q}Run.Skipped({q}Run.Skip.AllowanceReached($1))" }
  ]
}
