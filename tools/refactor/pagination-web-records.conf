rules = ["file:tools/refactor/ModelTypeRewrite.scala"]
ModelTypeRewrite {
  records = [
    { owner = "com/histmersion/web/TabPage#", parameters = [rows, total, extras], fields = { total = "com.histmersion.api.RowCount" } },
    { owner = "com/histmersion/web/TabState#", parameters = [rows, total, shown, loading, error, loaded, extras], fields = { total = "com.histmersion.api.RowCount", shown = "com.histmersion.api.RowCount" } },
    { owner = "com/histmersion/web/library/ListPage#", parameters = [rows, offset, total, loaded, loading, error], fields = { offset = "com.histmersion.api.Offset", total = "com.histmersion.api.RowCount" } }
  ]
  knownValues = {
    "com/histmersion/api/library/SearchResult#offset." = "com.histmersion.api.Offset"
    "com/histmersion/api/library/SearchResult#total." = "com.histmersion.api.RowCount"
    "com/histmersion/api/research/Article.List#offset." = "com.histmersion.api.Offset"
    "com/histmersion/api/research/Article.List#total." = "com.histmersion.api.RowCount"
    "com/histmersion/api/catalogue/EventList#total." = "com.histmersion.api.RowCount"
  }
  scalarBoundaryOwners = [
    "com/histmersion/web/TabState#left().",
    "com/histmersion/web/TabState#countLine().",
    "com/histmersion/web/TabState.appended().",
    "com/histmersion/web/TabState.more().",
    "com/histmersion/web/FilterTab#pane().",
    "com/histmersion/web/library/ListPage#hasPrevious().",
    "com/histmersion/web/library/ListPage#hasNext().",
    "com/histmersion/web/library/ListPage#previousOffset().",
    "com/histmersion/web/library/ListPage#nextOffset().",
    "com/histmersion/web/library/ListPage.rangeLine()."
  ]
}
