# Row 32 (ADR 0029 section 5, slice 4): every record's view shows who created it and when. AddRecordFields appends
# `creator` (the stored creator as the wire shows it) and `createdAt` (when it was made, where the record had no such
# field) to the views the ADR names: a source, a finding, an edge in `neighbors`, an article, an asset, a goal, a run,
# an approval, an event and a place. The asset's database row stays as it was: a domain row names no api type, so the
# repository reads the two columns beside it.
# Notes and bookmarks store a creator and show none (personal: ADR section 5).
# After `sbt Test/compile`, from the worktree root:
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh --config tools/refactor/record-fields-views.conf \
#     --sourceroot . --auto-classpath --auto-classpath-roots target/out --files modules/api/src/main --files modules/db/src/main
rules = ["file:tools/refactor/AddRecordFields.scala"]
AddRecordFields {
  report = "refactor-audit/provenance/record-fields-views.tsv"
  imports = ["com.histmersion.api.automation.Creation"]
  fields {
    "com/histmersion/api/library/Source.Detail#" = "creator: Option[Creation] = None, createdAt: Option[Creation.At] = None"
    "com/histmersion/api/library/Finding.Row#" = "creator: Option[Creation] = None, createdAt: Option[Creation.At] = None"
    "com/histmersion/api/library/NeighborRow#" = "creator: Option[Creation] = None, createdAt: Option[Creation.At] = None"
    "com/histmersion/api/research/Article.Row#" = "creator: Option[Creation] = None, createdAt: Option[Creation.At] = None"
    "com/histmersion/api/media/AssetDetail#" = "creator: Option[Creation] = None, createdAt: Option[Creation.At] = None"
    "com/histmersion/api/automation/Goal#" = "creator: Option[Creation] = None, createdAt: Option[Creation.At] = None"
    "com/histmersion/api/automation/Agents.RunInfo#" = "creator: Option[Creation] = None"
    "com/histmersion/api/automation/Agents.ApprovalInfo#" = "creator: Option[Creation] = None"
    "com/histmersion/api/views/EventDetail#" = "creator: Option[Creation] = None, createdAt: Option[Creation.At] = None"
    "com/histmersion/api/views/PlaceDetail#" = "creator: Option[Creation] = None, createdAt: Option[Creation.At] = None"
  }
}
