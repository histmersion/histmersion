# G2 for the clients (cli, web): `.value` dropped where the newtype itself does the job (ValueOntoType). Sinks are
# Laminar's tags (a text child) and the attribute setters (`attr := x`): both render a newtype through its own
# display form, the `Display` instance its companion gives (web/DisplayText.scala); a newtype without one is left
# alone and listed in the -missing worklist.
rules = ["file:tools/refactor/ValueOntoType.scala"]
ValueOntoType {
  paths = ["modules/cli/", "modules/web/"]
  sinks = [
    "com/raquo/laminar/defs/tags/HtmlTags#\\w+\\.",
    "com/raquo/laminar/keys/HtmlAttr#`:=`\\(\\)\\.",
    "com/raquo/laminar/keys/HtmlProp#`:=`\\(\\)\\."
  ]
  sinkRequires = "com/histmersion/Display#"
  sinkImport ="com.histmersion.web.{:=, given}"
  sinkPackage = "com.histmersion.web"
  report = "target/refactor/value-onto-type-clients.tsv"
}
