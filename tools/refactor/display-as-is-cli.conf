# The ids, names and addresses the CLI prints, shown as written (the owner's default for an id shown as an
# identifier): its own Calibre book ids, plugin ids, Scala packages and server URL, and the api's queue item,
# plugin and merge-plan identifiers. The Int-based ones are written with the number's own digits.
rules = ["file:tools/refactor/DisplayAsIs.scala"]
DisplayAsIs {
  types = [
    "com/histmersion/cli/PluginId.",
    "com/histmersion/cli/ScalaPackage.",
    "com/histmersion/cli/Client.ServerUrl.",
    "com/histmersion/api/plugins/PluginDescription.Id.",
    "com/histmersion/api/plugins/PluginDescription.Version.",
    "com/histmersion/api/exchange/MergePlan.PlanHash."
  ]
  forms = [
    { newtype = "com/histmersion/cli/Calibre.Book.Id.", instance = "given Display[T] = Display(id => s\"${id.value}\")" }
    { newtype = "com/histmersion/api/automation/Queue.QueueItem.Id.", instance = "given Display[T] = Display(id => s\"${id.value}\")" }
  ]
}
