include "capabilities-source.conf"
include "migration.conf"
include "repository-visibility.conf"
include "feature-owners.conf"
include "controller-renames.conf"
include "models.conf"
include "architecture-inventory.conf"
rules = [
  "file:tools/refactor/CapabilityAccess.scala",
  "file:tools/refactor/SourceContracts.scala",
  "file:tools/refactor/RepositoryVisibility.scala",
  "file:tools/refactor/FeatureOwners.scala",
  "file:tools/refactor/RenameControllers.scala",
  "file:tools/refactor/CliOutputBoundary.scala",
  "file:tools/refactor/CliErrorBoundary.scala",
  "file:tools/refactor/InjectConsole.scala",
  "file:tools/refactor/SchemaDerives.scala",
  "file:tools/refactor/ModelInventory.scala",
  "file:tools/refactor/OperationInventory.scala",
  "file:tools/refactor/ArchitectureInventory.scala"
]
CapabilityAccess { measureOnly = true, report = "refactor-audit/assessment/current/capabilities" }
SourceContracts { requireReady = false, fixturePaths = [], report = "refactor-audit/assessment/current/structure" }
RepositoryVisibility { mode = inventory, report = "refactor-audit/assessment/current/repositories" }
FeatureOwners { mode = measure, report = "refactor-audit/assessment/current/owners" }
RenameControllers { mode = inspect, report = "refactor-audit/assessment/current/controllers.tsv" }
CliOutputBoundary { mode = inspect, report = "refactor-audit/assessment/current/stdout.tsv" }
CliErrorBoundary { mode = inspect, report = "refactor-audit/assessment/current/stderr.tsv" }
InjectConsole { mode = inspect, plan = "refactor-audit/assessment/current/console.tsv" }
SchemaDerives { mode = measure, report = "refactor-audit/assessment/current/schema-derives" }
