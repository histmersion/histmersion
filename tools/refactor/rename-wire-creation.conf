# Row 32 (ADR 0029 section 5): the wire's creator record is api.automation.Creation: api.library.Provenance is the
# source's provenance (ContractsSuite rule `concept`), and an api file at the root has no place (ArchitectureSuite).
# RenameSymbols renames the named definitions' references by SemanticDB symbol: every name whose symbol is a key of
# `renames` becomes the value; an importee of one is removed and the file imports the path `imports` gives instead (the
# definition's new place). The definition itself and its file are renamed and moved by hand afterwards.
# After `sbt Test/compile`, from the worktree root:
#   SCALAFIX_JAVA_OPTS=-Xmx4g bash tools/refactor/scalafix.sh --config tools/refactor/rename-wire-creation.conf \
#     --sourceroot . --auto-classpath --auto-classpath-roots target/out --files modules
rules = ["file:tools/refactor/RenameSymbols.scala"]
RenameSymbols {
  renames {
    "com/histmersion/api/Provenance#" = "Creation"
    "com/histmersion/api/Provenance." = "Creation"
  }
  imports {
    "com/histmersion/api/Provenance#" = "com.histmersion.api.automation.Creation"
    "com/histmersion/api/Provenance." = "com.histmersion.api.automation.Creation"
  }
}
