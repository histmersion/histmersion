rules = ["file:tools/refactor/ProjectAssessment.scala"]
ProjectAssessment.pipeline {
  mode = plan
  report = "target/refactor-pipeline-example"
  scopeReview = "refactor-audit/server-clock/README.md"
  rewrites = [{ config = "tools/refactor/server-clock-apply.conf", files = [modules] }]
  baselineTests = ["tools/refactor/server-clock-probe-tests.conf"]
  afterTests = ["tools/refactor/server-clock-tests-after.conf"]
  compileConfig = "tools/refactor/server-clock-build.conf"
  identityChecks = [{ config = "tools/refactor/server-clock-verify.conf", files = ["tools/refactor/ServerClockVerification.scala"] }]
}
