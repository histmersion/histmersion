# ADR 0027 (owner decision 6): the CLI's Boolean flag newtypes become two-case enums. Each entry names the newtype,
# the case for `true`, the case for `false`, and the predicate its `.value` becomes.
rules = ["file:tools/refactor/BooleanEnums.scala"]
BooleanEnums {
  paths = ["modules/cli/src/"]
  report = "target/refactor/boolean-enums-cli.tsv"
  enums = [
    { newtype = "com/histmersion/cli/Cli.JsonOutput.", yes = "Json", no = "Text", test = "asJson" }
    { newtype = "com/histmersion/cli/Cli.QuietOutput.", yes = "Quiet", no = "Verbose", test = "quiet" }
    { newtype = "com/histmersion/cli/Cli.Strict.", yes = "Strictly", no = "Leniently", test = "strictly" }
    { newtype = "com/histmersion/cli/Client.Write.", yes = "Changes", no = "Reads", test = "changes" }
    { newtype = "com/histmersion/cli/ArticlePatches.FilterFlags.Clear.", yes = "Cleared", no = "Kept", test = "clears" }
    { newtype = "com/histmersion/cli/ImportTarget.Explicit.", yes = "Asked", no = "Generated", test = "asked" }
    { newtype = "com/histmersion/cli/CalibreCmd.Unlinked.", yes = "OnlyUnlinked", no = "Every", test = "onlyUnlinked" }
    { newtype = "com/histmersion/cli/AddOptions.Yes.", yes = "Confirmed", no = "Ask", test = "confirmed" }
    { newtype = "com/histmersion/cli/AddOptions.Unsigned.", yes = "AllowUnsigned", no = "RequireSigned", test = "allowsUnsigned" }
    { newtype = "com/histmersion/cli/AddOptions.Verify.", yes = "Check", no = "Skip", test = "checks" }
    { newtype = "com/histmersion/cli/ArticleCommand.Fix.", yes = "Fix", no = "Report", test = "fixes" }
    { newtype = "com/histmersion/cli/TargetFlags.Views.", yes = "WithViews", no = "WithoutViews", test = "withViews" }
    { newtype = "com/histmersion/cli/PluginTemplate.Request.AgentNotes.", yes = "WithNotes", no = "WithoutNotes", test = "withNotes" }
    { newtype = "com/histmersion/cli/Calibre.GapEntry.Counted.", yes = "Counted", no = "Uncounted", test = "counts" }
    { newtype = "com/histmersion/cli/Calibre.Push.Replace.", yes = "Replace", no = "Keep", test = "replaces" }
  ]
}
