# Row 32 (ADR 0029 section 7, slice 5): once V116 drops the creator columns' default, a test's own fixture INSERT into
# a record table must name a creator too. CreatorRewrite with `testFixtures = true` touches only test sources: each
# such INSERT (one VALUES row or several, or an INSERT ... SELECT) gets the creator column and the value `testLiteral`
# (an unknown creator: a fixture row was made by no one the test describes). `skipTests` are the suites whose inserts
# run at an older schema (the migration rehearsals) or are themselves the check's fixtures. Dry run; the apply is
# creator-fixtures-apply.conf. After `sbt Test/compile`, from the worktree root:
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh --config tools/refactor/creator-fixtures.conf \
#     --sourceroot . --files modules
rules = ["file:tools/refactor/CreatorRewrite.scala"]
CreatorRewrite {
  report = "refactor-audit/provenance/creator-fixtures.tsv"
  apply = false
  testFixtures = true
  skipTests = ["MigrateSquashSuite.scala", "ProvenanceSuite.scala"]
  tables = [
    sources, findings, edges, unresolved_edges, assessments, source_candidates, candidate_watches,
    articles, article_versions, review_ledgers,
    assets, asset_links,
    events, places, periods, attestations, corrections, place_overrides, event_link_candidates,
    queue_items, goals, goal_links, goal_schedules, approvals, jobs, agent_managers, manager_hints,
    notes, bookmarks
  ]
}
