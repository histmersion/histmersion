rules = ["file:tools/refactor/AstRecipe.scala"]
AstRecipe {
  manifest = "refactor-audit/media-source-boundary/build-2/sources.tsv"
  report = "refactor-audit/unread-projection/foundation-preview-1"
  edits = [{
    path = "modules/server/src/main/scala/com/histmersion/domain/library/sources/SourceReadable.scala"
    before = """UnreadItem(
  ItemKey(ck),
  Title(title),
  authors.map(AuthorName(_)),
  year.map(Year(_)),
  status.flatMap(summon[WireEnumValues[Source.Status]].fromWire),
  start.map(y => Year(y.toInt)),
  end.map(y => Year(y.toInt))
)"""
    after = "SourceReadable.row(ck, title, authors, year, status, start, end)"
  }]
  appendStats {
    "modules/server/src/main/scala/com/histmersion/domain/library/sources/SourceReadable.scala" = """object SourceReadable:
  private[sources] def row(
      ck: String,
      title: String,
      authors: List[String],
      year: Option[Int],
      status: Option[String],
      start: Option[Long],
      end: Option[Long]
  ): UnreadItem =
    UnreadItem(
      ItemKey(ck),
      Title(title),
      authors.map(AuthorName(_)),
      year.map(Year(_)),
      status.flatMap(summon[WireEnumValues[Source.Status]].fromWire),
      start.map(y => Year(y.toInt)),
      end.map(y => Year(y.toInt))
    )"""
  }
  creates {
    "modules/server/src/test/scala/com/histmersion/domain/library/sources/UnreadProjectionSuite.scala" = """package com.histmersion.domain.library.sources

import com.histmersion.domain.{Caller, Referable, Referables}
import com.histmersion.domain.personal.{PersonalControllers, PersonalState}
import com.histmersion.domain.personal.bookmarks.BookmarkService
import com.histmersion.domain.personal.notes.NoteService
import com.histmersion.domain.personal.reading.ReadingService
import com.histmersion.domain.personal.marks.{Readable, UnreadItem}
import com.histmersion.util.data.maintenance.WriteGate
import java.time.{Clock, Instant, ZoneOffset}
import java.util.concurrent.atomic.AtomicReference

class UnreadProjectionSuite extends munit.FunSuite:
  private def render(item: UnreadItem) =
    val state = AtomicReference(PersonalState())
    val items = Referables(List(Referable.InMemory(SourceReferable.Kind)))
    val readable = Readable.InMemory(SourceReferable.Kind)
    readable.add(item, None)
    val controller = PersonalControllers(
      BookmarkService.InMemory(state, items),
      NoteService.InMemory(state, items),
      ReadingService.InMemory(state, items, List(readable)),
      WriteGate(),
      Clock.fixed(Instant.parse("2026-11-01T00:00:00Z"), ZoneOffset.UTC)
    )
    controller.unread(Caller.Local, Some("source"), None, None).toOption.get.rows.head

  test("every library status keeps its wire spelling in the personal projection"):
    List("foundational", "current", "contested", "superseded", "debunked", "retracted", "unassessed").foreach { spelling =>
      val item = SourceReadable.row("reader2026_a", "Title", Nil, None, Some(spelling.toUpperCase(java.util.Locale.ROOT)), None, None)
      assertEquals(render(item).status, Some(spelling))
    }

  test("missing and unknown statuses stay absent, without trimming or inventing a default"):
    List(None, Some("unknown"), Some(" current ")).foreach { raw =>
      assertEquals(render(SourceReadable.row("reader2026_a", "Title", Nil, None, raw, None, None)).status, None)
    }

  test("author spelling, order, duplicates and whitespace survive the projection"):
    val authors = List("  Doe, Ann  ", "Li", "Li", "")
    val shown = render(SourceReadable.row("reader2026_a", "Title", authors, None, None, None, None))
    assertEquals(shown.authors, authors)

  test("identity, title, year and period survive the same conversion and rendering"):
    val shown = render(SourceReadable.row("reader2026_a", "  A title  ", Nil, Some(2026), None, Some(-1200L), Some(-1100L)))
    assertEquals((shown.id.value: String, shown.title, shown.year, shown.periodStart, shown.periodEnd),
      ("reader2026_a", "  A title  ", Some(2026), Some(-1200L), Some(-1100L)))
"""
  }
}
