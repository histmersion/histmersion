# After the PR #147 merge rows (bridge-types-pr147.conf): a round trip written through an alias's term,
# `Alias(x.value)` with `x` of the canonical type, is dropped too. SemanticDB records nothing for an export forwarder,
# so the aliases come from the same list BridgeTypes applied. Round trips and comparisons only.
rules = ["file:tools/refactor/ValueOntoType.scala"]
ValueOntoType {
  operations = false
  forwarders = true
  forwardersFrom = "tools/refactor/bridge-aliases-pr147.txt"
  report = "target/refactor/value-onto-type-pr147.tsv"
}
