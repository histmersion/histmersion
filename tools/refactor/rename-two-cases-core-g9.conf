# G9 (namespaces, not prefixes), core's server-side enums: the Boolean newtypes they replaced carried
# @tolerated(G9Prefix), removed with them (boolean-enums-core.conf); the enums take names that start with no sibling
# type's name. RenameSymbols renames every reference by SemanticDB symbol; the definitions are renamed by hand.
# After `sbt compile Test/compile`, from the worktree root:
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh --config tools/refactor/rename-two-cases-core-g9.conf \
#     --sourceroot . --auto-classpath --auto-classpath-roots target/out --files modules
rules = ["file:tools/refactor/RenameSymbols.scala"]
RenameSymbols {
  renames {
    "com/histmersion/domain/GoalFocus.Work.PersonHeld#" = "HeldByPerson"
    "com/histmersion/domain/GoalFocus.Work.PersonHeld." = "HeldByPerson"
    "com/histmersion/domain/GoalFocus.Work.ApprovalByPerson#" = "ApprovedBy"
    "com/histmersion/domain/GoalFocus.Work.ApprovalByPerson." = "ApprovedBy"
    "com/histmersion/domain/IngestBacklog.RepairFacts.WatcherExists#" = "Watching"
    "com/histmersion/domain/IngestBacklog.RepairFacts.WatcherExists." = "Watching"
    "com/histmersion/domain/IngestBacklog.RepairFacts.WatcherAutoIngest#" = "Ingesting"
    "com/histmersion/domain/IngestBacklog.RepairFacts.WatcherAutoIngest." = "Ingesting"
    "com/histmersion/domain/AutopilotPolicy.PlannedFacts.SlugFree#" = "Availability"
    "com/histmersion/domain/AutopilotPolicy.PlannedFacts.SlugFree." = "Availability"
    "com/histmersion/domain/AutopilotPolicy.DraftFacts.SlugFree#" = "Availability"
    "com/histmersion/domain/AutopilotPolicy.DraftFacts.SlugFree." = "Availability"
    "com/histmersion/domain/ReviewArticle.FixRun#" = "Pass"
    "com/histmersion/domain/ReviewArticle.FixRun." = "Pass"
  }
}
