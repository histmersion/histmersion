# ErrorTypesToProblems, second pass: converts the methods target/error-types/plan.tsv qualifies under `only` and
# rebuilds the wrapper at their calls. Run right after error-types-collect.conf (same `only`), over the same files.
rules = ["file:tools/refactor/ErrorTypesToProblems.scala"]
ErrorTypesToProblems {
  mode = apply
  plan = "target/error-types/plan.tsv"
  only = ["modules/cli/"]
}
