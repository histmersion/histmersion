include "model-concepts-preview-v12.conf"
Preview {
  target = "target/model-concepts-preview-13"
  report = "refactor-audit/models/reviews/multi-concept-1/preview-13"
  methods = ${Preview.methods} [
    {owner = "com/histmersion/cli/Client#job().", parameters = [id], fields {id = "com.histmersion.api.jobs.JobInfo.Id"}},
    {owner = "com/histmersion/cli/IngestCmd.pollJob().", parameters = [c, id, waited], fields {id = "com.histmersion.api.jobs.JobInfo.Id"}},
    {owner = "com/histmersion/cli/JobFollow.job().", parameters = [fetch, id, waited, sleep, progress, clear], fields {fetch = "com.histmersion.api.jobs.JobInfo.Id", id = "com.histmersion.api.jobs.JobInfo.Id"}, callbackFields = [fetch]}
  ]
  scalarBoundaryOwners = ${Preview.scalarBoundaryOwners} [
    "com/histmersion/cli/Client#job().",
    "com/histmersion/domain/catalogue/maptiles/TileFeatures.event()."
  ]
  containerBoundaryOwners = ${Preview.containerBoundaryOwners} [
    "com/histmersion/domain/ReviewArticle.citedLines()."
  ]
}
