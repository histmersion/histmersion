# Owner decision 2026-11-28 (PR #147 pair table, section 3, "merge" rows): each newtype in bridge-aliases-pr147.txt
# becomes an export alias of the type it is merged into (hand-picked from the table: same base type and constraint, the
# member's module sees the canonical's module, no transitive merging, plugin SPI types unchanged). ValueOntoType
# (value-onto-type-n1.conf) then drops the round trips the aliases leave. Objects with a body, a top-level target or a
# shadowed name are skipped by the rule and done by hand.
rules = ["file:tools/refactor/BridgeTypes.scala"]
BridgeTypes {
  aliasesFrom = "tools/refactor/bridge-aliases-pr147.txt"
  report = "target/refactor/bridge-types-pr147.tsv"
}
