# ErrorTypesToProblems, first pass (G60, speed plan C): the facts (target/error-types/plan.tsv), a verdict per method
# (refactor-audit/g60/error-types/report.tsv) and every wrapper field a conversion cannot drop (carriers.tsv). Read-only.
# `only` limits the methods the next apply converts (module by module); callers are patched wherever they are.
# One round, from the worktree root, after `sbt compile Test/compile` (the SemanticDB must be current):
#   S="scala-$(bash tools/refactor/scalafix.sh --print scala)"
#   R="--semanticdb-targetroots $(find target/out/*/"$S" -maxdepth 2 -type d \( -name meta -o -name test-meta \) | paste -sd, -)"
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh --config tools/refactor/error-types-collect.conf \
#     --sourceroot . --auto-classpath --auto-classpath-roots target/out $R --files modules
#   (the same with error-types-apply.conf), then compile and test.
rules = ["file:tools/refactor/ErrorTypesToProblems.scala"]
ErrorTypesToProblems {
  mode = collect
  plan = "target/error-types/plan.tsv"
  report = "refactor-audit/g60/error-types/report.tsv"
  carriers = "refactor-audit/g60/error-types/carriers.tsv"
  # done: modules/cli/ (2 rounds, 41e659b20)
  only = ["modules/server/", "modules/db/", "modules/api/", "modules/core/"]
  refuseExtra = "Code\\("
}
