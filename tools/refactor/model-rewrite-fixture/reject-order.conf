rules = ["file:tools/refactor/ModelTypeRewrite.scala"]
ModelTypeRewrite {
  records = [{
    owner = "migrationfixture/Page#"
    parameters = [total, offset]
    fields = {
      offset = "migrationfixture.Offset"
      total = "migrationfixture.RowCount"
    }
  }]
  results = { "migrationfixture/Calls.offset()." = "migrationfixture.Offset" }
}
