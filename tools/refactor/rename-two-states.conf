# Owner clarification 2026-11-28: the string-enum codecs of the wire's two-state enums belong to the api layer, so
# TwoStates moves from util.json (modules/json) to the api's json package, com.histmersion.api.json (modules/api; the
# lint places com.histmersion.api itself in no feature, and api.json is util.json, which every layer may use).
# MoveImport (syntactic) repoints each single-name import of it; the file itself, and the imports that name it beside
# others, are moved by hand.
#   bash tools/refactor/scalafix.sh --config tools/refactor/rename-two-states.conf --sourceroot . --syntactic \
#     --files modules
rules = ["file:tools/refactor/MoveImport.scala"]
MoveImport {
  moves {
    "com.histmersion.util.json.TwoStates" = "com.histmersion.api.json.TwoStates"
    "com.histmersion.api.TwoStates" = "com.histmersion.api.json.TwoStates"
  }
}
