# G1 for the clients: the web's plain-typed defs that one newtype feeds (GuidelineInventory's G44plaindef) take that
# newtype. Defs fed by two different newtypes, JS facades (GlMap) and parsers of raw text stay for a decision; so do
# ItemMenu.entries (its byline goes on into String renderers and most callers hold plain text: retyped, it added five
# constructions to remove one unwrap) and TreeTab.show (a def of a standalone object whose first parameter is a
# project type is a G3misplaced finding: it waits for the G34 lane). BaseMaps.docsLink was retyped, then its join
# moved onto UiConfig.DocsUrl (`page`) by hand and its callers call that.
rules = ["file:tools/refactor/RetypeToNewtype.scala"]
RetypeToNewtype {
  retypes = [
    { param = "com/histmersion/web/BaseMaps.docsLink().(docsUrl)", newtype = "com/histmersion/api/instance/UiConfig.DocsUrl.", tpe = "UiConfig.DocsUrl", wrap = "UiConfig.DocsUrl" }
    { param = "com/histmersion/web/map/MapMotion.animates().(systemReduced)", newtype = "com/histmersion/web/map/MotionPref.SystemReduced.", tpe = "MotionPref.SystemReduced", wrap = "MotionPref.SystemReduced" }
    { param = "com/histmersion/web/map/MapMotion.heldBySystem().(systemReduced)", newtype = "com/histmersion/web/map/MotionPref.SystemReduced.", tpe = "MotionPref.SystemReduced", wrap = "MotionPref.SystemReduced" }
  ]
  report = "target/refactor/retype-to-newtype-clients.tsv"
}
