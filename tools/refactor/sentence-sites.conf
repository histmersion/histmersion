# The sentence ledger's sites, run on its own (G60, speed plan B; tools/refactor/SentenceSites.scala). The build runs the
# same rule inside the guideline inventory (guideline-ratchet.conf), and SentenceLedgerSuite compares its rows with
# architecture/sentences.tsv. Run from the worktree root after `sbt compile`:
#   bash tools/refactor/scalafix.sh \
#     --config tools/refactor/sentence-sites.conf --sourceroot . --auto-classpath \
#     --auto-classpath-roots target/out --exclude '**/src/test/**' --files modules
rules = ["file:tools/refactor/SentenceSites.scala"]
SentenceSites {
  report = "target/guidelines/sentence-sites.tsv"
}
