    "com.histmersion.api.views.EventDetail.wikidata" = "com.histmersion.api.catalogue.EventEntry.Wikidata"
    "com.histmersion.api.views.EventDetail.tier" = "com.histmersion.api.catalogue.EventEntry.Tier"
  }
