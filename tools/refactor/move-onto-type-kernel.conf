# G34 batch 1, the shared kernel (docs/research-domain-model/objects.md), first run: DeepTime.SignedYear becomes the
# top-level newtype domain.SignedYear (core: what it does stays in core's ratchets); Years and YearFmt move onto api's
# Year (and TimeSpan). The second run (move-onto-type-kernel-2.conf) moves DeepTime's functions onto SignedYear.
# ConfidenceStyle stays: Html (util.markdown) uses it, and on library's Confidence that use would point upwards. After `sbt compile Test/compile`, from the worktree root:
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh --config tools/refactor/move-onto-type-kernel.conf \
#     --sourceroot . --auto-classpath --auto-classpath-roots target/out --files modules
rules = ["file:tools/refactor/MoveOntoType.scala"]
MoveOntoType {
  report = "refactor-audit/lane-objects/move-onto-type-kernel.tsv"
  moves = [
    { source = "com/histmersion/domain/DeepTime.", member = "SignedYear", to = "com/histmersion/domain/", form = "toplevel",
      file = "modules/core/src/main/scala/com/histmersion/domain/SignedYear.scala" }
    { source = "com/histmersion/api/Years.", to = "com/histmersion/api/catalogue/Year." }
    { source = "com/histmersion/api/YearFmt.", member = "apply", to = "com/histmersion/api/catalogue/Year.", form = "companion", name = "show" }
    { source = "com/histmersion/api/YearFmt.", member = "period", to = "com/histmersion/api/catalogue/Year." }
    { source = "com/histmersion/api/YearFmt.", member = "openPeriod", to = "com/histmersion/api/catalogue/Year." }
    { source = "com/histmersion/api/YearFmt.", member = "span", to = "com/histmersion/api/TimeSpan.", name = "show" }
    { source = "com/histmersion/api/YearFmt.", member = "spanLong", to = "com/histmersion/api/TimeSpan.", name = "showLong" }
  ]
}
