# The owner's display decisions of 2026-11-24 for the enum spellings and codes the web shows: a reader sees the
# value's label, never its wire spelling. Where Wording names a value (run and approval states, job kinds) that is the
# label; elsewhere the spelling read as words (Wording.humanize). Tooltips beside a label show the label too.
rules = ["file:tools/refactor/DisplayAsIs.scala"]
DisplayAsIs {
  forms = [
    { newtype = "com/histmersion/api/automation/Run.State.Wire.", instance = "given Display[T] = Display(wire => parse(wire).fold(Wording.humanize(Wording.Id(wire.value)))(Wording.runState))", imports = ["com.histmersion.api.Wording"] }
    { newtype = "com/histmersion/api/automation/Approval.State.Wire.", instance = "given Display[T] = Display(wire => parse(wire).fold(Wording.humanize(Wording.Id(wire.value)))(Wording.approvalState))", imports = ["com.histmersion.api.Wording"] }
