rules = ["file:tools/refactor/ModelTypeRewrite.scala"]
ModelTypeRewrite {
  records = [{ owner = "boundaryfixture/Page#", parameters = [offset, total], fields = { offset = "boundaryfixture.Offset", total = "boundaryfixture.RowCount" } }]
  results = { "boundaryfixture/Paging.next()." = "boundaryfixture.Offset" }
  optionalResults = ["boundaryfixture/Paging.next()."]
  scalarBoundaryOwners = ["boundaryfixture/Paging.next().", "boundaryfixture/Paging.empty()."]
  scalarBoundaryCalls = { "boundaryfixture/Render.count()." = [0] }
}
