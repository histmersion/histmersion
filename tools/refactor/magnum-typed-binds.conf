# G58: Magnum 2.0 binds every sql"..." splice through its codec; see MagnumTypedBinds.scala. Syntactic:
#   bash tools/refactor/scalafix.sh --config tools/refactor/magnum-typed-binds.conf --sourceroot . --files modules/server/src/test
# importInto = the suites whose newtype splices the 2.0.0 compile reported without a codec in scope
# (refactor-audit/concept-table/compile-mg2-bump2.log).
rules = ["file:tools/refactor/MagnumTypedBinds.scala"]
MagnumTypedBinds {
  importInto = [
    "domain/automation/agents/AgentEngineSuite.scala",
    "domain/automation/agents/ModelChainRunSuite.scala",
    "domain/automation/agents/PlanQuotaRunSuite.scala",
    "domain/library/collections/CalibreCommandsSuite.scala",
    "server/AcquireHandlerSuite.scala",
    "server/BootstrapSuite.scala",
    "server/agents/ManagerAutopilotSuite.scala",
    "server/agents/ManagerPhase2Suite.scala",
    "server/agents/ManagerRunSuite.scala",
    "server/agents/SchedulerDbSuite.scala",
    "server/media/PluginMediaImportSuite.scala"
  ]
}
