include "capabilities.conf"
CapabilityAccess {
  report = "refactor-audit/fixtures"
  sourceRoots = []
  verifyFixtures = true
  expectedFiles = ["fixtures.scala", "clock-fixtures.scala", "config-fixtures.scala", "import-fixtures.scala", "transaction-fixtures.scala", "transaction-helpers.scala"]
