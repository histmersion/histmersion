    { id = bootstrap-environment, owner = "com/histmersion/domain/detectorfixtures/Bootstrap.", capabilities = [environment], reason = "Fixture tests capability-specific permission." },
    { id = storage-adapter, owner = "com/histmersion/domain/detectorfixtures/StorageAdapter.", capabilities = [filesystem], reason = "Fixture tests approved storage adapter." }
