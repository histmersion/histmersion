rules = ["file:tools/refactor/RelocateOwners.scala"]
RelocateOwners {
  mode = preview
  report = "refactor-audit/spool-ownership/preview-1"
  roots = [modules]
  moves = [{
    from = "modules/server/src/main/scala/com/histmersion/util/ocr/Spool.scala"
    to = "modules/server/src/main/scala/com/histmersion/domain/library/acquisition/Spool.scala"
    oldPackage = "com.histmersion.util.ocr"
    newPackage = "com.histmersion.domain.library.acquisition"
    names = [Spool]
    symbols { "com/histmersion/util/ocr/Spool#" = Spool }
  }]
}
