# G44 splices in the clients: an s"…" that splices as-is newtypes moves to shown"…", which takes a newtype only
# through its display form. The as-is types are those the DisplayAsIs configs decided.
rules = ["file:tools/refactor/ShownInterpolation.scala"]
ShownInterpolation {
  paths = ["modules/cli/src/main/", "modules/web/src/main/"]
  asIsFrom = ["tools/refactor/display-as-is-clients.conf", "tools/refactor/display-as-is-clients-2.conf",
    "tools/refactor/display-as-is-cli.conf", "tools/refactor/display-as-is-clients-3.conf",
    "tools/refactor/display-as-is-clients-4.conf"]
  asIs = ["com/histmersion/cli/Calibre.Book.Id.", "com/histmersion/api/automation/Queue.QueueItem.Id.",
    "com/histmersion/api/automation/Agents.ApprovalInfo.Id.", "com/histmersion/cli/AuditFinding.CalibreId.",
    "com/histmersion/api/media/AssetLink.Id.", "com/histmersion/api/automation/Managers.HintProposal.Hint."]
  report = "target/refactor/shown-interpolation-clients.tsv"
}
