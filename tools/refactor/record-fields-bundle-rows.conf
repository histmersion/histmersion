# Row 32 (ADR 0029 section 5, slice 4): the database rows a bundle export reads its records from carry the stored
# creator as JSON text (`creator::text`), which the export decodes into the record's `creator`. AddRecordFields appends
# the column to the eleven rows (the asset links are read as a tuple, by hand).
# After `sbt Test/compile`, from the worktree root:
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh --config tools/refactor/record-fields-bundle-rows.conf \
#     --sourceroot . --auto-classpath --auto-classpath-roots target/out --files modules/db/src/main
rules = ["file:tools/refactor/AddRecordFields.scala"]
AddRecordFields {
  report = "refactor-audit/provenance/record-fields-bundle-rows.tsv"
  imports = ["com.histmersion.util.database.Jsonb"]
  fields {
    "com/histmersion/domain/library/sources/BSourceRow#" = "creator: Option[Jsonb.JsonText] = None"
    "com/histmersion/domain/library/sources/BFindingRow#" = "creator: Option[Jsonb.JsonText] = None"
    "com/histmersion/domain/research/articles/BArticleRow#" = "creator: Option[Jsonb.JsonText] = None"
    "com/histmersion/domain/research/articles/BVersionRow#" = "creator: Option[Jsonb.JsonText] = None"
    "com/histmersion/domain/media/assets/AssetBundleRow#" = "creator: Option[Jsonb.JsonText] = None"
    "com/histmersion/domain/catalogue/evidence/BAttestationFullRow#" = "creator: Option[Jsonb.JsonText] = None"
    "com/histmersion/domain/catalogue/events/BEventRow#" = "creator: Option[Jsonb.JsonText] = None"
    "com/histmersion/domain/automation/goals/BGoalRow#" = "creator: Option[Jsonb.JsonText] = None"
    "com/histmersion/domain/automation/worklists/BQueueRow#" = "creator: Option[Jsonb.JsonText] = None"
    "com/histmersion/domain/catalogue/places/BPlaceRow#" = "creator: Option[Jsonb.JsonText] = None"
    "com/histmersion/domain/catalogue/periods/BPeriodRow#" = "creator: Option[Jsonb.JsonText] = None"
  }
}
