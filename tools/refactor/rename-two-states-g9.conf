# G9 (namespaces, not prefixes): the Boolean newtypes these enums replaced carried @tolerated(G9Prefix) tolerations,
# removed with them; the enums now take names that start with no other type's name. RenameSymbols renames every
# reference by SemanticDB symbol; the definitions themselves are renamed by hand afterwards.
# After `sbt compile Test/compile`, from the worktree root:
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh --config tools/refactor/rename-two-states-g9.conf \
#     --sourceroot . --auto-classpath --auto-classpath-roots target/out --files modules
rules = ["file:tools/refactor/RenameSymbols.scala"]
RenameSymbols {
  renames {
    "com/histmersion/api/exchange/InitPlan.PeriodPresets#" = "Presets"
    "com/histmersion/api/exchange/InitPlan.PeriodPresets." = "Presets"
    "com/histmersion/api/instance/UiConfig.AgentsEnabled#" = "AgentSwitch"
    "com/histmersion/api/instance/UiConfig.AgentsEnabled." = "AgentSwitch"
    "com/histmersion/api/automation/Autopilot.EngineStatus.AgentsEnabled#" = "AgentSwitch"
    "com/histmersion/api/automation/Autopilot.EngineStatus.AgentsEnabled." = "AgentSwitch"
    "com/histmersion/api/automation/Autopilot.EngineStatus.ManagersEnabled#" = "ManagingSwitch"
    "com/histmersion/api/automation/Autopilot.EngineStatus.ManagersEnabled." = "ManagingSwitch"
    "com/histmersion/api/catalogue/Place.Override.PeriodSet#" = "Dated"
    "com/histmersion/api/catalogue/Place.Override.PeriodSet." = "Dated"
    "com/histmersion/api/catalogue/EventSummary.ScaleStated#" = "Basis"
    "com/histmersion/api/catalogue/EventSummary.ScaleStated." = "Basis"
  }
}
