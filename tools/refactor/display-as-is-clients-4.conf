# The owner's category defaults of 2026-11-24, second pass over the ShownInterpolation blocking list (cli and web
# main): composed texts (titles, notes, rationales, hints, summaries, citations, help and question texts, version
# strings), ids shown as identifiers (Calibre ids, collection and asset ids, bookmark ids, problem and media ids,
# config keys), and file names and paths the CLI and the settings pages print. Out, as in clients-3: wire spellings
# and kinds, CSS class and icon names, field names a filter sends, timestamps, years, coordinates, counts and
# measures, article slugs (shown as their title where not an identifier) and the "decide" items; and the util,
# config and domain modules' types.
