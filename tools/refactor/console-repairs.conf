rules = ["file:tools/refactor/RepairBoundaries.scala"]
RepairBoundaries {
  mode = apply
  report = "refactor-audit/console-repairs.tsv"
  rewrites = [
    { id = settings-cache, paths = ["/cli/Settings.scala"], kind = stat,
      from = "def app(using console: com.histmersion.util.console.Console): AppConfig = __body",
      to = "lazy val app: AppConfig = __body" },
    { id = settings-log, paths = ["/cli/Settings.scala"],
      from = "console.errorLine(__message)", to = "scribe.warn(__message)" }
  ]
}
