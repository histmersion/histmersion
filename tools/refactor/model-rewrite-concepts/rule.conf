rules = ["file:tools/refactor/ModelTypeRewrite.scala"]
ModelTypeRewrite {
  widenNumericBoundaries = true
  scalarBoundaryOwners = ["conceptfixture/Rendering.sorted().", "conceptfixture/Rendering.total().", "conceptfixture/Rendering.below()."]
  containerBoundaryCalls { "conceptfixture/Rendering.strings()." = [0], "conceptfixture/Rendering.optional()." = [0] }
  containerBoundaryOwners = ["conceptfixture/Rendering.normalized().", "conceptfixture/Rendering.forwarded()."]
  records = [{owner = "conceptfixture/Report#", parameters = [label, title, bytes, lat, doi, authors, year], fields {
    label = "conceptfixture.Label", title = "conceptfixture.Title", bytes = "conceptfixture.ByteCount", lat = "conceptfixture.Latitude",
    doi = "conceptfixture.Doi", authors = "conceptfixture.AuthorName", year = "conceptfixture.Year"
  }, optionalFields = [doi], listFields = [authors]}]
  methods = [
    {owner = "conceptfixture/Calls.echo().", parameters = [label], fields {label = "conceptfixture.Label"}},
    {owner = "conceptfixture/Calls.aliases().", parameters = [keys], fields {keys = "conceptfixture.Label"}, setFields = [keys]},
    {owner = "conceptfixture/Calls.forwardedAliases().", parameters = [keys], fields {keys = "conceptfixture.Label"}, setFields = [keys]},
    {owner = "conceptfixture/Calls.aliasContains().", parameters = [keys, label], fields {keys = "conceptfixture.Label", label = "conceptfixture.Label"}, setFields = [keys]}
  ]
  setResults = ["conceptfixture/Calls.aliases().", "conceptfixture/Calls.forwardedAliases().", "conceptfixture/Calls.repeatedAliases()."]
  results {
    "conceptfixture/Calls.aliases()." = "conceptfixture.Label"
    "conceptfixture/Calls.forwardedAliases()." = "conceptfixture.Label"
    "conceptfixture/Calls.repeatedAliases()." = "conceptfixture.Label"
    "conceptfixture/Calls.label()." = "conceptfixture.Label"
    "conceptfixture/Calls.authors()." = "conceptfixture.AuthorName"
    "conceptfixture/Calls.echo()." = "conceptfixture.Label"
    "conceptfixture/Calls.echoed()." = "conceptfixture.Label"
  }
  listResults = ["conceptfixture/Calls.authors()."]
  primitiveTypes {
    "conceptfixture.Label" = "java/lang/String#", "conceptfixture.Title" = "java/lang/String#",
    "conceptfixture.Doi" = "java/lang/String#", "conceptfixture.AuthorName" = "java/lang/String#",
    "conceptfixture.ByteCount" = "scala/Long#", "conceptfixture.Latitude" = "scala/Double#", "conceptfixture.Year" = "scala/Int#"
  }
}
