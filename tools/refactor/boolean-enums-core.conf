# Server-side Booleans, step core (handoff-primitives-3 "step 4"): each Boolean newtype of modules/core becomes a two-case
# enum whose companion extends the codec-free TwoCases (modules/newtype). The domain has no codecs: where such an enum
# sits in JSON, the api's NewtypeCodecs.twoCases lifts its codec at the boundary (true the first case, false the second,
# as the Boolean was written). Core first: db and server use core's enums, so this pass runs over every module.
# Run order (each step after `sbt compile Test/compile`, from the worktree root, SCALAFIX_JAVA_OPTS="-Xmx6g -Xss8m"):
#   1. bash tools/refactor/scalafix.sh --config tools/refactor/boolean-enums-core.conf --sourceroot . \
#        --auto-classpath --auto-classpath-roots target/out --files modules
#   2. two-states-bridges.conf (syntactic, it matches TwoCases companions too): temporary bridges
#   3. step 1's command with --settings.BooleanEnums.bridges=remove
rules = ["file:tools/refactor/BooleanEnums.scala"]
BooleanEnums {
  semanticdbRoots = ["target/out/jvm/scala-{scalaVersion}", "target/out/sjs1/scala-{scalaVersion}"]
  report = "target/refactor/boolean-enums-core.tsv"
  parent = "TwoCases"
  parentImport = "com.histmersion.TwoCases"
  enums = [
