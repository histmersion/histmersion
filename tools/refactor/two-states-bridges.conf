# Step 2 of the wire Booleans (boolean-enums-wire.conf is step 1): beside each two-state enum's predicate, the Boolean
# newtype's old surface as a temporary bridge, `def apply(value: Boolean)` and `extension (x) def value`, so that the
# sites step 1 could not resolve (a lambda's `_.value`, a tuple's `t._2.value`, a construction through an export alias)
# still compile. Step 3 (boolean-bridges-remove.conf) rewrites those sites by the bridges' symbols and deletes the
# bridges. A syntactic rule: it runs on the rewritten sources before they compile again.
rules = ["file:tools/refactor/TwoStatesBridges.scala"]
