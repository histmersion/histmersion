# X4 / G89, the rewrite: write-permit.conf (the dry run) with `apply = true`. Keep the two in step.
#   bash tools/refactor/scalafix.sh --config tools/refactor/write-permit-apply.conf --sourceroot . --files modules
# Then scalafmtOnly the changed files (project by project) and write the `stop` rows' permit sources by hand.
rules = ["file:tools/refactor/WritePermitRewrite.scala"]
WritePermitRewrite {
  report = "refactor-audit/lane-data/write-permit-applied.tsv"
  apply = true
  # the standard library's eager higher-order calls, and the project's that run their function before returning
  # (each read: the function is called in the body, never stored or handed to a thread)
  synchronous = [
    "scala/util/Either#", "scala/util/Try", "scala/Option#", "scala/collection/", "scala/package.List",
    "scala/util/Using", "scala/util/control/", "java/util/Optional#",
    "com/histmersion/util/data/maintenance/WriteGate#guard().",
    "com/histmersion/util/database/WritePermit.Gate#permit().",
    "com/histmersion/util/database/WritePermit.Gate#writing().",
    "com/histmersion/util/jobs/Workers#writing().",
    "com/histmersion/domain/automation/agents/Engine#withRun().",
    "com/histmersion/server/agents/CliProcess.withDir().",
    "com/histmersion/server/agents/RefreshGate#exclusive().",
    "com/histmersion/domain/library/workflows/AcquisitionSweepRules.ingestPicks().",
    "com/histmersion/domain/library/workflows/AcquisitionSweepRules.ingestOa().",
    "com/histmersion/domain/automation/scheduler/SchedulerService#pass().",
    "com/histmersion/domain/automation/scheduler/SchedulerService#inputs().",
    "com/histmersion/domain/AcquireMatch.describe().",
    "com/histmersion/pluginhost/PluginEvents.readPart().",
    "com/histmersion/util/jobs/Workers#each()."
  ]
  # SELECTs opened with `transact` (read in AutopilotRepo: get, strategy, lastDigest, drain)
  reads = [
    "modules/server/src/main/scala/com/histmersion/domain/automation/autopilot/AutopilotRowService.scala:57",
    "modules/server/src/main/scala/com/histmersion/domain/automation/autopilot/AutopilotRowService.scala:70",
    "modules/server/src/main/scala/com/histmersion/domain/automation/autopilot/AutopilotRowService.scala:73",
    "modules/server/src/main/scala/com/histmersion/domain/automation/autopilot/AutopilotRowService.scala:76"
  ]
  # the calls whose block holds a permit of its own: an operation's (guard, permit, writing), a worker unit's (unit,
  # detached, a background job's body), the restore's (exclusively)
  providers = [
    "com/histmersion/util/data/maintenance/WriteGate#guard().",
    "com/histmersion/util/data/maintenance/WriteGate#writing().",
    "com/histmersion/util/data/maintenance/WriteGate#exclusively().",
    "com/histmersion/util/database/WritePermit.Gate#permit().",
    "com/histmersion/util/database/WritePermit.Gate#writing().",
    "com/histmersion/util/database/WritePermit.Gate#unit().",
    "com/histmersion/util/jobs/Workers#unit().",
    "com/histmersion/util/jobs/Workers#detached().",
    "com/histmersion/util/jobs/BackgroundJob.start().",
    "com/histmersion/domain/catalogue/CatalogueJobs#start().",
    "com/histmersion/domain/media/MediaJobs#start().",
    "com/histmersion/util/data/exchange/MergeApplyJobs#start()."
  ]
}
