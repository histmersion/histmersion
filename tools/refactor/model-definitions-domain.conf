rules = ["file:tools/refactor/AstRecipe.scala"]
AstRecipe {
  manifest = "refactor-audit/models/reviews/multi-concept-1/applied-server-build-5/sources.tsv"
  appliedPlans = [
    "refactor-audit/models/reviews/definitions-research-2/plan.tsv",
    "refactor-audit/models/reviews/definitions-media-1/plan.tsv",
    "refactor-audit/models/reviews/definitions-library-1/plan.tsv",
    "refactor-audit/models/reviews/definitions-catalogue-2/plan.tsv",
    "refactor-audit/models/reviews/definitions-automation-personal-2/plan.tsv",
    "refactor-audit/models/reviews/definitions-api-support-1/plan.tsv"
  ]
  report = "refactor-audit/models/reviews/definitions-domain-1"
  definitionRoots = [
    "modules/core/src/main/scala/com/histmersion/domain/",
    "modules/server/src/main/scala/com/histmersion/domain/"
  ]
  defer {
    "com.histmersion.domain.media.assets.NewFigure.bytes" = "Decoded binary payload needs a whole-payload type; per-byte wrapping changes representation"
  }
  reuse {
    "com.histmersion.domain.*.citekey" = "com.histmersion.domain.library.Citekey"
    "com.histmersion.domain.*.doi" = "com.histmersion.domain.library.Doi"
    "com.histmersion.domain.*.sha256" = "com.histmersion.Sha256"
    "com.histmersion.domain.*.lat" = "com.histmersion.Latitude"
    "com.histmersion.domain.*.lon" = "com.histmersion.Longitude"
    "com.histmersion.domain.*.year" = "com.histmersion.Year"
    "com.histmersion.domain.*.periodStart" = "com.histmersion.Year"
    "com.histmersion.domain.*.periodEnd" = "com.histmersion.Year"
    "com.histmersion.domain.*.placeId" = "com.histmersion.domain.catalogue.Place.Id"
    "com.histmersion.domain.*.eventId" = "com.histmersion.domain.catalogue.Event.Id"
    "com.histmersion.domain.*.runId" = "com.histmersion.domain.automation.Run.Id"
    "com.histmersion.domain.*.jobId" = "com.histmersion.util.jobs.Job.Id"
    "com.histmersion.domain.CompileArticle.SourceFact.title" = "com.histmersion.domain.Title"
    "com.histmersion.domain.CompileArticle.EdgeFact.from" = "com.histmersion.domain.library.Citekey"
    "com.histmersion.domain.CompileArticle.EdgeFact.to" = "com.histmersion.domain.library.Citekey"
    "com.histmersion.domain.automation.goals.GoalRecord.slug" = "com.histmersion.domain.automation.Goal.Slug"
    "com.histmersion.domain.automation.goals.GoalRecord.parentSlug" = "com.histmersion.domain.automation.Goal.Slug"
    "com.histmersion.domain.automation.managers.ManagerRecord.kind" = "com.histmersion.domain.automation.Manager.Kind"
    "com.histmersion.domain.automation.managers.ManagerRecord.state" = "com.histmersion.domain.automation.Manager.State"
  }
}
