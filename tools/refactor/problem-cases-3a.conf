rules = ["file:tools/refactor/ProblemCaseRewrite.scala"]
ProblemCaseRewrite {
  rewrites = [
    { from = "Run.Stalled", to = "{q}Run.Stopped({q}Run.Stop.Stalled($1, $2, $3))" }
    { from = "Run.Silent", to = "{q}Run.Stopped({q}Run.Stop.Silent($1, $2, $3, $4))" }
    { from = "Run.NoPipeline", to = "{q}Run.Stopped({q}Run.Stop.NoPipeline($1))" }
    { from = "Run.PipelineChanged", to = "{q}Run.Stopped({q}Run.Stop.PipelineChanged)" }
    { from = "Run.Reordered", to = "{q}Run.Stopped({q}Run.Stop.Reordered($1, $2, $3))" }
    { from = "Run.CheckpointUnread", to = "{q}Run.Stopped({q}Run.Stop.CheckpointUnread($1, $2, $3))" }
    { from = "Run.Vanished", to = "{q}Run.Stopped({q}Run.Stop.Vanished)" }
    { from = "Run.Overspent", to = "{q}Run.Stopped({q}Run.Stop.Over({q}Run.Budget.Usd($1, $2)))" }
    { from = "Run.OverTokens", to = "{q}Run.Stopped({q}Run.Stop.Over({q}Run.Budget.Tokens($1, $2, $3)))" }
    { from = "Run.OverCap", to = "{q}Run.Stopped({q}Run.Stop.Over({q}Run.Budget.Cap($1, $2)))" }
    { from = "Run.MovedOn", to = "{q}Run.Stopped({q}Run.Stop.MovedOn($1))" }
    { from = "Run.Withdrawn", to = "{q}Run.Stopped({q}Run.Stop.Withdrawn)" }
    { from = "Run.GuardStopped", to = "{q}Run.Stopped({q}Run.Stop.Guard($1))" }
    { from = "Run.Unrecorded", to = "{q}Run.Stopped({q}Run.Stop.Unrecorded($1))" }
  ]
}
