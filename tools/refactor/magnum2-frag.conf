# G58: Magnum 1.3.1 -> 2.0, the db module's `Sql`/`Param` fragments as Magnum 2's nesting `Frag`s, see Magnum2Frag.scala.
# Runs over the SemanticDB of the 1.3.1 build (compile db and server, main and test, first):
#   SCALAFIX_JAVA_OPTS="-Xmx6g -Xss8m" bash tools/refactor/scalafix.sh \
#     --config tools/refactor/magnum2-frag.conf --sourceroot . --auto-classpath --auto-classpath-roots target/out \
#     --files modules/db/src --files modules/server/src
# The sites it leaves alone (with the reason) are appended to `report`, for the hand fixes.
# Fixture: magnum2-frag-fixture/{input,expected} (see the README section "Magnum 2 fragments").
rules = ["file:tools/refactor/Magnum2Frag.scala"]
Magnum2Frag {
  report = "refactor-audit/magnum2/left-alone.tsv"
}
