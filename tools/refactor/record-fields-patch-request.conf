# Row 32 (ADR 0029, slice 4): the source patch's request metadata moves to its request type. record-fields-inputs.conf
# first gave Source.Patch `createdBy` and `via`; the patch is checkpointed, so its stored form must not change, and the
# fields go on Source.Patch.Request instead (the patch's fields, flat, written by hand). This applies that one entry of
# record-fields-inputs.conf to a tree where the other inputs already carry theirs.
# After `sbt Test/compile`, from the worktree root:
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh --config tools/refactor/record-fields-patch-request.conf \
#     --sourceroot . --auto-classpath --auto-classpath-roots target/out --files modules/api/src/main
rules = ["file:tools/refactor/AddRecordFields.scala"]
AddRecordFields {
  report = "refactor-audit/provenance/record-fields-patch-request.tsv"
  imports = ["com.histmersion.api.automation.Creation"]
  fields {
    "com/histmersion/api/library/Source.Patch.Request#" = "createdBy: Option[Creation.By] = None, via: Option[Creation.Via] = None"
  }
  parents {
    "com/histmersion/api/library/Source.Patch.Request#" = "Creation.Requested"
  }
}
