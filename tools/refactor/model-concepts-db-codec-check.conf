include "model-concepts-applied-build.conf"
CompileBatch {
  report = "refactor-audit/models/reviews/multi-concept-1/applied-db-codec-check-1"
  commands = [
    "set db / Test / unmanagedSources ~= (_.filter(f => Set(\"DbSuite.scala\", \"TestDb.scala\", \"NewtypeColumnsSuite.scala\", \"SourceColumnsSuite.scala\", \"PlaceColumnsSuite.scala\")(f.getName)))",
    "set db / Test / envVars += (\"HISTMERSION_TEST_DB_URL\" -> \"jdbc:postgresql://127.0.0.1:55573/histmersion_test\")",
    "db/compile",
    "db/Test/compile",
    "db/testOnly *NewtypeColumnsSuite *SourceColumnsSuite *PlaceColumnsSuite"
  ]
}
