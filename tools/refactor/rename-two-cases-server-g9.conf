# G9 (namespaces, not prefixes), server's server-side enums: as rename-two-cases-core-g9.conf, for the enum that
# replaced a G9-tolerated Boolean newtype of modules/server (Codex+LeanBase). Definitions renamed by hand.
# After `sbt compile Test/compile`, from the worktree root:
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh --config tools/refactor/rename-two-cases-server-g9.conf \
#     --sourceroot . --auto-classpath --auto-classpath-roots target/out --files modules
rules = ["file:tools/refactor/RenameSymbols.scala"]
RenameSymbols {
  renames {
    "com/histmersion/domain/automation/agents/GenSettings.CodexLeanBase#" = "LeanBase"
    "com/histmersion/domain/automation/agents/GenSettings.CodexLeanBase." = "LeanBase"
  }
}
