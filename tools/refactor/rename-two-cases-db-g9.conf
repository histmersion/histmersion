# G9 (namespaces, not prefixes), db's server-side enums: as rename-two-cases-core-g9.conf, for the enum that replaced a
# G9-tolerated Boolean newtype of modules/db (the same name core's counterpart took). Definitions renamed by hand.
# After `sbt compile Test/compile`, from the worktree root:
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh --config tools/refactor/rename-two-cases-db-g9.conf \
#     --sourceroot . --auto-classpath --auto-classpath-roots target/out --files modules
rules = ["file:tools/refactor/RenameSymbols.scala"]
RenameSymbols {
  renames {
    "com/histmersion/domain/automation/goals/FocusRepo.WorkRow.PersonHeld#" = "HeldByPerson"
    "com/histmersion/domain/automation/goals/FocusRepo.WorkRow.PersonHeld." = "HeldByPerson"
  }
}
