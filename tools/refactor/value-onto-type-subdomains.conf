# G2 for operations+config, personal and media: `.value` dropped where the newtype itself does the job (round trips,
# comparisons of one newtype, operations the companions already have). Routes, Tools and Controllers belong to the
# surfaces lane, problem/ and the Run/jobs code to theirs.
rules = ["file:tools/refactor/ValueOntoType.scala"]
ValueOntoType {
  paths = [
    "modules/server/src/main/scala/com/histmersion/util/basemap/",
    "modules/server/src/main/scala/com/histmersion/util/storage/",
    "modules/server/src/main/scala/com/histmersion/util/settings/",
    "modules/server/src/main/scala/com/histmersion/util/data/",
    "modules/server/src/main/scala/com/histmersion/util/plugins/",
    "modules/server/src/main/scala/com/histmersion/server/plugins/",
    "modules/server/src/main/scala/com/histmersion/domain/personal/",
    "modules/server/src/main/scala/com/histmersion/domain/media/",
    "modules/core/src/main/scala/com/histmersion/domain/media/",
    "modules/files/src/main/scala/com/histmersion/domain/media/",
    "modules/files/src/main/scala/com/histmersion/util/plugins/",
    "modules/files/src/main/scala/com/histmersion/util/storage/",
    "modules/config/src/main/",
    "modules/plugin-host/src/main/",
    "modules/plugin-resolver/src/main/",
    "modules/plugin-vaults/src/main/",
    "modules/api/src/main/scala/com/histmersion/api/backup/",
    "modules/api/src/main/scala/com/histmersion/api/basemap/",
    "modules/api/src/main/scala/com/histmersion/api/maintenance/",
    "modules/api/src/main/scala/com/histmersion/api/settings/",
    "modules/api/src/main/scala/com/histmersion/api/plugins/",
    "modules/api/src/main/scala/com/histmersion/api/exchange/",
    "modules/api/src/main/scala/com/histmersion/api/personal/",
    "modules/api/src/main/scala/com/histmersion/api/media/"
  ]
  excludes = [".*(Routes|Tools|Controllers|Controller)\\.scala", ".*/problem/.*", ".*/jobs/.*", ".*Jobs?\\.scala"]
  report = "target/refactor/value-onto-type-subdomains.tsv"
}
