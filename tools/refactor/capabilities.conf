rules = ["file:tools/refactor/CapabilityAccess.scala"]
CapabilityAccess {
  report = "refactor-audit/capabilities"
  sourceRoots = ["modules"]
  bans = [
    { id = console-input, symbols = ["java.lang.System.console", "scala.io.StdIn.readLine"], message = "Read terminal input through the injected Console adapter." },
    { id = console-factory, symbols = ["com.histmersion.util.console.Console.system", "com.histmersion.util.console.Console.standard", "com.histmersion.util.console.Console.streams"], message = "Only composition roots construct Console; command implementations receive it using a parameter." },
    { id = domain-console, prefixes = ["com/histmersion/util/console/Console"], within = ["com/histmersion/domain/", "com/histmersion/plugins/", "com/histmersion/plugin/"], message = "Domain and plugins do not own terminal output; use scribe for diagnostics." },
    { id = environment, symbols = ["java.lang.System.getenv", "scala.sys.package.env"], message = "Read environment through supplied settings/environment." },
    { id = properties, symbols = ["java.lang.System.getProperty", "java.lang.System.getProperties", "scala.sys.package.props", "java.lang.System.setProperty", "java.lang.System.clearProperty", "java.lang.System.setProperties"], message = "System properties belong to configured bootstrap infrastructure." },
    { id = console, symbols = ["scala.Predef.println", "scala.Predef.print", "scala.Predef.printf", "scala.Console.println", "scala.Console.print", "scala.Console.printf", "scala.Console.out", "scala.Console.err", "java.lang.System.out", "java.lang.System.err", "java.lang.Throwable.printStackTrace"], message = "Use approved logging; terminal output belongs only at the CLI edge." },
    { id = clock, symbols = ["java.lang.System.currentTimeMillis", "java.lang.System.nanoTime", "java.time.Instant.now", "java.time.LocalDate.now", "java.time.LocalDateTime.now", "java.time.ZonedDateTime.now", "java.time.OffsetDateTime.now", "java.time.Clock.systemUTC", "java.time.Clock.systemDefaultZone", "java.time.Clock.system"], allowedParameterTypes = ["java/time/Clock#"], message = "Use an injected clock; only overloads accepting a Clock are allowed." },
    { id = lifecycle, symbols = ["java.lang.System.exit", "scala.sys.package.exit", "java.lang.Runtime.exit", "java.lang.Runtime.halt", "java.lang.Runtime.addShutdownHook"], message = "Process lifecycle belongs to the entry point." },
    { id = filesystem, prefixes = ["java/nio/file/Files#", "java/nio/file/Files.", "java/io/File#", "java/io/FileInputStream#", "java/io/FileOutputStream#", "java/io/RandomAccessFile#", "scala/io/Source.fromFile", "scala/reflect/io/"], within = ["com/histmersion/domain/", "com/histmersion/plugins/", "com/histmersion/plugin/"], message = "Use supplied storage capability; raw filesystem dependency in domain/plugin code." },
    { id = http, prefixes = ["java/net/http/HttpClient", "java/net/URLConnection#", "java/net/HttpURLConnection#", "java/net/Socket#", "sttp/client4/httpclient/", "sttp/client3/httpclient/"], symbols = ["java.net.URL.openConnection", "java.net.URL.openStream"], within = ["com/histmersion/domain/", "com/histmersion/plugins/", "com/histmersion/plugin/"], message = "Use supplied HTTP capability; do not construct or depend on a transport backend." },
    { id = config-load, symbols = ["org.ekrich.config.ConfigFactory.load", "org.ekrich.config.ConfigFactory.parseFile", "org.ekrich.config.ConfigFactory.parseFileAnySyntax", "org.ekrich.config.ConfigFactory.parseURL", "org.ekrich.config.ConfigFactory.parseResources", "org.ekrich.config.ConfigFactory.parseResourcesAnySyntax", "org.ekrich.config.ConfigFactory.defaultApplication", "org.ekrich.config.ConfigFactory.defaultReference", "org.ekrich.config.ConfigFactory.defaultOverrides", "org.ekrich.config.ConfigFactory.systemEnvironment", "org.ekrich.config.ConfigFactory.systemProperties", "org.ekrich.config.ConfigFactory.invalidateCaches", "com.typesafe.config.ConfigFactory.load", "com.typesafe.config.ConfigFactory.parseFile", "com.typesafe.config.ConfigFactory.parseFileAnySyntax", "com.typesafe.config.ConfigFactory.parseURL", "com.typesafe.config.ConfigFactory.parseResources", "com.typesafe.config.ConfigFactory.parseResourcesAnySyntax", "com.typesafe.config.ConfigFactory.defaultApplication", "com.typesafe.config.ConfigFactory.defaultReference", "com.typesafe.config.ConfigFactory.defaultOverrides", "com.typesafe.config.ConfigFactory.systemEnvironment", "com.typesafe.config.ConfigFactory.systemProperties", "com.typesafe.config.ConfigFactory.invalidateCaches"], within = ["com/histmersion/domain/", "com/histmersion/plugins/", "com/histmersion/plugin/"], message = "Receive typed settings; external config loading belongs to composition. Parsing supplied text is not external access." },
    { id = process, prefixes = ["java/lang/ProcessBuilder#", "scala/sys/process/"], symbols = ["java.lang.Runtime.exec"], within = ["com/histmersion/domain/", "com/histmersion/plugins/", "com/histmersion/plugin/"], message = "Use supplied process runner." },
    { id = repo-factory, prefixes = ["javax/sql/DataSource#", "com/histmersion/util/database/Transactor#", "com/histmersion/util/database/Transactor."], repositoriesOnly = true, message = "Repository borrows DbCon; it must not receive or construct a connection/transaction factory." },
    { id = repo-transaction, symbols = ["java.sql.Connection.commit", "java.sql.Connection.rollback", "java.sql.Connection.close", "java.sql.Connection.setAutoCommit", "java.sql.DriverManager.getConnection", "com.augustnagro.magnum.connect", "com.augustnagro.magnum.transact"], repositoriesOnly = true, message = "Service owns acquisition and transaction lifecycle; repository borrows the context." }
  ]
  permissions = [
    { id = console-adapter, owner = "com/histmersion/util/console/Console.", capabilities = [console, console-input], reason = "The stream adapter implements our injected Console; commands receive it through using parameters." },
    { id = cli-console-composition, owner = "com/histmersion/cli/Main$package.histmersionCli().", capabilities = [console-factory], reason = "CLI entry chooses its Console implementation." },
    { id = resolver-console-composition, owner = "com/histmersion/pluginresolver/DependencyResolver$package.pluginResolver().", capabilities = [console-factory], reason = "Resolver entry chooses its Console implementation." },
    { id = relink-console-composition, owner = "com/histmersion/server/plugins/RelinkPlugins$package.pluginTool().", capabilities = [console-factory], reason = "Relink entry chooses its Console implementation." },
    { id = server-console-composition, owner = "com/histmersion/server/Main$package.histmersionServer().", capabilities = [console-factory], reason = "Server entry chooses its command-output Console implementation." },
    { id = cli-exit, owner = "com/histmersion/cli/Cli.", capabilities = [lifecycle], reason = "CLI command dispatch owns its process exit status; raw console access is forbidden here." },
    { id = startup-context, owner = "com/histmersion/server/SystemContext.", capabilities = [environment, properties, clock], reason = "Captures environment, paths and clock at startup for injection." }
  ]
}
