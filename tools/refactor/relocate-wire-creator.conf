# Row 32 (ADR 0029 section 5): the wire's creator records leave the work lists' Queue. RelocateWireCreator rewrites
# every reference to a moved symbol (Queue.Creator, Queue.Agent, Queue.CreatedBy, Queue.Creation), by SemanticDB symbol:
#   - a qualified reference becomes the new name, fully qualified in an import's path and short elsewhere;
#   - a bare reference (imported, or seen through Queue.*) becomes the short new name;
#   - an importee naming a moved symbol is removed, and a file with a rewritten reference gets the new import.
# The definitions themselves (in Queue.scala) are moved by hand, after the rule ran on the SemanticDB that still has
# them where they were. (Its first target, api.Provenance, was renamed by rename-wire-creation.conf.)
# After `sbt Test/compile` (current SemanticDB of every module), from the worktree root:
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh --config tools/refactor/relocate-wire-creator.conf \
#     --sourceroot . --auto-classpath --auto-classpath-roots target/out --files modules
rules = ["file:tools/refactor/RelocateWireCreator.scala"]
