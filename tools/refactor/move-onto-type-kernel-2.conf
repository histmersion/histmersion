# G34 batch 1, second run: DeepTime's functions onto domain.SignedYear (`signed.year`, `SignedYear.span`), after
# move-onto-type-kernel.conf made SignedYear a top-level type. After `sbt compile Test/compile`, from the worktree root:
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh --config tools/refactor/move-onto-type-kernel-2.conf \
#     --sourceroot . --auto-classpath --auto-classpath-roots target/out --files modules
rules = ["file:tools/refactor/MoveOntoType.scala"]
MoveOntoType {
  report = "refactor-audit/lane-objects/move-onto-type-kernel-2.tsv"
  moves = [
    { source = "com/histmersion/domain/DeepTime.", to = "com/histmersion/domain/SignedYear." }
  ]
}
