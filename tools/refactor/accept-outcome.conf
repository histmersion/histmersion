# G94: writes the reviewed reasons of tools/refactor/accept-outcome-plan.tsv (rows: path, line, callee, why) as
# `Unused(<answer>, Unused.Why.<why>)` at the inventory's discardedOutcome sites. Run once, syntactically, from the
# worktree root, at the commit whose findings the plan was written from:
#   scala-cli run -S 2.13.18 --dep ch.epfl.scala:scalafix-cli_2.13.18:0.14.9 --main-class scalafix.cli.Cli -- \
#     --config tools/refactor/accept-outcome.conf --syntactic --files modules/db/src/main --files modules/server/src/main
# The second pass (the answers dropped inside `foreach` lambdas, found once the inventory read the standard library's
# `foreach` by name) ran with `--settings.AcceptOutcome.plan=tools/refactor/accept-outcome-plan-2.tsv` on the state the
# first pass left. Both plans are the decisions as made; their lines name the code as it was then.
rules = ["file:tools/refactor/AcceptOutcome.scala"]
AcceptOutcome {
  plan = "tools/refactor/accept-outcome-plan.tsv"
}
