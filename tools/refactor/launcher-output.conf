rules = ["file:tools/refactor/RepairBoundaries.scala"]
RepairBoundaries {
  mode = apply
  report = "refactor-audit/launcher-output.tsv"
  rewrites = [
    { id = launcher-test-future-syntax, paths = ["/pluginresolver/PluginResolverSuite.scala"],
      from = "if (calls == 1) throw new IllegalArgumentException(\"sink failed\")",
      to = "if calls == 1 then throw new IllegalArgumentException(\"sink failed\")" },
    { id = resolver-output-contract, paths = ["/pluginresolver/DependencyResolver.scala"], kind = stat,
      from = "def exitCode(args: List[String]): Int = __body",
      to = "def exitCode(args: List[String], out: String => Unit, err: String => Unit): Int = __body" },
    { id = resolver-launcher-output, paths = ["/pluginresolver/DependencyResolver.scala"], owner = pluginResolver,
      from = "DependencyResolver.exitCode(args.toList)",
      to = "DependencyResolver.exitCode(args.toList, s => System.out.println(s), s => System.err.println(s))" },
    { id = resolver-supplied-output, paths = ["/pluginresolver/DependencyResolver.scala"], owner = exitCode,
      from = "run(args, s => System.out.println(s), s => System.err.println(s))", to = "run(args, out, err)" },
    { id = resolver-supplied-error, paths = ["/pluginresolver/DependencyResolver.scala"], owner = exitCode,
      from = "System.err.println(__message)", to = "err(__message)" },
    { id = relink-output-contract, paths = ["/plugins/RelinkPlugins.scala"], kind = stat,
      from = "def exitCode(args: List[String]): Int = __body",
      to = "def exitCode(args: List[String], stdout: String => Unit, stderr: String => Unit): Int = __body" },
    { id = relink-launcher-output, paths = ["/plugins/RelinkPlugins.scala"], owner = pluginTool,
      from = "RelinkPlugins.exitCode(args.toList)",
      to = "RelinkPlugins.exitCode(args.toList, s => System.out.println(s), s => System.err.println(s))" },
    { id = relink-exit-run, paths = ["/plugins/RelinkPlugins.scala"], owner = exitCode,
      from = "run(args)", to = "run(args, stdout, stderr)" },
    { id = relink-supplied-error, paths = ["/plugins/RelinkPlugins.scala"], owner = exitCode,
      from = "System.err.println(__message)", to = "stderr(__message)" },
    { id = relink-dispatch-contract, paths = ["/plugins/RelinkPlugins.scala"], kind = stat,
      from = "private def run(args: List[String]): Int = __body",
      to = "private def run(args: List[String], stdout: String => Unit, stderr: String => Unit): Int = __body" },
    { id = relink-operation-contract, paths = ["/plugins/RelinkPlugins.scala"], kind = stat,
      from = "private def run(cmd: String, args: List[String], deps: List[Path]): Int = __body",
      to = "private def run(cmd: String, args: List[String], deps: List[Path], stdout: String => Unit, stderr: String => Unit): Int =\n    __body" },
    { id = relink-dispatch-output, paths = ["/plugins/RelinkPlugins.scala"], owner = run,
      from = "run(__cmd, __args, __deps)", to = "run(__cmd, __args, __deps, stdout, stderr)" },
    { id = relink-run-output, paths = ["/plugins/RelinkPlugins.scala"], owner = run,
      from = "System.out.println(__message)", to = "stdout(__message)" },
    { id = relink-run-error, paths = ["/plugins/RelinkPlugins.scala"], owner = run,
      from = "System.err.println(__message)", to = "stderr(__message)" },
    { id = plugin-generation-failure, paths = ["/agents/PluginTree.scala"], owner = write,
      from = "System.err.println(s\"cannot generate the plugin: $m\")", to = "scribe.error(s\"cannot generate the plugin: $m\")" },
    { id = plugin-generation-success, paths = ["/agents/PluginTree.scala"], owner = write,
      from = "System.err.println(s\"wrote ${t.size} file(s) under $root\")", to = "scribe.info(s\"wrote ${t.size} file(s) under $root\")" },
    { id = postgres-stop-diagnostic, paths = ["/server/Supervisor.scala"], owner = shutdown,
      from = "System.err.println(__message)", to = "scribe.error(__message)" }
  ]
}
