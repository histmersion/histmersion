# G53: `derives CanEqual` on every enum and on the listed records (the same-type comparisons the compiler reported under
# -language:strictEquality), see DeriveCanEqual.scala.
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh \
#     --config tools/refactor/derive-can-equal.conf --sourceroot . --auto-classpath --auto-classpath-roots target/out --files modules/<m>
# Fixture: run-rule.sh tools/refactor/DeriveCanEqual.scala tools/refactor/derive-can-equal-fixture/{input,expected} with
#   derive-can-equal-fixture/.scalafix.conf; the expected output also compiles with -language:strictEquality.
rules = ["file:tools/refactor/DeriveCanEqual.scala"]
DeriveCanEqual {
  report = "refactor-audit/guidelines/g53/derive-can-equal.tsv"
  allEnums = true
  types = []
}
