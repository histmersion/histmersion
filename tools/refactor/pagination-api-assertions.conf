rules = ["file:tools/refactor/AssertionObservationRewrite.scala"]
AssertionObservationRewrite {
  sourceHashes = "refactor-audit/models/pagination/domain-tests-v1/sources.tsv"
  report = "refactor-audit/models/pagination/api-assertions-v1"
  entries = [
    {path = "modules/api/src/test/scalajvm/com/histmersion/api/ArticlesSuite.scala", before = "(first.offset, first.next)", after = "((first.offset.value: Int), first.next.map(n => (n.value: Int)))"},
    {path = "modules/api/src/test/scalajvm/com/histmersion/api/MarkdownSuite.scala", before = "SearchResult.of(50, hits, 20).next", after = "SearchResult.of(50, hits, 20).next.map(n => (n.value: Int))"},
    {path = "modules/api/src/test/scalajvm/com/histmersion/api/OffsetPageSuite.scala", before = "OffsetPage(com.histmersion.api.RowCount(412), com.histmersion.api.Offset(0), com.histmersion.api.RowCount(50)).next", after = "OffsetPage(com.histmersion.api.RowCount(412), com.histmersion.api.Offset(0), com.histmersion.api.RowCount(50)).next.map(n => (n.value: Int))"},
    {path = "modules/api/src/test/scalajvm/com/histmersion/api/OffsetPageSuite.scala", before = "old.map(_.offset)", after = "old.map(x => (x.offset.value: Int))"}
  ]
}
