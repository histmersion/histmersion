# Row 32 (ADR 0029 section 7, slice 4), dry run: lists every endpoint (a REST serverLogic or an MCP tool's handle in a
# Routes, Tools or HttpApi file) whose body calls a def that takes `(using Creator.New)`, with the input that names its
# creator. Changes nothing. attribute-endpoints-apply.conf is this with `apply = true`; keep the two in step.
# After `sbt Test/compile` (current SemanticDB), from the worktree root:
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh --config tools/refactor/attribute-endpoints.conf \
#     --sourceroot . --auto-classpath --auto-classpath-roots target/out --files modules/server/src/main
#
# AttributeEndpoints: a request names its creator in its input (`createdBy`, and `via` over REST). Each endpoint whose
# lambda takes an input that extends a key of `wrappers` gets its body wrapped in the wrapper (a `wrap` row): a context
# function that parses the input's names (domain.CreatorControllers) and gives the creator, nested inside the binding's
# Unattributed given, so it wins. An endpoint with no such input keeps the binding's given (a `fallback` row, naming its
# parameters' types: the list from which AddRecordFields' classes were chosen); a serverLogicSuccess cannot answer a
# refusal (a `stop` row), nor can an argument that is not a function literal.
rules = ["file:tools/refactor/AttributeEndpoints.scala"]
AttributeEndpoints {
  semanticdbRoots = ["target/out/jvm"]
  wrappers {
    "com/histmersion/api/automation/Creation.Requested#" = "CreatorControllers.rest"
  }
  toolFiles = ".*Tools\\.scala"
  toolWrappers {
    "com/histmersion/api/automation/Creation.Named#" = "CreatorControllers.mcp"
  }
  report = "refactor-audit/provenance/attribute-endpoints.tsv"
  apply = false
}
