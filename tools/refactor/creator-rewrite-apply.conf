# Row 32 (ADR 0029 §7, slice 3), the rewrite: creator-rewrite.conf (the dry run) with `apply = true`. Keep the two in
# step. Then scalafmtOnly the changed files (project by project) and write the `stop` rows' creators by hand.
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh --config tools/refactor/creator-rewrite-apply.conf \
#     --sourceroot . --files modules
rules = ["file:tools/refactor/CreatorRewrite.scala"]
CreatorRewrite {
  report = "refactor-audit/provenance/creator-rewrite-applied.tsv"
  apply = true
  boundaryFiles = ".*(Routes|Tools)\\.scala"
  # a binding's requests name no identity yet (ADR 0029 section 1): REST's and the MCP's own surface, unattributed
  endpointGivens {
    ".*Routes\\.scala" = "Creator.New.Unattributed(Creator.Surface.Rest)"
    ".*(?<!Agent)Tools\\.scala" = "Creator.New.Unattributed(Creator.Surface.Mcp)"
  }
  tables = [
    sources, findings, edges, unresolved_edges, assessments, source_candidates, candidate_watches,
    articles, article_versions, review_ledgers,
    assets, asset_links,
    events, places, periods, attestations, corrections, place_overrides, event_link_candidates,
    queue_items, goals, goal_links, goal_schedules, approvals, jobs, agent_managers, manager_hints,
    notes, bookmarks
  ]
}
