# The @tolerated annotations the lint reports as unused (`unused: no <rule> finding in this definition`), listed as
# path, line, column in target/refactor/unused-tolerations.txt from a lint.sh run; a file left with none loses the
# import of `tolerated` and `LintRule`.
rules = ["file:tools/refactor/DropUnusedTolerations.scala"]
DropUnusedTolerations {
  sites = "target/refactor/unused-tolerations.txt"
}
