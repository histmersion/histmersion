# Owner decision 2026-11-28 (PR #147 pair table, section 3, "keep" rows and the merge rows whose constraints or modules
# differ): the two types stay separate, and each bridge `To(x.value)` becomes a named function the source type's
# companion defines (an extension, written by hand beside the type: inside that companion `.value` is the type's own).
# Only pairs whose source module sees the target's module get one; the others are listed in the PR as open.
# After `sbt compile Test/compile`, from the worktree root, over all main and test sources.
# The same pass renames the two same-object merges (an object cannot export its own member, so the duplicate goes and
# every reference names the canonical; definitions removed by hand): api Goal.Ref -> Goal.Slug,
# HistoricalPeriod.ParentId -> HistoricalPeriod.Id.
rules = ["file:tools/refactor/RenameSymbols.scala", "file:tools/refactor/NamedBridges.scala"]
RenameSymbols {
  renames {
    "com/histmersion/api/automation/Goal.Ref#" = "Slug"
    "com/histmersion/api/automation/Goal.Ref." = "Slug"
    "com/histmersion/api/catalogue/HistoricalPeriod.ParentId#" = "Id"
    "com/histmersion/api/catalogue/HistoricalPeriod.ParentId." = "Id"
  }
}
