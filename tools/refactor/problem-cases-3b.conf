rules = ["file:tools/refactor/ProblemCaseRewrite.scala"]
ProblemCaseRewrite {
  rewrites = [
    { from = "Run.NoText", to = "{q}Run.Needs({q}Run.Need.Text($1))" }
    { from = "Run.NoBody", to = "{q}Run.Needs({q}Run.Need.Body($1))" }
    { from = "Run.NoLogin", to = "{q}Run.Needs({q}Run.Need.Login($1))" }
    { from = "Run.ProbeUnread", to = "{q}Run.Needs({q}Run.Need.Probe($1, $2))" }
  ]
}
