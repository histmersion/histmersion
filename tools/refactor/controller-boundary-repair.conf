rules = ["file:tools/refactor/RepairBoundaries.scala"]
RepairBoundaries {
  mode = apply
  report = "refactor-audit/controller-boundary-repair.tsv"
  rewrites = [
    { id = definition-role-domain-comparison, paths = ["/agents/AgentDefinitions.scala"], owner = agent,
      from = "roster.roles.contains(d.role)",
      to = "roster.roles.contains(io.scalaland.chimney.Transformer.derive[com.histmersion.api.automation.AgentRole, com.histmersion.domain.automation.AgentRole].transform(d.role))" }
  ]
}
