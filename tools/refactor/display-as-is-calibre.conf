# The owner's category defaults of 2026-11-24 for the texts the Calibre commands print and write: a publisher, a tag,
# a format's file path, a summary or comment, an ISBN, a publication date as Calibre writes it, an identifier's
# value, a cover path, a field's current value, an audit record's citekey, a gap's label; the volume number of a
# chapter is written with its digits.
rules = ["file:tools/refactor/DisplayAsIs.scala"]
DisplayAsIs {
  types = [
    "com/histmersion/api/library/CollectionEntry.Publisher.",
    "com/histmersion/api/library/CollectionEntry.Tags.",
    "com/histmersion/api/library/CollectionEntry.Formats.",
    "com/histmersion/api/library/Source.Summary.",
    "com/histmersion/api/library/CalibreGap.Isbn.",
    "com/histmersion/api/library/CalibreGap.Summary.",
    "com/histmersion/api/library/CollectionFieldChange.From.",
    "com/histmersion/cli/Calibre.Book.Pubdate.",
    "com/histmersion/cli/Calibre.Book.Comments.",
    "com/histmersion/cli/Calibre.Book.IdentifiersValue.",
    "com/histmersion/cli/Calibre.Book.Cover.",
    "com/histmersion/cli/Calibre.GapOriginal.Label.",
    "com/histmersion/cli/AuditRecord.Citekey."
  ]
  forms = [
    { newtype = "com/histmersion/cli/Calibre.VolumeNumber.", instance = "given Display[T] = Display(number => s\"${number.value}\")" }
  ]
}
