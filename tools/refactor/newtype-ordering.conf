# Step 3a: the shapes the base trait's lifted Ordering/CanEqual make unnecessary (after newtype-base.conf), see NewtypeOrdering.scala.
#   SCALAFIX_JAVA_OPTS=-Xmx6g bash tools/refactor/scalafix.sh \
#     --config tools/refactor/newtype-ordering.conf --sourceroot . --auto-classpath --auto-classpath-roots target/out --files modules/<m>
# Fixtures: run-rule.sh tools/refactor/NewtypeOrdering.scala tools/refactor/newtype-ordering-fixture/{input,expected}, and newtype-custom-fixture
rules = ["file:tools/refactor/NewtypeOrdering.scala"]
NewtypeOrdering {
  report = "refactor-audit/guidelines/step3a/newtype-ordering.tsv"
  roots = ["modules"]
  exclude = ["modules/plugin-fixtures/hello-lib/", "modules/newtype/"]
  semanticdbRoots = ["target/out/jvm/scala-{scalaVersion}", "target/out/sjs1/scala-{scalaVersion}"]
}
