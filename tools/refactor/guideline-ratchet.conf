# The guideline inventory as the build's ratchet (G57): GuidelineRatchetSuite (server tests) runs it over the SemanticDB
# of the last compile (semanticdbEnabled in build.sbt) and compares the counts per rule, module and scope with
# architecture/guidelines-ratchet.tsv. Same rule and boundaries as guideline-inventory.conf; only the outputs differ.
rules = ["file:tools/refactor/GuidelineInventory.scala"]
GuidelineInventory {
  boundaries = "architecture/boundaries.tsv"
  report = "target/guidelines/findings.tsv"
  unclassified = ""
  summary = ""
  requireCoverage = true
}
