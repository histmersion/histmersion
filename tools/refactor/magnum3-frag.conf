# G58 slice 2: the helpers that built SQL text as a String build Frags from Frag columns; see Magnum3Frag.scala.
# Syntactic; the helpers' definitions are edited by hand first, then:
#   bash tools/refactor/scalafix.sh --config tools/refactor/magnum3-frag.conf --sourceroot . \
#     --files modules/db/src --files modules/server/src
# Idempotent (a call already rewritten has no String literal left, a name no SqlLiteral around it), so each step adds
# its entries and runs it again. What it keeps (with the reason) is appended to `report`, for the hand fixes.
rules = ["file:tools/refactor/Magnum3Frag.scala"]
Magnum3Frag {
  report = "refactor-audit/magnum3/kept.tsv"
  calls = [
    # util.database: RangeSql, ListSql, Keyset, EnvelopeSql take Frag columns
    { fun = "RangeSql.start" },
    { fun = "RangeSql.end" },
    { fun = "RangeSql.cols", sqlArgs = [0, 1, 2] },
    { fun = "RangeSql.range", sqlArgs = [0, 1] },
    { fun = "RangeSql.overlaps", sqlArgs = [0, 1, 2] },
    { fun = "ListSql.anyOf" },
    { fun = "ListSql.equal" },
    { fun = "ListSql.between" },
    { fun = "ListSql.facetOn", sqlArgs = [1, 3] },
    { fun = "Keyset.existsOn" },
    { fun = "Keyset.countsOn", sqlArgs = [1] },
    { fun = "Keyset.orderBy" },
    { fun = "EnvelopeSql.envelopes" },
    # the bundles' clock (BundleSql.ts, gone) is the shared Timestamps.iso; BundleSql's range, scope and target uid
    {
      fun = "ts", to = "Timestamps.iso", imports = ["com.histmersion.util.database.Timestamps"],
      files = [
        "util/data/exchange/BundleRepo.scala", "util/data/exchange/MergeRepo.scala",
        "util/identity/TombstoneBundleRepo.scala", "ArticleBundleRepo.scala", "SourceBundleRepo.scala",
        "GoalBundleRepo.scala", "QueueBundleRepo.scala", "PeriodBundleRepo.scala", "EvidenceBundleRepo.scala",
        "PlaceBundleRepo.scala", "EventBundleRepo.scala", "AssetLinkBundleRepo.scala", "AssetBundleRepo.scala"
      ]
    },
    { fun = "rangeCols", files = ["BundleRepo.scala"] },
    { fun = "where", sqlArgs = [1, 2], files = ["BundleRepo.scala"] },
    { fun = "targetUid", sqlArgs = [0, 1], files = ["BundleRepo.scala"] },
    # the agents' own seconds clock (a private `at` in three repos) is the shared Timestamps.isoSeconds
    {
      fun = "at", to = "Timestamps.isoSeconds", imports = ["com.histmersion.util.database.Timestamps"],
      files = ["managers/ManagerRepo.scala", "autopilot/AutopilotRepo.scala", "goals/FocusRepo.scala"]
    },
    { fun = "occupyingOn", files = ["managers/ManagerRepo.scala"] }
  ]
  names = [
    { name = "mergeCols", files = ["util/data/exchange/MergeRepo.scala"] },
    { name = "select", files = ["util/data/exchange/MergeRepo.scala"] },
    { name = "eventUid", files = ["EventBundleRepo.scala"] },
    { name = "Esc", files = ["search/FilterSql.scala"] }
  ]
}
