# G58 slice 2: the helpers that built SQL text as a String build Frags from Frag columns; see Magnum3Frag.scala.
# Syntactic; the helpers' definitions are edited by hand first, then:
#   bash tools/refactor/scalafix.sh --config tools/refactor/magnum3-frag.conf --sourceroot . \
#     --files modules/db/src --files modules/server/src
# Idempotent (a call already rewritten has no String literal left, a name no SqlLiteral around it), so each step adds
# its entries and runs it again. What it keeps (with the reason) is appended to `report`, for the hand fixes.
rules = ["file:tools/refactor/Magnum3Frag.scala"]
# the files that read the places' SQL (their helpers' short names mean other things elsewhere)
PlaceFiles = [
  "catalogue/places/", "catalogue/maptiles/", "db/InteractiveQueriesSuite.scala", "db/PlaceGeoSuite.scala",
  "db/PlaceholderPointSuite.scala", "db/SiteTypesSqlSuite.scala", "db/PlaceTimeSuite.scala"
]
Magnum3Frag {
  report = "refactor-audit/magnum3/kept.tsv"
  calls = [
    # util.database: RangeSql, ListSql, Keyset, EnvelopeSql take Frag columns
    { fun = "RangeSql.start" },
    { fun = "RangeSql.end" },
    { fun = "RangeSql.cols", sqlArgs = [0, 1, 2] },
    { fun = "RangeSql.range", sqlArgs = [0, 1] },
    { fun = "RangeSql.overlaps", sqlArgs = [0, 1, 2] },
    { fun = "ListSql.anyOf" },
    { fun = "ListSql.equal" },
    { fun = "ListSql.between" },
    { fun = "ListSql.facetOn", sqlArgs = [1, 3] },
    { fun = "Keyset.existsOn" },
    { fun = "Keyset.countsOn", sqlArgs = [1] },
    { fun = "Keyset.orderBy" },
    { fun = "EnvelopeSql.envelopes" },
    # the bundles' clock (BundleSql.ts, gone) is the shared Timestamps.iso; BundleSql's range, scope and target uid
    {
      fun = "ts", to = "Timestamps.iso", imports = ["com.histmersion.util.database.Timestamps"],
      files = [
        "util/data/exchange/BundleRepo.scala", "util/data/exchange/MergeRepo.scala",
        "util/identity/TombstoneBundleRepo.scala", "ArticleBundleRepo.scala", "SourceBundleRepo.scala",
        "GoalBundleRepo.scala", "QueueBundleRepo.scala", "PeriodBundleRepo.scala", "EvidenceBundleRepo.scala",
        "PlaceBundleRepo.scala", "EventBundleRepo.scala", "AssetLinkBundleRepo.scala", "AssetBundleRepo.scala"
      ]
    },
    { fun = "rangeCols", files = ["BundleRepo.scala"] },
    { fun = "where", sqlArgs = [1, 2], files = ["BundleRepo.scala"] },
    { fun = "targetUid", sqlArgs = [0, 1], files = ["BundleRepo.scala"] },
    # the agents' own seconds clock (a private `at` in three repos) is the shared Timestamps.isoSeconds
    {
      fun = "at", to = "Timestamps.isoSeconds", imports = ["com.histmersion.util.database.Timestamps"],
      files = ["managers/ManagerRepo.scala", "autopilot/AutopilotRepo.scala", "goals/FocusRepo.scala"]
    },
    { fun = "occupyingOn", files = ["managers/ManagerRepo.scala"] },
    # the places' rule texts (PlaceSql, FindingPlaceRepo, SiteTypesSql) over a `places` row's alias as a fragment
    { fun = "importedSql", files = ${PlaceFiles} },
    { fun = "PlaceRepo.importedSql", files = ${PlaceFiles} },
    { fun = "inTimeSql", files = ${PlaceFiles} },
    { fun = "PlaceFixtures.inTimeSql", files = ${PlaceFiles} },
    { fun = "inWindowSql", files = ${PlaceFiles} },
    { fun = "PlaceSql.inWindowSql", files = ${PlaceFiles} },
    { fun = "PlaceFixtures.inWindowSql", files = ${PlaceFiles} },
    { fun = "timeBasisSql", files = ${PlaceFiles} },
    { fun = "PlaceSql.timeBasisSql", files = ${PlaceFiles} },
    { fun = "PlaceFixtures.timeBasisSql", files = ${PlaceFiles} },
    { fun = "modernSql", files = ${PlaceFiles} },
    { fun = "explicitOnlySql", files = ${PlaceFiles} },
    { fun = "FindingPlaceRepo.explicitOnlySql", files = ${PlaceFiles} },
    { fun = "PlaceFixtures.placeholderSql", files = ${PlaceFiles} },
    { fun = "SiteTypesSql.expr", files = ${PlaceFiles} },
    { fun = "normLabelSql", to = "normLabel", files = ${PlaceFiles} },
    { fun = "PlaceFixtures.normLabelSql", to = "PlaceFixtures.normLabel", files = ${PlaceFiles} }
  ]
  names = [
    { name = "mergeCols", files = ["util/data/exchange/MergeRepo.scala"] },
    { name = "select", files = ["util/data/exchange/MergeRepo.scala"] },
    { name = "eventUid", files = ["EventBundleRepo.scala"] },
    { name = "Esc", files = ["search/FilterSql.scala"] },
    # the places' constant clauses and projections, fragments now
    { name = "summaryCols", files = ${PlaceFiles} },
    { name = "contestedCol", files = ${PlaceFiles} },
    { name = "startCol", files = ${PlaceFiles} },
    { name = "datingCol", files = ${PlaceFiles} },
    { name = "sourceTierSql", files = ${PlaceFiles} },
    { name = "tierSql", files = ${PlaceFiles} },
    { name = "ModernSql", files = ${PlaceFiles} },
    { name = "UndatedImportSql", files = ${PlaceFiles} },
    { name = "UndatedPolityPointSql", files = ${PlaceFiles} },
    { name = "CuratedSql", files = ${PlaceFiles} },
    { name = "DatedImportSql", files = ${PlaceFiles} },
    { name = "BaseLayerSql", files = ${PlaceFiles} },
    { name = "partner", files = ["places/PlaceRepo.scala"] },
    { name = "imported", files = ["places/PlaceRepo.scala"] },
    { name = "legacySql", files = ["places/Geocoder.scala"] },
    { name = "unplacedSql", files = ["places/Geocoder.scala"] },
    { name = "placeholderFindingsSql", files = ["places/FindingPlaceRepo.scala"] },
    { name = "seedOnly", files = ["places/PointAreaRepo.scala"] },
    { name = "reviewedSql", files = ["places/PlaceReviewRepo.scala"] },
    { name = "UndatedSiteSql", files = ["maptiles/UndatedSiteRepo.scala"] },
    { name = "mx", files = ["maptiles/UndatedSiteRepo.scala"] },
    { name = "my", files = ["maptiles/UndatedSiteRepo.scala"] }
  ]
}
