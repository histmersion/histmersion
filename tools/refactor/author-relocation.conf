rules = ["file:tools/refactor/RelocateOwners.scala"]
RelocateOwners {
  mode = preview
  report = "refactor-audit/unread-projection/author-relocation-1"
  roots = [modules]
  moves = [{
    from = "modules/values/src/main/scala/com/histmersion/domain/library/AuthorName.scala"
    to = "modules/values/src/main/scala/com/histmersion/domain/AuthorName.scala"
    oldPackage = "com.histmersion.domain.library"
    newPackage = "com.histmersion.domain"
    names = [AuthorName]
    symbols {
      "com/histmersion/domain/library/AuthorName$package.AuthorName#" = AuthorName
      "com/histmersion/domain/library/AuthorName$package.AuthorName." = AuthorName
    }
  }]
}
