# G60's work list (speed plan C, UnclassifiedSites; tools/refactor/UnclassifiedSites.scala): every Unclassified
# construction, legacyText read and Either[String, _] definition, main and test, with the batch counts (speed plan D).
# Read-only. Run from the worktree root after `sbt compile Test/compile` (the SemanticDB must be current):
#   scala-cli run --server=false -q -S 2.13.18 --java-opt -Xmx6g --dep ch.epfl.scala:scalafix-cli_2.13.18:0.14.9 \
#     --main-class scalafix.cli.Cli -- --config tools/refactor/unclassified-sites.conf --scala-version 3.10.1 \
#     --sourceroot . --auto-classpath --auto-classpath-roots target/out \
#     $(for d in $(find target/out -maxdepth 4 -type d \( -name meta -o -name test-meta \)); do printf -- '--semanticdb-targetroots %s ' $d; done) \
#     --files modules
rules = ["file:tools/refactor/UnclassifiedSites.scala"]
UnclassifiedSites {
  report = "refactor-audit/g60/unclassified.tsv"
  summary = "refactor-audit/g60/unclassified-summary.tsv"
}
