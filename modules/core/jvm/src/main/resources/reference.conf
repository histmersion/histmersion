# Histmersion defaults (keys are kebab-case ↔ camelCase fields). Precedence, highest first:
#   1. the environment: the env var a key names below (HOCON `${?VAR}`);
#   2. the user config file, histmersion.conf: the same keys under histmersion { … }, any subset. It is
#      $HISTMERSION_CONFIG, else $XDG_CONFIG_HOME/histmersion/histmersion.conf (default ~/.config), on
#      macOS and Linux alike. Missing = fine; unparsable or mistyped = the server does not start;
#      an unknown key = a warning. Read at startup only (restart after editing). `histmersion about` names it;
#   3. this file.
# NO OTHER CONSTANTS EXIST IN THE CODE: ports, URLs, limits and UI defaults all come from here.
histmersion {
  server {
    host = "0.0.0.0"                      # bind address (the bundle uses 127.0.0.1 unless HISTMERSION_BIND is set)
    host = ${?HISTMERSION_BIND}
    port = 8000
    port = ${?HISTMERSION_PORT}
    public-url = "http://localhost:8000"   # how clients reach the server (absolute asset URLs in MCP output)
    public-url = ${?HISTMERSION_PUBLIC_URL}
    request-timeout-seconds = 1800        # one HTTP request end to end; must cover a pg_dump/restore (backups.timeout-seconds)
    request-timeout-seconds = ${?HISTMERSION_REQUEST_TIMEOUT}
  }
  db {
    url = "jdbc:postgresql://localhost:5432/histmersion"
    url = ${?HISTMERSION_DB_URL}
    user = "histmersion"
    user = ${?HISTMERSION_DB_USER}
    password = "histmersion"
    password = ${?HISTMERSION_DB_PASS}
    pool {
      max = 8                             # HikariCP connections per DataSource; the server is the only
      max = ${?HISTMERSION_DB_POOL_MAX}        # DB client, and a handful of netty threads is all that asks
    }
  }
  converter {
    url = "http://localhost:8100"
    url = ${?HISTMERSION_CONVERTER_URL}
    timeout-seconds = 600                 # the least a conversion is given; a long document gets
    timeout-seconds = ${?HISTMERSION_CONVERTER_TIMEOUT}   # pages × seconds-per-page when that is more
    seconds-per-page = 2                  # fast path (pymupdf4llm) — generous: this guards a hang
    seconds-per-page = ${?HISTMERSION_CONVERTER_SECONDS_PER_PAGE}
    seconds-per-page-quality = 8          # quality path (docling layout + OCR)
    seconds-per-page-quality = ${?HISTMERSION_CONVERTER_SECONDS_PER_PAGE_QUALITY}
    seconds-per-scanned-page = 15         # a page without a text layer is OCR'd even on the fast path
    seconds-per-scanned-page = ${?HISTMERSION_CONVERTER_SECONDS_PER_SCANNED_PAGE}
    parallelism = 1                       # bounded OCR worker pool; docling is CPU-bound
    parallelism = ${?HISTMERSION_CONVERTER_PARALLELISM}
    dpi = 150                             # rasterisation dpi for extracted figures
    dpi = ${?HISTMERSION_CONVERTER_DPI}
    max-image-px = 2000                   # longest side of a stored figure; larger ones are downscaled
    max-image-px = ${?HISTMERSION_CONVERTER_MAX_IMAGE_PX}
    spool-dir = "/var/tmp/histmersion-uploads" # server-side copy of an upload, so `reocr` needs no re-upload
    spool-dir = ${?HISTMERSION_SPOOL_DIR}
    health-timeout-ms = 2000              # /api/health must answer promptly whatever the sidecar is
    health-timeout-ms = ${?HISTMERSION_CONVERTER_HEALTH_TIMEOUT_MS}  # doing; past this it reads "degraded"
    health-cache-ms = 30000               # …and the probe's answer is reused for this long
  }
  corpus {
    dir = ""                              # server-side path of wiki/sources for `seed` with no argument
    dir = ${?HISTMERSION_CORPUS_DIR}
  }
  backups {
    dir = "backups"                       # SERVER-side directory for pg_dump archives (the bundle: <data-dir>/backups)
    dir = ${?HISTMERSION_BACKUPS_DIR}
    pg-bin-dir = ""                       # where pg_dump/pg_restore live when they are not on PATH
    pg-bin-dir = ${?HISTMERSION_PG_BIN_DIR}    # macOS/homebrew: /opt/homebrew/opt/libpq/bin (libpq is keg-only)
    timeout-seconds = 1800                # a dump/restore that outlives this is killed rather than hanging a request
    request-wait-seconds = 25             # POST /api/backup waits this long, then answers `running` (the dump
    request-wait-seconds = ${?HISTMERSION_BACKUP_REQUEST_WAIT}  # goes on as a job; well under any 60 s proxy/idle cut)
    keep = 5                              # archives left after a dump (the newest; older ones are deleted);
    keep = ${?HISTMERSION_BACKUPS_KEEP}   # 0 keeps every one. Each is a full dump — they add up fast
  }
  maintenance {                           # `histmersion maintenance vacuum` (#1445)
    # what VACUUM covers when no --table is named: the tables a re-seed or a gazetteer load rewrites
    vacuum-tables = "places,place_names,place_links,place_descriptions,place_footprints,place_relations,finding_places,findings"
    vacuum-tables = ${?HISTMERSION_MAINTENANCE_VACUUM_TABLES}
  }
  bundles {
    dir = "bundles"                       # SERVER-side scratch for `bundle export` (built here, then downloaded)
    dir = ${?HISTMERSION_BUNDLES_DIR}     # and for an uploaded bundle while `verify`/`import` read it
    stale-minutes = 60                    # a finished export older than this is deleted by the next export
    stale-minutes = ${?HISTMERSION_BUNDLES_STALE_MINUTES}
  }
  # `merge plan`'s source matcher (docs/research-merge-import.md §5.2): a score adds a weight per field
  # comparison (title, authors, year, venue, OCR body, a shared old citekey); a strong key (the same
  # DOI, original file or ISBN) decides without one.
  merge {
    auto-merge = 14                       # at or above, with no hard flag (two DOIs, years > 1 apart): merge
    auto-merge = ${?HISTMERSION_MERGE_AUTO}
    new-at-most = 4                       # at or below: a different work. In between: the user decides
    new-at-most = ${?HISTMERSION_MERGE_NEW_AT_MOST}
    minhash-size = 64                     # hash functions per OCR body sketch (MinHash of 5-word shingles)
    minhash-size = ${?HISTMERSION_MERGE_MINHASH_SIZE}
    finding-near-at-least = 0.6           # two findings of a merged pair whose claim words overlap this much
    finding-near-at-least = ${?HISTMERSION_MERGE_FINDING_NEAR_AT_LEAST}   # (Jaccard, periods overlapping): near-duplicates
    finding-within-km = 50                # two findings of a merged pair this close are at the same place
    finding-within-km = ${?HISTMERSION_MERGE_FINDING_WITHIN_KM}
    place-within-km = 5                   # a bundle's place with no id here: the same as a place here with its
    place-within-km = ${?HISTMERSION_MERGE_PLACE_WITHIN_KM}   # label and kind when the points are this close
    place-overlap-at-least = 0.8          # …or the shapes overlap this much (intersection over union)
    place-overlap-at-least = ${?HISTMERSION_MERGE_PLACE_OVERLAP_AT_LEAST}
    apply-wait-seconds = 20               # `merge apply` answers `running` (a job to follow) after this long
    apply-wait-seconds = ${?HISTMERSION_MERGE_APPLY_WAIT_SECONDS}
    weights {
      title-fingerprint = 9               # the same words, any order, case and accents
      title-fingerprint = ${?HISTMERSION_MERGE_W_TITLE_FINGERPRINT}
      title-main = 7                      # the same main title, the subtitle differs or is missing
      title-main = ${?HISTMERSION_MERGE_W_TITLE_MAIN}
      title-similar = 5                   # Jaro-Winkler of the folded titles at least title-similar-at-least
      title-similar = ${?HISTMERSION_MERGE_W_TITLE_SIMILAR}
      title-similar-at-least = 0.92
      title-similar-at-least = ${?HISTMERSION_MERGE_W_TITLE_SIMILAR_AT_LEAST}
      title-tokens = 2                    # word-set Jaccard at least title-tokens-at-least
      title-tokens = ${?HISTMERSION_MERGE_W_TITLE_TOKENS}
      title-tokens-at-least = 0.7
      title-tokens-at-least = ${?HISTMERSION_MERGE_W_TITLE_TOKENS_AT_LEAST}
      title-differs = -6
      title-differs = ${?HISTMERSION_MERGE_W_TITLE_DIFFERS}
      authors-same = 6                    # every author on both sides, any order, initials compatible
      authors-same = ${?HISTMERSION_MERGE_W_AUTHORS_SAME}
      authors-first = 4                   # the first author the same
      authors-first = ${?HISTMERSION_MERGE_W_AUTHORS_FIRST}
      authors-overlap = 2                 # at least half of them
      authors-overlap = ${?HISTMERSION_MERGE_W_AUTHORS_OVERLAP}
      authors-disjoint = -5
      authors-disjoint = ${?HISTMERSION_MERGE_W_AUTHORS_DISJOINT}
      year-equal = 3
      year-equal = ${?HISTMERSION_MERGE_W_YEAR_EQUAL}
      year-near = 1.5                     # one year apart: online first vs print
      year-near = ${?HISTMERSION_MERGE_W_YEAR_NEAR}
      year-reprint = 0.5                  # further apart, and a citekey, alias or note says the other year
      year-reprint = ${?HISTMERSION_MERGE_W_YEAR_REPRINT}
      year-far = -2
      year-far = ${?HISTMERSION_MERGE_W_YEAR_FAR}
      venue-equal = 1
      venue-equal = ${?HISTMERSION_MERGE_W_VENUE_EQUAL}
      venue-differs = -0.5
      venue-differs = ${?HISTMERSION_MERGE_W_VENUE_DIFFERS}
      body-same = 8                       # the same OCR body, or MinHash at least body-same-at-least
      body-same = ${?HISTMERSION_MERGE_W_BODY_SAME}
      body-same-at-least = 0.8
      body-same-at-least = ${?HISTMERSION_MERGE_W_BODY_SAME_AT_LEAST}
      body-edition = 2                    # MinHash at least body-edition-at-least: perhaps another edition
      body-edition = ${?HISTMERSION_MERGE_W_BODY_EDITION}
      body-edition-at-least = 0.3
      body-edition-at-least = ${?HISTMERSION_MERGE_W_BODY_EDITION_AT_LEAST}
      body-differs = -4                   # MinHash below body-differs-below
      body-differs = ${?HISTMERSION_MERGE_W_BODY_DIFFERS}
      body-differs-below = 0.1
      body-differs-below = ${?HISTMERSION_MERGE_W_BODY_DIFFERS_BELOW}
      alias = 8                           # one side's citekey is an old citekey (alias) of the other
      alias = ${?HISTMERSION_MERGE_W_ALIAS}
    }
  }
  limits {
    max-page = 500                        # HARD cap on any `limit` a caller may ask for (a page, a facet
    max-page = ${?HISTMERSION_MAX_PAGE}        # list, a job listing) — an unbounded limit is a denial of service
    search = 20                           # default result page size
    findings = 4000                       # max map points per request
    snippet-chars = 240                   # ts_headline budget per hit (MaxWords = this / 6)
    chunk-chars = 4000                    # max size of one FTS body chunk (tsvector caps a row at ~1 MB)
    reindex-chars = 2000000               # body characters re-chunked per /api/reindex call (keeps it well under the 20 s HTTP timeout)
    upload-bytes = 268435456              # 256 MB — largest accepted POST /api/ingest upload
    upload-bytes = ${?HISTMERSION_UPLOAD_BYTES}
    inline-bytes = 33554432               # 32 MB — largest inline (base64) payload the MCP `ingest` tool accepts
    inline-bytes = ${?HISTMERSION_INLINE_BYTES}
    asset-bytes = 16777216                # 16 MB — largest single stored figure
    asset-bytes = ${?HISTMERSION_ASSET_BYTES}
    full-text-chars = 60000               # cap on fullText=true / section=body without offset (get_source)
    full-text-chars = ${?HISTMERSION_FULL_TEXT_CHARS}
    coverage-sources = 1000               # an article's coverage (#958) reads at most this many of its filter's
    coverage-sources = ${?HISTMERSION_COVERAGE_SOURCES}   # sources (citekey order); the counts stay exact
    passages {                            # `passages`: find text inside ONE source's body (#954)
      limit = 10                          # passages shown when the caller gives no limit
      max-limit = 50                      # cap on a caller's limit
      context = 600                       # characters of context around a match, by default
      max-context = 3000                  # cap on a caller's context
      max-matches = 10000                 # matches counted per call before it stops ("10000+")
      regex-timeout-ms = 2000             # a caller's regex running longer over one body is refused
      regex-timeout-ms = ${?HISTMERSION_PASSAGES_REGEX_TIMEOUT_MS}
    }
  }
  ui {
    tiles = "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
    tiles = ${?HISTMERSION_TILES}
    tiles-max-zoom = 12
    tiles-tone = "light"                  # "dark" when `tiles` is a dark map: place names then switch to
    tiles-tone = ${?HISTMERSION_TILES_TONE}  # light text on a dark halo (the "Dark" base map always does)
    marker-radius = 5                     # drawn radius of a finding dot, px; clustering joins dots
                                          # whose centres are closer than 2 x this (they overlap)
    viewport-debounce-ms = 250            # "only papers in view": delay after moveend/zoomend
    page-size = 20                        # sources listed in the sidebar per request
    facet-suggestions = 12                # max rows in a chip autocomplete menu
    tree-depth = 2                        # default nesting of /api/aggregate?by=… (plan §1.6; max 3)
    tree-depth = ${?HISTMERSION_TREE_DEPTH}
    tree-samples = 3                      # sample sources listed under a leaf of the tree (0-5)
    tree-samples = ${?HISTMERSION_TREE_SAMPLES}
    max-buckets = 2000                    # most time buckets one /api/aggregate answer may contain; a
    max-buckets = ${?HISTMERSION_MAX_BUCKETS}  # window/size pair asking for more is a 400, not a 20-minute loop
    debounce { suggest-ms = 150           # keystroke → /api/facets
               search-ms = 400            # keystroke → State (search box, year boxes)
               reload-ms = 250            # State change → /api/findings + /api/sources
               preview-ms = 60 }          # a hovered suggestion's preview → the same reload
    time { min = -12000, max = 2026, default-from = -3500, default-to = -500 }
    narrow-max-width-px = 760             # at or below this viewport width the web UI switches to its
    narrow-max-width-px = ${?HISTMERSION_UI_NARROW_MAX_WIDTH_PX}  # phone layout (map first, drawers)
    narrow-max-height-px = 500            # …and so it does on a TOUCH screen at or below this height:
    narrow-max-height-px = ${?HISTMERSION_UI_NARROW_MAX_HEIGHT_PX}  # a phone held sideways
    events {                              # the events on the map in playback (#1440)
      local-fade-seconds = 2.5            # a LOCAL event (a battle) fades out over this many seconds of
      local-fade-seconds = ${?HISTMERSION_UI_EVENTS_LOCAL_FADE_SECONDS}  # playback after its span ends
      regional-fade-seconds = 1.0         # a REGIONAL one (an era, a migration): label and outline, the same
      regional-fade-seconds = ${?HISTMERSION_UI_EVENTS_REGIONAL_FADE_SECONDS}
      map-limit = 2000                    # most events /api/events/geo returns for one playback
      map-limit = ${?HISTMERSION_UI_EVENTS_MAP_LIMIT}
      outline-tolerance-deg = 0.02        # a regional event's area outline is simplified to this (degrees)
      outline-tolerance-deg = ${?HISTMERSION_UI_EVENTS_OUTLINE_TOLERANCE_DEG}
    }
    counters-poll-seconds = 30            # the toolbar's counts and "new" marks are re-read this often
    counters-poll-seconds = ${?HISTMERSION_UI_COUNTERS_POLL_SECONDS}  # (and after the page's own changes)
  }
  # ── stream 2.8: lint · queue · read-only query ──────────────────────────────────────────────
  query {
    # `query` does NOT run as the application role (which is typically a superuser, i.e. `pg_read_file`
    # and friends). Migration V011 creates a `histmersion_query` LOGIN role that holds nothing but SELECT and
    # carries `default_transaction_read_only = on`; the server ALTERs its password + statement_timeout at
    # startup from the two keys below, so the secret never lives in a migration file and can be rotated
    # by restarting. If the application role may not ALTER ROLE, the server logs an error and falls back
    # to the application DataSource — the statement check and the read-only transaction still apply, but
    # the role layer does not, so grant it or run the ALTER by hand.
    user = "histmersion_query"
    user = ${?HISTMERSION_QUERY_USER}
    password = "histmersion_query"
    password = ${?HISTMERSION_QUERY_PASS}
    timeout-ms = 10000                    # SET LOCAL statement_timeout for `histmersion query` (read-only txn)
    timeout-ms = ${?HISTMERSION_QUERY_TIMEOUT_MS}
    max-rows = 500                        # row cap; a result hitting it comes back marked truncated
    max-rows = ${?HISTMERSION_QUERY_MAX_ROWS}
    max-cell-chars = 2000                 # a single cell is truncated at this many chars (ocr_markdown is megabytes)
    max-cell-chars = ${?HISTMERSION_QUERY_MAX_CELL_CHARS}
  }
  lint {
    max-items = 50                        # offending rows LISTED per rule (`count` is always the true total)
    max-items = ${?HISTMERSION_LINT_MAX_ITEMS}
    suggestions = 3                       # closest citekey prefix matches offered per dangling edge target
    suggestions = ${?HISTMERSION_LINT_SUGGESTIONS}
  }
  # ── media from outside providers (#1446): pictures of places and events, legally reusable ────
  # Documented APIs only, at their pace: one request at a time per provider, `request-interval-ms`
  # apart; 429/503 and MediaWiki's `maxlag` answers wait for their Retry-After (at most
  # `max-retry-after-seconds`) up to `max-retries` times. The User-Agent names the project and its
  # repository and NOTHING else — no e-mail, no personal data.
  media {
    user-agent = "Histmersion (+https://github.com/MateuszKubuszok/histmersion)"
    user-agent = ${?HISTMERSION_MEDIA_USER_AGENT}
    timeout-seconds = 30                  # one request
    timeout-seconds = ${?HISTMERSION_MEDIA_TIMEOUT}
    request-interval-ms = 500             # the least time between two requests to one host
    request-interval-ms = ${?HISTMERSION_MEDIA_REQUEST_INTERVAL_MS}
    max-retries = 5                       # retries of one request after a 429/5xx/maxlag answer
    max-retries = ${?HISTMERSION_MEDIA_MAX_RETRIES}
    max-retry-after-seconds = 60          # a longer Retry-After gives up on the request instead
    max-retry-after-seconds = ${?HISTMERSION_MEDIA_MAX_RETRY_AFTER}
    default-limit = 50                    # places/events one `media import` asks about by default
    default-limit = ${?HISTMERSION_MEDIA_DEFAULT_LIMIT}
    max-limit = 500                       # the most one run takes, whatever --limit says
    max-limit = ${?HISTMERSION_MEDIA_MAX_LIMIT}
    display-px = 1280                     # width of the stored rendition (the provider's own resized copy)
    display-px = ${?HISTMERSION_MEDIA_DISPLAY_PX}
    thumb-px = 330                        # width of the card thumbnail; both are Wikimedia standard thumbnail widths
    thumb-px = ${?HISTMERSION_MEDIA_THUMB_PX}
    max-bytes = 8000000                   # a rendition larger than this is not stored
    max-bytes = ${?HISTMERSION_MEDIA_MAX_BYTES}
    per-property = 1                      # pictures kept per statement kind (the best-ranked first)
    per-property = ${?HISTMERSION_MEDIA_PER_PROPERTY}
    # An import JOB (`media import wikidata` without --dry-run) asks about this many Wikidata items at a
    # time and records each batch before the next, so a stopped job resumes where it was.
    import-batch = 50
    import-batch = ${?HISTMERSION_MEDIA_IMPORT_BATCH}
    # A site's card shows a picture stored for an EQUIVALENT place too: one with the same Wikidata
    # item, an old id merged into it, or another gazetteer's point of the same name within this distance
    # (Pleiades and GeoNames both list Göbekli Tepe; the picture came in for one of them).
    same-site-km = 3
    same-site-km = ${?HISTMERSION_MEDIA_SAME_SITE_KM}
    wikidata {
      api-url = "https://www.wikidata.org/w/api.php"
      api-url = ${?HISTMERSION_MEDIA_WIKIDATA_API}
      batch = 50                          # ids per wbgetentities call (the API's limit without a bot flag)
      # Not sent by default (0): Wikidata counts its QUERY SERVICE's lag in maxlag (17.7 s on
      # 2026-10-10, for hours), which is meant to slow down editing bots — a read of 50 items is no edit,
      # and with it every run waited and gave up. Set it (5 is the editing bots' value) to make reads
      # wait too. A 429 / Retry-After / maxlag answer is honoured either way.
      maxlag = 0
      maxlag = ${?HISTMERSION_MEDIA_WIKIDATA_MAXLAG}
      # statement → role; a place reads all of these, an event `event-properties`.
      # (P15 is Wikidata's "route map"; a site plan is P3311 "image of design plans".)
      place-properties = "P18:image,P242:locator-map,P3311:plan,P8592:aerial-view,P15:route-map"
      place-properties = ${?HISTMERSION_MEDIA_PLACE_PROPERTIES}
      event-properties = "P18:image"
      event-properties = ${?HISTMERSION_MEDIA_EVENT_PROPERTIES}
    }
    commons {
      api-url = "https://commons.wikimedia.org/w/api.php"
      api-url = ${?HISTMERSION_MEDIA_COMMONS_API}
      batch = 50                          # titles per imageinfo call
      maxlag = 5
      maxlag = ${?HISTMERSION_MEDIA_COMMONS_MAXLAG}
      # Licence families stored from this provider: cc0, public-domain, cc-by, cc-by-sa. The
      # non-commercial ones (cc-by-nc, cc-by-nc-sa) are off unless added here; no-derivatives and
      # GFDL-only files likewise. All-rights-reserved and an unreadable licence are never stored.
      licences = "cc0,public-domain,cc-by,cc-by-sa"
      licences = ${?HISTMERSION_MEDIA_COMMONS_LICENCES}
    }
    # Book covers: the local Calibre library's own (read host-side by `histmersion media covers`), else
    # the Open Library Covers API by ISBN/OCLC. Covers are the publisher's pictures of the user's own
    # books: shown in the local UI, never put in a bundle, no reuse licence recorded.
    covers {
      open-library-url = "https://covers.openlibrary.org"
      open-library-url = ${?HISTMERSION_MEDIA_OPEN_LIBRARY_URL}
      open-library-page = "https://openlibrary.org"     # the credit line's link
      open-library-page = ${?HISTMERSION_MEDIA_OPEN_LIBRARY_PAGE}
      # The API allows 100 ISBN/OCLC lookups per IP per 5 minutes: one per 3 s keeps under it.
      request-interval-ms = 3000
      request-interval-ms = ${?HISTMERSION_MEDIA_OPEN_LIBRARY_INTERVAL_MS}
      size = "L"                          # the stored cover (S, M, L)
      thumb-size = "M"                    # the card's thumbnail
    }
    # A paper's illustration: one of the figures its conversion kept, the largest on its early pages —
    # never a small picture (a logo), a strip (a journal masthead, a rule), one repeated through the
    # text (a running header), or a page scan (many figures of one page-like size).
    illustrations {
      min-side = 160                      # px, both sides
      min-area = 40000                    # px²
      max-aspect = 4.0                    # longest side / shortest side
      max-refs = 2                        # a figure linked from the text more often is a running header
      early-pages = 6                     # figures on these first pages are preferred
      page-scan-min = 5                   # this many figures of one portrait size are page scans
    }
  }
  # ── events from catalogues (#1449): `histmersion events import gvp|noaa|wikidata` ───────────
  # A catalogue event is a research lead, drawn lighter than an event a source attests. What an import
  # keeps by default: everything up to `max-year` inside the research `region`; outside it, eruptions
  # of VEI >= `gvp.outside-min-vei` and earthquakes of magnitude >= `noaa.outside-min-magnitude`.
  # `--bbox`, `--from/--to`, `--min-vei`, `--min-magnitude` narrow a run further.
  events {
    timeout-seconds = 90                  # one catalogue request (the GVP's WFS is slow on large pages)
    timeout-seconds = ${?HISTMERSION_EVENTS_TIMEOUT}
    min-year = -12000
    max-year = 499
    max-year = ${?HISTMERSION_EVENTS_MAX_YEAR}
    region = "-25,20,90,70"               # minLon,minLat,maxLon,maxLat — the corpus's research region
    region = ${?HISTMERSION_EVENTS_REGION}
    merge-km = 60                         # records of the same kind this close in space…
    merge-years = 30                      # …and overlapping in time once widened by this are ONE event
    default-limit = 100000                # records one run takes at most (--limit lowers it)
    rederive-batch = 500                  # records `events rederive` writes in one transaction
    gvp {
      url = "https://webservices.volcano.si.edu/geoserver/GVP-VOTW/ows"
      url = ${?HISTMERSION_EVENTS_GVP_URL}
      window-years = 1000                 # one request per this many years of start dates (no paging:
                                          # the WFS took 45 s+ per `startIndex` page on 2026-10-14)
      page-size = 5000                    # the most eruptions one window may hold
      request-interval-ms = 1000
      region-min-vei = 0                  # 0 = every eruption in the region
      outside-min-vei = 4
      outside-min-vei = ${?HISTMERSION_EVENTS_OUTSIDE_MIN_VEI}
      floor-year = -9700                  # the Holocene's start: no GVP dating reaches before it (a ± is
      floor-year = ${?HISTMERSION_EVENTS_GVP_FLOOR_YEAR}   # held there); none reaches after the present
    }
    noaa {
      url = "https://www.ngdc.noaa.gov/hazel/hazard-service/api/v1"
      url = ${?HISTMERSION_EVENTS_NOAA_URL}
      page-size = 200
      request-interval-ms = 1000
      datasets = "earthquakes,volcanoes,tsunamis"
      region-min-magnitude = 0
      outside-min-magnitude = 6.5
      outside-min-magnitude = ${?HISTMERSION_EVENTS_OUTSIDE_MIN_MAGNITUDE}
    }
    wikidata {
      sparql-url = "https://query.wikidata.org/sparql"
      sparql-url = ${?HISTMERSION_EVENTS_WIKIDATA_SPARQL}
      api-url = "https://www.wikidata.org/w/api.php"
      api-url = ${?HISTMERSION_EVENTS_WIKIDATA_API}
      # The query service limited anonymous clients to one request a minute during an outage on
      # 2026-10-14: one class per minute by default (an import of every class takes ~15 min, as a job).
      request-interval-ms = 60000
      request-interval-ms = ${?HISTMERSION_EVENTS_WIKIDATA_INTERVAL_MS}
      api-interval-ms = 1000              # wbgetentities (labels and aliases) — the Action API's pace
      # class → kind, the most specific first (an item in two classes takes the first one's kind)
      classes = "Q1261499:naval_battle,Q188055:siege,Q178561:battle,Q124734:revolt,Q131569:treaty,Q198:war,Q7692360:eruption,Q7944:earthquake,Q8070:tsunami,Q8068:flood,Q43059:drought,Q168247:famine,Q44512:epidemic"
      classes = ${?HISTMERSION_EVENTS_WIKIDATA_CLASSES}
      languages = "en,de,fr,it,es,pl,el,la,tr,ru"   # names searched for in the sources' text
      batch = 50
    }
    links {                               # proposed links to the corpus (no model): `events candidates`
      km = 150                            # a finding this far from the event…
      years = 100                         # …and this many years from its span still counts, less
      name-weight = 1.0                   # a source whose text names the event
      finding-weight = 0.6                # at most, for its findings near the event
      min-score = 0.3
      min-name-chars = 5                  # shorter names are not searched for
      max-candidates = 12                 # per event
      sources-per-name = 50               # sources read per name the index finds
      near-findings = 12                  # findings listed on an event's card
      batch = 100                         # events per step of a candidates job
    }
    leads {
      km = 300                            # "N findings within … km and ±… years" of a catalogue event
      years = 100
      article-km = 300                    # an article's catalogue leads: events this near its findings
      large-vei = 5                       # …that are this large (or wars)
      large-magnitude = 7.0
      article-limit = 15
    }
    site-types {                          # refining Wikidata sites from their items' classes
      batch = 50
      superclass-depth = 2                # P279 steps walked from an unknown class
    }
  }
  # ── acquisition & assessment (plan §5.2 stream 2.6) ─────────────────────────────────────────
  # Upstream APIs are keyless today; a key only raises the rate limit. The contact e-mail is the
  # POLITE-POOL identifier Crossref/OpenAlex/Unpaywall ask for (User-Agent + mailto/email params)
  # and is sent nowhere else. It is set per install (HISTMERSION_ACQUIRE_CONTACT_EMAIL, which the
  # install scripts pass to the service), never here; blank = anonymous: no polite pool, no Unpaywall.
  acquire {
    contact-email = ""
    contact-email = ${?HISTMERSION_ACQUIRE_CONTACT_EMAIL}
    openalex.url = "https://api.openalex.org"
    openalex.url = ${?HISTMERSION_ACQUIRE_OPENALEX_URL}
    crossref.url = "https://api.crossref.org"
    crossref.url = ${?HISTMERSION_ACQUIRE_CROSSREF_URL}
    unpaywall.url = "https://api.unpaywall.org/v2"
    unpaywall.url = ${?HISTMERSION_ACQUIRE_UNPAYWALL_URL}
    core {
      url = "https://api.core.ac.uk/v3"
      url = ${?HISTMERSION_ACQUIRE_CORE_URL}
      api-key = ""
      api-key = ${?HISTMERSION_ACQUIRE_CORE_API_KEY}
    }
    semantic-scholar {
      url = "https://api.semanticscholar.org/graph/v1"
      url = ${?HISTMERSION_ACQUIRE_SEMANTIC_SCHOLAR_URL}
      api-key = ""
      api-key = ${?HISTMERSION_ACQUIRE_SEMANTIC_SCHOLAR_API_KEY}
    }
    # Europe PMC's REST API (#1523): a DOI search names the work's PMCID and the full-text links it
    # knows; keyless, no e-mail parameter, asked with `public-user-agent`
    europepmc.url = "https://www.ebi.ac.uk/europepmc/webservices/rest"
    europepmc.url = ${?HISTMERSION_ACQUIRE_EUROPEPMC_URL}
    # NCBI's PMC Article Datasets (the public AWS Open Data bucket that replaced the retired PMC OA
    # web service and FTP): per-article metadata JSON naming the PDF and the JATS XML
    pmc-dataset.url = "https://pmc-oa-opendata.s3.amazonaws.com"
    pmc-dataset.url = ${?HISTMERSION_ACQUIRE_PMC_DATASET_URL}
    # what the PMC hosts see: the project and its repository, no e-mail and no personal data
    public-user-agent = "Histmersion (+https://github.com/MateuszKubuszok/histmersion)"
    public-user-agent = ${?HISTMERSION_ACQUIRE_PUBLIC_USER_AGENT}
    # Zenodo's REST API (#1580): `/api/records/<id>` names an open record's files, so a Zenodo record
    # page that an OA index gives as the "PDF" is resolved to its PDF
    zenodo.url = "https://zenodo.org"
    zenodo.url = ${?HISTMERSION_ACQUIRE_ZENODO_URL}
    # DataCite's REST API: `/dois/<doi>` gives where a DataCite DOI resolves (a repository's item page
    # for most humanities theses, reports and chapters; Crossref does not know these DOIs)
    datacite.url = "https://api.datacite.org"
    datacite.url = ${?HISTMERSION_ACQUIRE_DATACITE_URL}
    # repository LANDING PAGES (#1580): a location whose URL is an item page, not the PDF, is resolved
    # one step — Zenodo by its API, an institutional repository by its `citation_pdf_url` meta tag
    # (Google Scholar's inclusion convention). Read only on a repository: an OA index says so, an allowed
    # host, an academic host (.edu, .ac.<cc>, or a word below in a host label), or a repository
    # platform's `generator` tag — and NEVER on a denied host (publishers; sites that are not
    # repositories), which wins over all of them. Lists are comma-separated; a host matches itself and
    # its subdomains. Bot protection or a 403 is no copy: the work goes to the acquire queue.
    landing {
      enabled = true
      enabled = ${?HISTMERSION_ACQUIRE_LANDING_ENABLED}
      max-pages = 4                       # landing pages read per work, at most
      max-pages = ${?HISTMERSION_ACQUIRE_LANDING_MAX_PAGES}
      allow-hosts = "zenodo.org,figshare.com,osf.io,hal.science,hal.archives-ouvertes.fr,core.ac.uk,depot.ceon.pl,researchprofiles.ku.dk,pure.mpg.de,edoc.hu-berlin.de,repository.cam.ac.uk,ora.ox.ac.uk,discovery.ucl.ac.uk,eprints.whiterose.ac.uk,dspace.mit.edu,dash.harvard.edu,escholarship.org,digital.library.unt.edu,biblio.ugent.be,lirias.kuleuven.be,repository.ubn.ru.nl,scholarlypublications.universiteitleiden.nl,pure.uva.nl,diva-portal.org,urn.kb.se,helda.helsinki.fi,duo.uio.no,curis.ku.dk,pure.au.dk,openaccess.city.ac.uk,research-repository.st-andrews.ac.uk,publikationen.uni-tuebingen.de,archiv.ub.uni-heidelberg.de,edoc.ub.uni-muenchen.de,epub.ub.uni-muenchen.de,kups.ub.uni-koeln.de,opus4.kobv.de,serval.unil.ch,boris.unibe.ch,zora.uzh.ch,iris.unipi.it,iris.uniroma1.it,ruidera.uclm.es,digibug.ugr.es,repositorio.ucm.es,run.unl.pt,dialnet.unirioja.es,ri.conicet.gov.ar"
      allow-hosts = ${?HISTMERSION_ACQUIRE_LANDING_ALLOW_HOSTS}
      deny-hosts = "elsevier.com,sciencedirect.com,cell.com,springer.com,springernature.com,nature.com,biomedcentral.com,wiley.com,onlinelibrary.wiley.com,tandfonline.com,taylorfrancis.com,routledge.com,sagepub.com,journals.sagepub.com,jstor.org,muse.jhu.edu,cambridge.org,academic.oup.com,oup.com,degruyter.com,degruyterbrill.com,brill.com,brepols.net,peeters-leuven.be,ieee.org,acm.org,science.org,pnas.org,annualreviews.org,karger.com,thieme-connect.com,emerald.com,iop.org,aip.org,acs.org,rsc.org,mdpi.com,frontiersin.org,plos.org,hindawi.com,scirp.org,ingentaconnect.com,cairn.info,persee.fr,openedition.org,researchgate.net,academia.edu,semanticscholar.org,scribd.com,google.com,books.google.com,example.invalid"
      deny-hosts = ${?HISTMERSION_ACQUIRE_LANDING_DENY_HOSTS}
      # a host label that is or starts with one of these is a publisher's (a university press on a .edu),
      # unless the host is in allow-hosts
      deny-host-words = "press,journals,journal,books,ebooks,shop,store"
      deny-host-words = ${?HISTMERSION_ACQUIRE_LANDING_DENY_HOST_WORDS}
      academic-host-words = "repository,repositorio,repositori,depot,eprints,dspace,pure,research-portal,researchprofiles,publikationen,opus,edoc,digibug,uni-,univ"
      academic-host-words = ${?HISTMERSION_ACQUIRE_LANDING_ACADEMIC_HOST_WORDS}
      generators = "dspace,eprints,pure,invenio,islandora,samvera,hyrax,figshare,fedora,digital commons,bepress,opus,mycore,goobi"
      generators = ${?HISTMERSION_ACQUIRE_LANDING_GENERATORS}
      deny-generators = "open journal systems,ojs,janeway,scholastica"   # journal platforms: a publisher's page
      deny-generators = ${?HISTMERSION_ACQUIRE_LANDING_DENY_GENERATORS}
    }
    arxiv.url = "https://arxiv.org"
    arxiv.url = ${?HISTMERSION_ACQUIRE_ARXIV_URL}
    archive-org.url = "https://archive.org"
    archive-org.url = ${?HISTMERSION_ACQUIRE_ARCHIVE_ORG_URL}
    wikipedia.url = "https://en.wikipedia.org/w/api.php"
    wikipedia.url = ${?HISTMERSION_ACQUIRE_WIKIPEDIA_URL}
    retraction-watch.csv-url = "https://gitlab.com/crossref/retraction-watch-data/-/raw/main/retraction_watch.csv"
    retraction-watch.csv-url = ${?HISTMERSION_ACQUIRE_RETRACTION_WATCH_CSV_URL}
    # The unauthorised mirror distributes copyrighted papers without publisher authorisation and its legality varies
    # by jurisdiction. OFF by default; when enabled it is tried only after every legal OA source has
    # failed, and each use is logged as a warning.
    unlicensed {
      enabled = false
      enabled = ${?HISTMERSION_ACQUIRE_UNLICENSED_ENABLED}
      mirror = "https://example.invalid"
      mirror = ${?HISTMERSION_ACQUIRE_UNLICENSED_MIRROR}
    }
    user-agent = "histmersion/0.1"
    user-agent = ${?HISTMERSION_ACQUIRE_USER_AGENT}
    timeout-seconds = 60
    timeout-seconds = ${?HISTMERSION_ACQUIRE_TIMEOUT_SECONDS}
    spool-dir = ""                        # server-side scratch for fetched PDFs; empty = java.io.tmpdir
    spool-dir = ${?HISTMERSION_ACQUIRE_SPOOL_DIR}
    defaults {
      search-limit = 25                   # discover search page size
      min-year = 1900                     # discover: oldest publication year considered
      followups-limit = 100               # followups: max citing papers fetched
      archive-rows = 8                    # archive.org search rows
      well-cited-at = 50                  # >= this many citations -> "current"
      low-cited-at = 3                    # < this many citations, and old, -> "low-impact"
      stale-before = 2018                 # the year "old" starts before
      # an import closes the open acquisition items that name its DOI; one whose text resembles its
      # title and first author this much (0..1) is only listed as a possible match, never closed
      title-match-at = 0.6
      title-match-at = ${?HISTMERSION_ACQUIRE_TITLE_MATCH_AT}
    }
  }
  # ── authentication (plan §4.1) ─────────────────────────────────────────────────
  # When api-key is non-empty, every write method (POST/PUT/PATCH/DELETE) requires
  # `Authorization: Bearer <key>`. GET/HEAD/OPTIONS stay open.
  # Empty (the default) = no auth, local-only mode.
  auth {
    api-key = ""
    api-key = ${?HISTMERSION_API_KEY}
  }
  cli {
    server-url = "http://localhost:8000"
    server-url = ${?HISTMERSION_SERVER_URL}
    # The ONE host-local integration: Calibre lives on the user's machine, so `histmersion calibre …`
    # shells out to these instead of going through the server.
    calibre {
      library-dir = "~/Calibre Library"
      library-dir = ${?HISTMERSION_CALIBRE_LIBRARY_DIR}
      calibredb = "calibredb"             # absolute path if it is not on PATH
      calibredb = ${?HISTMERSION_CALIBRE_CALIBREDB}
      sqlite = "sqlite3"                 # read-only fallback while the Calibre GUI holds the DB
      sqlite = ${?HISTMERSION_CALIBRE_SQLITE3}
      originals-dir = ""                  # optional: host dir of originals as <citekey>/paper.*; `calibre push`/`sync` else download the server's stored original
      originals-dir = ${?HISTMERSION_CALIBRE_ORIGINALS_DIR}
    }
  }
  places {                                # the gazetteer (plan §1.6a)
    point-tolerance-km = 10               # a POINT place (a Pleiades site) contains findings within this radius
    point-tolerance-km = ${?HISTMERSION_PLACE_TOLERANCE_KM}
    search-limit = 20                     # default rows from /api/places?q=
    children-limit = 200                  # max children listed for one place
    tree-limit = 500                      # max rows in one hierarchy walk
    tree-depth = 6                        # world > macro-region > region > polity > site is 5
    seed-dir = "db/places"                # HOST directory `histmersion places seed` imports from
    seed-dir = ${?HISTMERSION_PLACES_DIR}
    import-batch = 400                    # features per POST /api/places/import (keeps request bodies small)
    # the geocoder (#981): Pleiades files many rough locations at ONE grid point (17 places, three of
    # them "Mesopotamia", at 37.5 N 37.5 E); a point shared by this many places ranks last
    geocode-placeholder-min = 4
    geocode-placeholder-min = ${?HISTMERSION_GEOCODE_PLACEHOLDER_MIN}
    geocode-repair-km = 100               # `lint --rule finding-geocode` moves only points that land farther away
    geocode-repair-km = ${?HISTMERSION_GEOCODE_REPAIR_KM}
    # a finding whose point is a PLACEHOLDER (an atlas grid square's centre, or the point the geocoder
    # gives a region's name) belongs to what its NAME resolves to and to the areas that cover at least
    # this share of that place's shape — not to the sites near the point: 12 findings on "Greece" at
    # 37.5 N 22.5 E had joined Tegea and the Peloponnese (15 % of Greece; Mycenaean Greece covers 30-43 %)
    placeholder-area-share = 0.25
    placeholder-area-share = ${?HISTMERSION_PLACEHOLDER_AREA_SHARE}
    # a view at a time (the map at a year, place search/suggestions, children and tree with a time)
    # shows present-day places (Natural Earth cities, undated GeoNames/Wikidata places) only from this
    # year on — before it, "Kraków" would sit among the sites of 1400 BCE
    modern-from = 1500
    modern-from = ${?HISTMERSION_PLACES_MODERN_FROM}
    # cap on /api/places/geo's `limit` (the map's areas and sites), apart from limits.max-page: over a
    # whole range the area layer asks for every state alive in it (1 744 over -3000..2000, ~7 MB of
    # simplified outlines; a year has under 200)
    geo-max-limit = 2000
    geo-max-limit = ${?HISTMERSION_PLACES_GEO_MAX_LIMIT}
    # the external sources (#1064): `histmersion places load geonames|wikidata|lpf` — pinned extracts and
    # the Linked Places Format drop folder (World Historical Gazetteer downloads), joined by identifier
    sources {
      dir = ""                            # the pinned extracts (*.ndjson.gz); "" = <data dir>/gazetteer
      dir = ${?HISTMERSION_GAZETTEER_DIR}
      lpf-dir = ""                        # LPF files to import (*.json *.jsonld *.geojson *.ndjson *.tsv); "" = <data dir>/gazetteer/lpf
      lpf-dir = ${?HISTMERSION_GAZETTEER_LPF_DIR}
      manifest = "gazetteer/extracts.json"  # the pins (file, version, sha256, url), relative to init.data-dir
      manifest = ${?HISTMERSION_GAZETTEER_MANIFEST}
      batch = 1000                        # records per transaction
      max-lpf-mb = 512                    # a FeatureCollection is read whole; a bigger file must be NDJSON (a feature per line)
      download-timeout-seconds = 1800     # fetching a pinned extract that is missing (only when its pin has a url)
      # A GeoNames/Wikidata place with an end and no start (a state "dissolved 1769", inception unknown)
      # is seen by time filters only this many years before its end — an unknown start is not "since
      # forever". Applied at import (re-run `places load <source> --apply` after changing it); V074
      # fixed the rows stored before it with the default.
      open-start-window-years = 300
      open-start-window-years = ${?HISTMERSION_GAZETTEER_OPEN_START_WINDOW_YEARS}
      # A GeoNames/Wikidata record of these kinds (comma-separated) whose geometry is only a POINT is
      # not kept as a place of its own: a region is a shape, and a dot for it is noise on the map, in
      # name search and in finding matches. It still JOINS a place its ids name (a seed region gets
      # its names, links and class). "" keeps every record. `lint --rule place-imported-point-area`
      # lists the ones stored before (2026-10-09); `--fix` removes them, `point-area-fix-batch` places
      # per transaction, for at most `point-area-fix-seconds` per call (the CLI calls again).
      point-area-kinds = "region,polity,people"
      point-area-kinds = ${?HISTMERSION_GAZETTEER_POINT_AREA_KINDS}
      point-area-fix-batch = 2000
      point-area-fix-seconds = 20
    }
  }
  periods {                               # named periods: the timeline presets (#719)
    periodo-url = "https://n2t.net/ark:/99152/p0d.json"   # the PeriodO dump (CC0) `periods fetch periodo` reads
    periodo-url = ${?HISTMERSION_PERIODO_URL}
    # authorities `periods fetch periodo` imports when none is named (comma-separated PeriodO ids):
    # the BSA's periods of Greece, EAMENA's Near East and North Africa, the UCLA Egyptology chronology
    periodo-collections = "p0ds9qj,p0m64td,p0qk76z"
    periodo-collections = ${?HISTMERSION_PERIODO_COLLECTIONS}
    seed-file = "periods/periodo-seed.json"   # the bundled presets, relative to init.data-dir
  }
  init {                                  # first-run data (#720)
    auto = true                           # on start, import the bundled gazetteer / period presets into EMPTY tables
    auto = ${?HISTMERSION_INIT_AUTO}
    data-dir = "db"                       # server-side dir holding places/ and periods/; the bundle's own db/ when bundled
    data-dir = ${?HISTMERSION_INIT_DATA_DIR}
    fetch-sources = "cliopatria,awmc,land,periodo"   # what `histmersion init --fetch` downloads, in order
    fetch-sources = ${?HISTMERSION_INIT_FETCH_SOURCES}
  }
  # ── embedded research agents (docs/research-embedded-agents.md) ─────────────────────────────
  # OFF by default: the external Claude Code workflow is untouched until this is switched on. API keys
  # are read from the environment ONLY and never stored, logged or returned. Model ids and prices are
  # deliberately not filled in: a role is `provider:model` (provider = anthropic | openai | local) and a
  # model with no price is REFUSED (sttp-ai would count it as free).
  agents {
    enabled = false
    enabled = ${?HISTMERSION_AGENTS_ENABLED}
    auto-enrich = true                    # queue an enrich-source run for every source an ingest brings in
    auto-enrich = ${?HISTMERSION_AGENTS_AUTO_ENRICH}
    prompts-dir = ""                      # overrides bundled prompts file by file (mirrors the bundled agents/ tree)
    prompts-dir = ${?HISTMERSION_AGENTS_PROMPTS_DIR}
    providers {
      anthropic {
        base-url = "https://api.anthropic.com"
        base-url = ${?HISTMERSION_AGENTS_ANTHROPIC_URL}
        api-key = ""
        api-key = ${?ANTHROPIC_API_KEY}
        strict-tools = false              # Claude has no strict tool mode; ignored
        timeout-seconds = 600
        timeout-seconds = ${?HISTMERSION_AGENTS_ANTHROPIC_TIMEOUT}
      }
      openai {
        base-url = "https://api.openai.com/v1"
        base-url = ${?HISTMERSION_AGENTS_OPENAI_URL}
        api-key = ""
        api-key = ${?OPENAI_API_KEY}
        strict-tools = true               # OpenAI strict function calling (schemas normalised for it)
        strict-tools = ${?HISTMERSION_AGENTS_OPENAI_STRICT_TOOLS}
        timeout-seconds = 600
        timeout-seconds = ${?HISTMERSION_AGENTS_OPENAI_TIMEOUT}
      }
      local {                             # any OpenAI-compatible server (llama.cpp, LM Studio, vLLM, Ollama)
        base-url = "http://127.0.0.1:11434/v1"
        base-url = ${?HISTMERSION_AGENTS_LOCAL_URL}
        api-key = ""
        api-key = ${?HISTMERSION_AGENTS_LOCAL_API_KEY}
        strict-tools = false              # most local servers reject or ignore `strict`
        strict-tools = ${?HISTMERSION_AGENTS_LOCAL_STRICT_TOOLS}
        timeout-seconds = 1800            # a large local model on a laptop is slow
        timeout-seconds = ${?HISTMERSION_AGENTS_LOCAL_TIMEOUT}
      }
      # `claude-code:<model>` runs YOUR `claude` CLI headlessly (`claude -p`) on YOUR Claude login: it
      # spends your plan's usage, which cannot be seen from here — give it an allowance
      # (e.g. "claude-code:* = 2M tokens/5h, reserve 20%"). Personal use on your own machine only;
      # see docs/research-model-providers.md before enabling it.
      claude-code {
        command = "claude"                # an absolute path when the server's PATH lacks it (LaunchAgents)
        command = ${?HISTMERSION_AGENTS_CLAUDE_COMMAND}
        config-dir = ""                   # a CLAUDE_CONFIG_DIR of its own ("" = ~/.claude); log in there once
        config-dir = ${?HISTMERSION_AGENTS_CLAUDE_CONFIG_DIR}
        extra-args = ""                   # appended to every call (your settings files stay out: --setting-sources "")
        extra-args = ${?HISTMERSION_AGENTS_CLAUDE_EXTRA_ARGS}
        use-api-key = false               # false: ANTHROPIC_API_KEY/AUTH_TOKEN are removed from its environment
        use-api-key = ${?HISTMERSION_AGENTS_CLAUDE_USE_API_KEY}
        allow-non-loopback = false        # refused while the server listens beyond loopback (others could spend your plan)
        allow-non-loopback = ${?HISTMERSION_AGENTS_CLAUDE_ALLOW_NON_LOOPBACK}
        mcp-url = ""                      # the agent MCP endpoint as the CLI reaches it ("" = public-url + /mcp/agent)
        mcp-url = ${?HISTMERSION_AGENTS_CLAUDE_MCP_URL}
        timeout-seconds = 1800            # one `claude -p` call, tool turns included
        timeout-seconds = ${?HISTMERSION_AGENTS_CLAUDE_TIMEOUT}
        limit-cooldown-minutes = 60       # after "usage limit reached" with no reset time, skip the model this long
        # --disable-slash-commands: no skill or slash command is loaded. A role's skills are inlined in its
        # generated prompt, and a main-thread --agent gets no `skills:` preload anyway (§3a P4).
        disable-slash-commands = true
        disable-slash-commands = ${?HISTMERSION_AGENTS_CLAUDE_DISABLE_SLASH_COMMANDS}
        # Set in the CLI's environment on every call; "" or null REMOVES the variable (also one the server
        # inherited), and a name not listed here may be added. A variable set in the server's own
        # environment wins over this file and these defaults. The defaults switch off what only adds
        # prompt, tools, skills or background work a headless research agent never uses — nothing that
        # touches thinking, structured outputs (--json-schema), refusals, model fallback or web fetch.
        # scripts/agents/claude-overhead.sh measures a launch offline.
        env {
          CLAUDE_CODE_DISABLE_ARTIFACT = "1"              # the Artifact publishing tool and its long description
          CLAUDE_CODE_DISABLE_ARTIFACT = ${?CLAUDE_CODE_DISABLE_ARTIFACT}
          CLAUDE_CODE_DISABLE_BUNDLED_SKILLS = "1"        # the skills and workflows that ship with Claude Code (a role's skills are in its prompt)
          CLAUDE_CODE_DISABLE_BUNDLED_SKILLS = ${?CLAUDE_CODE_DISABLE_BUNDLED_SKILLS}
          CLAUDE_CODE_DISABLE_CLAUDE_API_SKILL = "1"      # the bundled claude-api skill
          CLAUDE_CODE_DISABLE_CLAUDE_API_SKILL = ${?CLAUDE_CODE_DISABLE_CLAUDE_API_SKILL}
          CLAUDE_CODE_DISABLE_CLAUDE_CODE_SKILL = "1"     # the bundled claude-code skill
          CLAUDE_CODE_DISABLE_CLAUDE_CODE_SKILL = ${?CLAUDE_CODE_DISABLE_CLAUDE_CODE_SKILL}
          CLAUDE_CODE_DISABLE_CLAUDE_MDS = "1"            # every CLAUDE.md layer (managed, user, project): none belongs in a role's context
          CLAUDE_CODE_DISABLE_CLAUDE_MDS = ${?CLAUDE_CODE_DISABLE_CLAUDE_MDS}
          CLAUDE_CODE_DISABLE_AUTO_MEMORY = "1"           # the auto-memory prompt and its memory directory reads and writes
          CLAUDE_CODE_DISABLE_AUTO_MEMORY = ${?CLAUDE_CODE_DISABLE_AUTO_MEMORY}
          CLAUDE_CODE_DISABLE_GIT_INSTRUCTIONS = "1"      # git instructions and git status in the context (the work dir is empty anyway)
          CLAUDE_CODE_DISABLE_GIT_INSTRUCTIONS = ${?CLAUDE_CODE_DISABLE_GIT_INSTRUCTIONS}
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS = "1"      # background shells and agents (a backgrounded subagent ends a step with two results)
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS = ${?CLAUDE_CODE_DISABLE_BACKGROUND_TASKS}
          CLAUDE_CODE_DISABLE_CRON = "1"                  # the Cron tools and their skill
          CLAUDE_CODE_DISABLE_CRON = ${?CLAUDE_CODE_DISABLE_CRON}
          CLAUDE_CODE_DISABLE_WORKFLOWS = "1"             # the Workflow tool and the workflow skills
          CLAUDE_CODE_DISABLE_WORKFLOWS = ${?CLAUDE_CODE_DISABLE_WORKFLOWS}
          CLAUDE_CODE_DISABLE_EXPLORE_PLAN_AGENTS = "1"   # the built-in Explore and Plan agents
          CLAUDE_CODE_DISABLE_EXPLORE_PLAN_AGENTS = ${?CLAUDE_CODE_DISABLE_EXPLORE_PLAN_AGENTS}
          CLAUDE_CODE_DISABLE_ADVISOR_TOOL = "1"          # the advisor (a second model consulted mid-turn): the run's picked model answers alone
          CLAUDE_CODE_DISABLE_ADVISOR_TOOL = ${?CLAUDE_CODE_DISABLE_ADVISOR_TOOL}
        }
      }
      # `codex:<model>` runs YOUR `codex` CLI (`codex exec --json`) on the ChatGPT login of its own
      # CODEX_HOME (the generated <runtimes>/codex/home: log in there once with
      # `CODEX_HOME=<dir> codex login`). Same terms as claude-code: your machine, your use.
      codex {
        command = "codex"
        command = ${?HISTMERSION_AGENTS_CODEX_COMMAND}
        home = ""                         # CODEX_HOME of the runs ("" = <runtimes dir>/codex/home)
        home = ${?HISTMERSION_AGENTS_CODEX_HOME}
        use-api-key = false               # false: OPENAI_API_KEY/CODEX_API_KEY are removed from its environment
        use-api-key = ${?HISTMERSION_AGENTS_CODEX_USE_API_KEY}
        timeout-seconds = 1800
        timeout-seconds = ${?HISTMERSION_AGENTS_CODEX_TIMEOUT}
        app-server = true                 # read the plan's windows with `codex app-server` (account/rateLimits/read; spends nothing)
        app-server = ${?HISTMERSION_AGENTS_CODEX_APP_SERVER}
        tool-output-tokens = 6000         # `tool_output_token_limit` of the generated home: what one tool output (a code-mode
                                          # `exec` batch of calls) may put in the context; 0 = the model's own (10000 tokens)
        tool-output-tokens = ${?HISTMERSION_AGENTS_CODEX_TOOL_OUTPUT_TOKENS}
        base-instructions = "lean"        # lean: the generated home's model_instructions_file (agents/_shared/codex-base-instructions.md,
                                          # ~1k chars) replaces Codex's built-in ~21k-char base prompt on every request; builtin: Codex's own
        base-instructions = ${?HISTMERSION_AGENTS_CODEX_BASE_INSTRUCTIONS}
      }
      # `opencode:<provider>/<model>` runs `opencode run --agent <role> --format json` on the generated config.
      opencode {
        command = "opencode"
        command = ${?HISTMERSION_AGENTS_OPENCODE_COMMAND}
        timeout-seconds = 1800
        timeout-seconds = ${?HISTMERSION_AGENTS_OPENCODE_TIMEOUT}
        chatgpt-login = false             # its openai/* models are signed in with a ChatGPT plan (they then draw on that pool)
        chatgpt-login = ${?HISTMERSION_AGENTS_OPENCODE_CHATGPT_LOGIN}
      }
    }
    roles {                               # step role -> a chain "provider:model > provider:model > …" ("" = not configured);
                                          # the first model with allowance left is used. `agent models set` overrides.
      probe = ""                          # `histmersion agent probe`: one tool call, one typed answer
      probe = ${?HISTMERSION_AGENTS_ROLE_PROBE}
      extractor = ""                      # enrich-source: metadata, classification, findings, notes
      extractor = ${?HISTMERSION_AGENTS_ROLE_EXTRACTOR}
      reviewer = ""
      reviewer = ${?HISTMERSION_AGENTS_ROLE_REVIEWER}
      cold-reader = ""
      cold-reader = ${?HISTMERSION_AGENTS_ROLE_COLD_READER}
      skeptic = ""
      skeptic = ${?HISTMERSION_AGENTS_ROLE_SKEPTIC}
      fixer = ""
      fixer = ${?HISTMERSION_AGENTS_ROLE_FIXER}
      planner = ""                        # plan-goal (sub-goals, queries, works) and acquisition-sweep (ranking)
      planner = ${?HISTMERSION_AGENTS_ROLE_PLANNER}
      writer = ""                         # compile-article: drafts the article or the section to append
      writer = ${?HISTMERSION_AGENTS_ROLE_WRITER}
    }
    # USD per million tokens, keyed by the model id the PROVIDER reports:
    #   "<model>=<input>/<output>[/<cache-read>/<cache-write>]; <model>=…"
    # e.g. "qwen2.5-coder:32b=0/0" for a free local model. An unpriced model is refused.
    prices = ""
    prices = ${?HISTMERSION_AGENTS_PRICES}
    # Rolling-window caps per model or per provider ("<provider>:*"), each with a reserve: a model is used
    # only while every limit covering it has more than its reserve left, else the chain's next one is.
    #   "<target> = <amount> tokens|usd/<window>, …, reserve <n>%; <target> = …"   window: 5h, 7d, day, week, month
    # e.g. "claude-code:* = 2M tokens/5h, 20M tokens/7d, reserve 20%; anthropic:claude-sonnet-4-5 = 5 usd/day"
    # An allowance saved with `histmersion agent allowance` (or the web UI) for the same target wins.
    allowances = ""
    allowances = ${?HISTMERSION_AGENTS_ALLOWANCES}
    # The per-runtime agent definitions, generated from the bundled agents/*.md and skills/* (and
    # agents.prompts-dir) — docs/research-agent-runtimes.md §2.2. `histmersion agent generate` rewrites them.
    runtimes {
      dir = ""                            # "" = <data dir>/agents (macOS ~/Library/Application Support/Histmersion/agents)
      dir = ${?HISTMERSION_AGENTS_RUNTIMES_DIR}
      generate = true                     # write them when the server starts (only while agents.enabled)
      generate = ${?HISTMERSION_AGENTS_GENERATE}
      claude-mod = true                   # the quota-guard mod in the headless Claude Code plugin
      claude-mod = ${?HISTMERSION_AGENTS_CLAUDE_MOD}
      interactive-mod = false             # a reporting mod in the interactive plugin (your sessions report the plan's use)
      interactive-mod = ${?HISTMERSION_AGENTS_INTERACTIVE_MOD}
    }
    # Subscription pools (docs/research-plan-quotas.md §5): a run uses a plan only while every known
    # window has MORE than its floor LEFT (%), and pauses until the reset otherwise. `agent quota` shows them.
    quota {
      stale-minutes = 10                  # a reading older than this is unknown
      default-floor = 10                  # the floor of a window with none of its own
      margin = 10                         # a stale reading lets a run go on only with this many points to spare
      poll-seconds = 60                   # at most one codex app-server read per this many seconds
      claude-plan {                       # claude-code:* (windows five_hour, seven_day)
        floors = "five_hour=25, seven_day=25"
        floors = ${?HISTMERSION_AGENTS_CLAUDE_PLAN_FLOORS}
        max-calls-in-flight = 1
        max-calls-in-flight = ${?HISTMERSION_AGENTS_CLAUDE_PLAN_CALLS}
        # A run that wants the pool while its reading is stale (or missing) takes a fresh one first, at
        # most once per stale-minutes: auto | probe | off. Claude Code has no non-generating read, so
        # auto = probe: one `claude -p` turn on probe-model ("quota", no tools, a few output tokens);
        # off = wait for a run's own reading (a pool paused on a stale reading then waits for the reset).
        refresh = auto
        refresh = ${?HISTMERSION_AGENTS_CLAUDE_PLAN_REFRESH}
        probe-model = "haiku"
        probe-model = ${?HISTMERSION_AGENTS_CLAUDE_PLAN_PROBE_MODEL}
        probe-max-tokens = 16             # CLAUDE_CODE_MAX_OUTPUT_TOKENS of the probe
        probe-timeout-seconds = 120
      }
      chatgpt-plan {                      # codex:* (and opencode:openai/* with chatgpt-login); windows by length
        floors = "300m=25, 10080m=20"
        floors = ${?HISTMERSION_AGENTS_CHATGPT_PLAN_FLOORS}
        max-calls-in-flight = 1
        max-calls-in-flight = ${?HISTMERSION_AGENTS_CHATGPT_PLAN_CALLS}
      }
      fallthrough = ""                    # roles whose chain may fall from a plan below its floor to a PAID key (others pause)
      fallthrough = ${?HISTMERSION_AGENTS_FALLTHROUGH}
    }
    allowance-check-seconds = 60          # how often a run paused for an allowance is checked and resumed
    doctor-timeout-seconds = 10           # `agent doctor`: per request (model listing, claude --version)
    budgets {                             # placeholders, not advice
      run-usd = 2.0                       # per run, unless the run asks for another
      run-usd = ${?HISTMERSION_AGENTS_RUN_USD}
      run-tokens = 400000                 # per run, budget tokens (below), unless the run asks for another
      run-tokens = ${?HISTMERSION_AGENTS_RUN_TOKENS}
      # A pipeline's own run-tokens default, "pipeline=tokens, …" (a run's --budget-tokens still wins).
      # review-article: done runs 2026-10-01..10 used 521k budget tokens at the median, 705k at p90,
      # 1.06M at most (fix, 3 rounds) — 1.2M lets every one of them finish.
      pipeline-run-tokens = "review-article=1200000"
      pipeline-run-tokens = ${?HISTMERSION_AGENTS_PIPELINE_RUN_TOKENS}
      # How much a cached input token counts toward run-tokens: a cache read re-sends the prompt prefix
      # every turn at about a tenth of the price (Anthropic 0.1x; OpenAI 0.1-0.5x), so counted in full it
      # made a tool-heavy reviewer look 4x its cost. Uncached input, cache writes and output count 1.
      cache-read-weight = 0.1
      cache-read-weight = ${?HISTMERSION_AGENTS_CACHE_READ_WEIGHT}
      daily-usd = 10.0                    # all runs, per UTC day
      daily-usd = ${?HISTMERSION_AGENTS_DAILY_USD}
      monthly-usd = 150.0                 # all runs, per UTC month
      monthly-usd = ${?HISTMERSION_AGENTS_MONTHLY_USD}
    }
    max-concurrent-runs = 4               # agent runs executing at once
    max-concurrent-runs = ${?HISTMERSION_AGENTS_MAX_CONCURRENT_RUNS}
    max-llm-calls-in-flight = 4           # LLM requests at once across every run (parallel steps count)
    max-llm-calls-in-flight = ${?HISTMERSION_AGENTS_MAX_LLM_CALLS}
    step {
      max-iterations = 6                  # tool-loop iterations of a probe (at most 3); a run's step uses its agent's max-turns
      max-tokens = 4096                   # output tokens per LLM call
      max-tokens = ${?HISTMERSION_AGENTS_MAX_TOKENS}
      max-retries = 2                     # re-asks after a typed answer fails code validation
    }
    verify {
      quote-min-ratio = 0.9               # OCR-tolerant quote match: share of the quote found verbatim (normalised)
      max-abs-year = 3000000              # |signed year| a proposed period may carry (the Oldowan is ~2.6 Ma)
    }
    tools {                               # what one tool call of an agent step returns — every runtime (the run token's
                                          # /mcp/agent and the API tool loop); every turn re-sends every earlier result
      result-max-chars = 8000             # a longer result is cut at a line, with a trailer saying how to read on
      result-max-chars = ${?HISTMERSION_AGENTS_TOOL_RESULT_MAX_CHARS}
      body-chars = 4000                   # get_source section=body without `chars` reads this much (never more than result-max-chars)
      body-chars = ${?HISTMERSION_AGENTS_TOOL_BODY_CHARS}
      query-max-rows = 50                 # rows of a `query` result an agent sees (agents.query.max-rows still bounds the query)
      query-max-rows = ${?HISTMERSION_AGENTS_TOOL_QUERY_MAX_ROWS}
    }
    trace {
      max-tool-result-chars = 4000        # a tool result is truncated to this before it is stored
      keep-messages-days = 30             # traced messages older than this are deleted (0 = keep all)
      keep-messages-days = ${?HISTMERSION_AGENTS_KEEP_MESSAGES_DAYS}
      prune-every-minutes = 60            # how often the pruning runs (at pool start, then after runs)
    }
    enrich {
      window-chars = 12000                # one findings window of the body
      max-windows = 4                     # windows sent per run (by heading where there is a TOC)
      head-chars = 6000                   # body excerpt the metadata/classify steps see
      upstream = true                     # OpenAlex/Crossref metadata check, refs and assess (network)
      upstream = ${?HISTMERSION_AGENTS_ENRICH_UPSTREAM}
      # The findings step's guards (#1424): each problem sends the answer back while attempts remain
      # (agents.step.max-retries); on the last attempt the answer is kept and the problem is a warning.
      guards {
        # Share (0..1) of the findings that NAME a place whose place must resolve in the gazetteer;
        # below it the answer is asked again with the unresolved names listed. A finding with no
        # place (a non-spatial claim) does not count. 0 = off.
        min-placed-share = 0.5
        min-placed-share = ${?HISTMERSION_AGENTS_ENRICH_MIN_PLACED_SHARE}
        # A year below 100 is taken for a century stored as a year ("11th century" -> 11) when the
        # finding mentions a century, or when the source's own period starts at least this many years
        # after it. A year the claim, quote or period name states with its era ("79 CE", "AD 79") is valid.
        century-gap-years = 500
        century-gap-years = ${?HISTMERSION_AGENTS_ENRICH_CENTURY_GAP_YEARS}
        # A claim containing one of these (comma-separated, whole words, any case) only makes sense next
        # to the table it came from: it is sent back to name the date or event instead.
        pointer-phrases = "this date, around this date, the next column, the previous column, the table above, the table below, as listed"
        pointer-phrases = ${?HISTMERSION_AGENTS_ENRICH_POINTER_PHRASES}
      }
    }
    review {
      max-rounds = 3                      # review-article passes (a full panel, then a verification pass per fix) unless a run asks for fewer
      max-rounds = ${?HISTMERSION_AGENTS_REVIEW_ROUNDS}
      rounds-cap = 5                      # the most rounds a run may ask for
      article-chars = 60000               # article body sent to the panel (longer is cut, flagged, never revised)
      fixer-max-tokens = 16000            # output tokens per fixer call (its answer is a list of edits)
      fixer-turns-per-finding = 1         # the fixer's turns: its max-turns + this per major or factual minor finding…
      fixer-turns-cap = 40                # …at most this many
      recheck-turns = 6                   # a verification pass's re-check: this + 1 per finding, at most the agent's max-turns
      spot-checks = 3                     # a full pass's rules reviewer: cited claims it must check by a get_source/passages call (fewer when fewer sources are cited; 0 = not enforced)
      spot-checks = ${?HISTMERSION_AGENTS_REVIEW_SPOT_CHECKS}
      ledger-closed-lines = 60            # closed findings of the review ledger a prompt shows, one line each (the newest)
      final-panel = clear                 # a full panel after fixing: clear (only when no MAJOR is open) | always | never
      final-panel = ${?HISTMERSION_AGENTS_REVIEW_FINAL_PANEL}
    }
    approvals {                           # manual = a person decides (UI, `histmersion agent approve`); auto = applied at once
      status-change = manual              # any agent-proposed status beyond unassessed -> current/foundational
      status-change = ${?HISTMERSION_AGENTS_APPROVE_STATUS}
      edges = manual                      # agent-proposed challenges/refutes/updates/superseded_by edges
      edges = ${?HISTMERSION_AGENTS_APPROVE_EDGES}
      article-publish = manual            # compile-article: the run waits for a person before writing the article
      article-publish = ${?HISTMERSION_AGENTS_APPROVE_PUBLISH}
    }
    plan {                                # plan-goal (a plan is ALWAYS approved by a person before anything is created)
      max-sub-goals = 8
      max-queries = 8
      max-works = 15
      query-chars = 200
    }
    compile {                             # compile-article
      max-sources = 20                    # sources of the filter read (one extraction call each)
      max-sources = ${?HISTMERSION_AGENTS_COMPILE_MAX_SOURCES}
      record-chars = 12000                # of each source's record an extraction sees
      max-claims = 12                     # claims kept per source
      draft-max-tokens = 16000            # output tokens of the writer's call (a whole article)
      review = true                       # chain a review-article run with fix after writing
      review = ${?HISTMERSION_AGENTS_COMPILE_REVIEW}
    }
    scheduler {                           # per-goal schedules (only while agents are enabled)
      enabled = true
      enabled = ${?HISTMERSION_AGENTS_SCHEDULER}
      tick-seconds = 60                   # how often due schedules are looked for
      min-interval-minutes = 60           # a schedule may not fire more often than this
      currency-sources = 30               # a goal's sources a currency check looks at
      followups-per-source = 20           # citing papers asked for per source
      discover-per-query = 15             # works an acquisition sweep asks per query
      sweep-candidates = 30               # candidates the ranking model sees per sweep
    }
    # The stall watchdog (docs/research-process-managers.md §3.3): a RUNNING run that gives no sign of
    # life — a step starting or ending, a model call, a line from its CLI — for stall-minutes has its
    # processes killed and is paused `stalled`, resuming by itself after resume-minutes; the
    # max-stalls-th stall on the same step fails it.
    watchdog {
      stall-minutes = 0                   # 0 = the longest provider timeout + 5 minutes
      stall-minutes = ${?HISTMERSION_AGENTS_STALL_MINUTES}
      resume-minutes = 10                 # a stalled run is re-queued this long after the stall
      max-stalls = 3                      # the stall on one step that fails the run
      heartbeat-seconds = 30              # how often the last sign of life is written to jobs.heartbeat_at
      interrupted-resume-minutes = 1      # a run nobody watches (schedule, ingest, manager) that a restart interrupted goes on after this
    }
    # Persistent process managers (docs/research-process-managers.md): each drives its work items to an
    # end, one run at a time per item, within the limits below and agents.max-concurrent-runs.
    managers {
      enabled = true                      # the supervisor (only while agents are enabled; a manager is also paused by itself)
      enabled = ${?HISTMERSION_AGENTS_MANAGERS}
      tick-seconds = 30                   # how often the managers look at their items (and when a run settles)
      tick-seconds = ${?HISTMERSION_AGENTS_MANAGERS_TICK}
      keep-events-days = 90               # manager events older than this are deleted (0 = keep all)
      backoff-minutes = 15                # a failed run's item waits this × 2^failures (at most max-backoff-minutes)
      max-backoff-minutes = 360
      max-failures = 3                    # failed runs of one item before it is stopped (with a task)
      # The review manager ('review', library-wide). Created PAUSED: nothing is spent until a person
      # resumes it (web UI Managers window, `histmersion agent manager review resume`). These are the
      # defaults of its config; a value saved on the manager wins.
      review {
        max-runs = 2                      # its runs at once: queued, running, waiting, or paused to resume by itself
        rounds = 3                        # review-article rounds of each run (fix on)
        max-runs-per-article = 3          # runs of one article before it is stopped with a task
        no-progress-runs = 2              # stop when the open MAJORs have not gone down over this many runs
        reopen-limit = 2                  # stop when a finding was reopened this often (or escalated)
        cooldown-minutes = 30             # between two runs of one article
        low-water = 2                     # refill the pending items when fewer than this remain
        refill-batch = 10                 # items a refill adds at most
        stale-after-days = 90             # (phase 2) an article reviewed longer ago than this is due again
      }
    }
  }
  runtime {                               # the native bundle: supervise bundled Postgres + converter
    enabled = false
    enabled = ${?HISTMERSION_RUNTIME}
    home = ""                             # bundle root (pg/, converter/); "" = the dir above bin/
    home = ${?HISTMERSION_HOME}
    data-dir = ""                         # cluster, logs, backups; "" = ~/Library/Application Support/Histmersion
    data-dir = ${?HISTMERSION_DATA_DIR}        #   (macOS) or $XDG_DATA_HOME/histmersion (Linux)
    pg-port = 5433                        # loopback only; not 5432, so a system Postgres can coexist
    pg-port = ${?HISTMERSION_PG_PORT}
    converter-port = 8100
    converter-port = ${?HISTMERSION_CONVERTER_PORT}
    postgres {                            # the bundled cluster's memory, applied at each start ("" = Postgres' default)
      shared-buffers = "auto"             # "auto" = RAM/16, 128MB…2GB: the gazetteer's hot pages stay in Postgres
      shared-buffers = ${?HISTMERSION_PG_SHARED_BUFFERS}
      effective-cache-size = "auto"       # "auto" = RAM/2 (a planner estimate, allocates nothing)
      effective-cache-size = ${?HISTMERSION_PG_EFFECTIVE_CACHE_SIZE}
      work-mem = "16MB"                   # per sort/hash, per query node
      work-mem = ${?HISTMERSION_PG_WORK_MEM}
    }
  }
}
