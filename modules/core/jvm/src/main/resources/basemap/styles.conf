# The terrain map's built-in styles (docs/user-guide/how-to/terrain-styles.md).
#
# This is the file a person copies to start their own: `histmersion basemap styles --example` prints it.
# Put yours at ~/.config/histmersion/basemap-style.conf (beside histmersion.conf; `basemap.style` names
# another path) — HOCON or JSON. Its `styles` are merged over these by `id`: the same id replaces a
# built-in style, `extends = "<id>"` starts from one and changes only the keys given, a new id adds an
# entry to the base-map menu, `hidden = true` takes one out. The server reads the file again when it
# changes; a file with an error is refused whole (the built-in styles stay, the error is in
# `histmersion basemap styles` and `histmersion about`).
#
# Colours: #rgb, #rrggbb, #rrggbbaa, rgb(…), rgba(…), hsl(…), a CSS colour name, or var(--token) — a
# token of the web UI's stylesheet, so a theme still applies.
# Zoom-dependent numbers: a number, or [[zoom, value], …] — linear between the stops, constant beyond.
# Fonts: any CSS font family; the map serves Noto Serif (Latin, Greek, Cyrillic) and Noto Serif Armenian,
# Georgian, Hebrew and Noto Naskh Arabic itself, so names in those scripts work offline. `fonts` holds
# values the styles below refer to as ${fonts.serif} (HOCON substitutions; a file of your own can have one).
fonts {
  serif = "'Noto Serif', 'Noto Serif Armenian', 'Noto Serif Georgian', 'Noto Serif Hebrew', 'Noto Naskh Arabic', serif"
}

version = 1
default = "natural"
# language = "en"            # the names shown: en, local (each in its own language), de, fr, el, tr, …
                             # (default basemap.labels.language)

styles = [
  # ── Natural (the default): a light map that shows the land as it lies ───────────────────────────
  # The ground is coloured by its elevation (lowland green → upland tan → mountain grey-brown → snow),
  # the land cover lies over it in translucent colours (forest dark green, grass light green, scrub olive,
  # farmland pale, rock grey, sand ochre, ice white), the relief is shaded from several directions over
  # both, the sea is a soft blue lighter along the shore, and from zoom 11 contour lines show the shape
  # of every hill. Names in Noto Serif: italic for water, letter-spaced capitals for ranges and regions.
  {
    id = "natural"
    name = "Natural"
    description = "A light, natural map: elevation colours, vegetation, ice and deserts, shaded relief, soft water, contours from zoom 11"
    tone = "light"
    background = "#a9cfe4"
    relief {
      shadow = "#3b3326"
      shadow-opacity = 0.62
      highlight = "#fffdf4"
      highlight-opacity = 0.42
      azimuth = 315
      altitude = 40
      multidirectional = 0.55               # 0–1: light from three more directions, so every slope reads
      exaggeration = [[0, 9], [6, 4.5], [10, 1.7], [13, 1.25]]
      # the ground's colour by its elevation, under the land cover: [[metres, colour], …]
      tint = [[-50, "#cfe2bd"], [0, "#cfe2b4"], [150, "#dde8b7"], [400, "#ebe8bf"], [800, "#ecdcb0"],
        [1300, "#dfc79e"], [1900, "#cdb596"], [2600, "#c0b1a3"], [3300, "#d9d5d0"], [4000, "#f4f4f2"], [5000, "#ffffff"]]
      tint-opacity = 1
      heights = true                        # shown (a viewer can switch them off in the map's options)
      # the sea by its depth (the sea-floor layer: `histmersion basemap fetch --layer bathymetry`); the shelf
      # light, a step at its edge (about 200 m), the deep basins darker
      sea-tint = [[-6000, "#3f75a6"], [-4000, "#4d82b2"], [-3000, "#5b92c0"], [-2000, "#6c9fc9"], [-1000, "#80b0d4"],
        [-400, "#93bedd"], [-210, "#a0c8e3"], [-190, "#b4d6eb"], [-50, "#c3def0"], [-1, "#cfe6f3"]]
      sea-shading = 0.5                     # the sea floor's shading against the land's
      sea-floor = true
      contours {
        enabled = true
        min-zoom = 11
        interval = [[11, 100], [12, 50], [14, 20], [16, 10]]   # metres, from each zoom on
        index-every = 5                     # every fifth line thicker, its elevation written along it
        color = "rgba(128, 92, 52, .38)"
        index-color = "rgba(116, 80, 42, .72)"
        width = 0.6
        index-width = 1.2
        labels = true
        label-color = "#6b4a2a"
        halo = "rgba(250, 248, 238, .9)"
        font { family = ${fonts.serif}, size = 10 }
      }
    }
    layers = [
      # the land when the colours by height are off (with them on it is not drawn: they are the land)
      { id = "land", type = "fill", layer = "earth", geometry = "polygon", fill = "#e9e9d2" }
      # land cover, satellite-derived (to zoom 8) …
      { id = "lc-forest", type = "fill", layer = "landcover", geometry = "polygon", kinds = ["forest"], max-zoom = 9,
        fill = "rgba(70, 122, 66, .42)" }
      { id = "lc-grass", type = "fill", layer = "landcover", geometry = "polygon", kinds = ["grassland"], max-zoom = 9,
        fill = "rgba(150, 192, 104, .22)" }
      { id = "lc-scrub", type = "fill", layer = "landcover", geometry = "polygon", kinds = ["scrub"], max-zoom = 9,
        fill = "rgba(128, 136, 74, .30)" }
      { id = "lc-barren", type = "fill", layer = "landcover", geometry = "polygon", kinds = ["barren"], max-zoom = 9,
        fill = "rgba(196, 186, 168, .38)" }
      { id = "lc-ice", type = "fill", layer = "landcover", geometry = "polygon", kinds = ["glacier"],
        fill = "rgba(252, 253, 255, .9)" }
      # … then OpenStreetMap's own, far more detailed, from zoom 9 (not even read before: the page asks for it from then on)
      { id = "farmland", type = "fill", layer = "landuse", geometry = "polygon", min-zoom = 9,
        kinds = ["farmland", "orchard", "vineyard", "allotments"], fill = "rgba(246, 238, 206, .34)" }
      { id = "grass", type = "fill", layer = "landuse", geometry = "polygon", min-zoom = 9,
        kinds = ["grassland", "meadow", "grass"], fill = "rgba(150, 192, 104, .26)" }
      { id = "scrub", type = "fill", layer = "landuse", geometry = "polygon", min-zoom = 9,
        kinds = ["scrub", "heath"], fill = "rgba(128, 136, 74, .32)" }
      { id = "forest", type = "fill", layer = "landuse", geometry = "polygon", min-zoom = 9,
        kinds = ["forest", "wood"], fill = "rgba(70, 122, 66, .45)" }
      { id = "rock", type = "fill", layer = "landuse", geometry = "polygon", min-zoom = 9,
        kinds = ["bare_rock", "scree", "barren"], fill = "rgba(176, 170, 160, .45)" }
      { id = "sand", type = "fill", layer = "landuse", geometry = "polygon", min-zoom = 9,
        kinds = ["sand", "beach", "desert", "dune"], fill = "rgba(232, 206, 146, .62)" }
      { id = "wetland", type = "fill", layer = "landuse", geometry = "polygon", min-zoom = 9,
        kinds = ["wetland", "marsh", "swamp", "bog"], fill = "rgba(112, 166, 158, .36)" }
      { id = "ice", type = "fill", layer = "landuse", geometry = "polygon", min-zoom = 9, kinds = ["glacier"],
        fill = "rgba(252, 253, 255, .9)" }

      # water: a soft blue, lighter along every shore (a glow inside the outline)
      { id = "water", type = "fill", layer = "water", geometry = "polygon", fill = "#a9cfe4",
        not-kinds = ["swimming_pool", "fountain", "basin", "dock"],
        glow { color = "#d9eef8", width = [[3, 3], [8, 7], [13, 12]] } }
      # rivers by size: Natural Earth's major rivers wide at a continent's scale, OSM's rivers, then streams
      { id = "rivers-major-line", type = "line", source = "labels", layer = "rivers", max-zoom = 9,
        color = "#76aed2", width = [[3, 0.7], [6, 1.3], [9, 2]] }
      { id = "rivers", type = "line", layer = "water", geometry = "line", kinds = ["river"],
        color = "#76aed2", width = [[6, 0.5], [9, 1.1], [12, 2], [15, 4.5]] }
      { id = "streams", type = "line", layer = "water", geometry = "line", kinds = ["stream"], min-zoom = 11,
        color = "#8bbcdb", width = [[11, 0.5], [15, 1.8]] }

      # names, in the order they are placed (an earlier one wins where two would meet)
      { id = "oceans", type = "label", layer = "water", geometry = "point", kinds = ["ocean", "sea"],
        color = "#2f6188", halo = "rgba(214, 236, 247, .85)", halo-width = 1.5, letter-spacing = 1.5, max-line-chars = 12,
        font { family = ${fonts.serif}, style = "italic", size = [[3, 12], [8, 16]] } }
      { id = "ranges", type = "label", source = "labels", layer = "physical",
        kinds = ["range", "desert", "plateau", "region", "peninsula", "plain", "basin", "delta", "valley", "isthmus",
          "coast", "wetland", "foothills", "continent"],
        color = "#5d4a36", halo = "rgba(250, 247, 236, .85)", halo-width = 1.5, transform = "uppercase",
        letter-spacing = 2.5, max-line-chars = 14, font { family = ${fonts.serif}, size = [[3, 10], [9, 12]], weight = "600" } }
      { id = "gulfs", type = "label", layer = "water", geometry = "point", kinds = ["bay", "strait", "gulf", "sound", "channel"],
        min-zoom = 6, color = "#2f6188", halo = "rgba(214, 236, 247, .85)", halo-width = 1.5, max-line-chars = 14,
        font { family = ${fonts.serif}, style = "italic", size = 12 } }
      { id = "lakes", type = "label", source = "labels", layer = "physical", kinds = ["lake"],
        color = "#2f6188", halo = "rgba(214, 236, 247, .85)", halo-width = 1.5,
        font { family = ${fonts.serif}, style = "italic", size = 11 } }
      { id = "lakes-detail", type = "label", layer = "water", geometry = "point", details = ["lake"], min-zoom = 9,
        color = "#2f6188", halo = "rgba(214, 236, 247, .85)", halo-width = 1.5,
        font { family = ${fonts.serif}, style = "italic", size = 11 } }
      { id = "rivers-major", type = "label", source = "labels", layer = "rivers", placement = "line",
        color = "#2f6188", halo = "rgba(244, 248, 240, .85)", halo-width = 1.5,
        font { family = ${fonts.serif}, style = "italic", size = 11 } }
      { id = "rivers-detail", type = "label", layer = "water", geometry = "line", kinds = ["river"], placement = "line",
        min-zoom = 10, color = "#2f6188", halo = "rgba(244, 248, 240, .85)", halo-width = 1.5,
        font { family = ${fonts.serif}, style = "italic", size = 10 } }
      { id = "island-groups", type = "label", source = "labels", layer = "physical", kinds = ["island_group", "island"],
        max-zoom = 8, color = "#3f3a30", halo = "rgba(250, 247, 236, .85)", halo-width = 1.5, letter-spacing = 0.5,
        font { family = ${fonts.serif}, size = 11 } }
      { id = "islands", type = "label", layer = "earth", geometry = "point", kinds = ["island"], min-zoom = 8.01,
        color = "#3f3a30", halo = "rgba(250, 247, 236, .85)", halo-width = 1.5, font { family = ${fonts.serif}, size = 11 } }
      { id = "peaks", type = "label", source = "labels", layer = "physical", kinds = ["peak", "pass", "depression"],
        min-zoom = 7, color = "#4d3d2c", halo = "rgba(250, 247, 236, .85)", halo-width = 1.5,
        font { family = ${fonts.serif}, size = 10 } }
      { id = "peaks-detail", type = "label", layer = "pois", geometry = "point", kinds = ["peak", "volcano"], min-zoom = 10,
        color = "#4d3d2c", halo = "rgba(250, 247, 236, .85)", halo-width = 1.5, font { family = ${fonts.serif}, size = 10 } }
      { id = "capes", type = "label", source = "labels", layer = "physical", kinds = ["cape", "waterfall"],
        min-zoom = 8, color = "#4d3d2c", halo = "rgba(250, 247, 236, .85)", halo-width = 1.5,
        font { family = ${fonts.serif}, size = 10 } }
    ]
  }

  # ── Contour map: a topographic look — the contours first, the shading and colours faint ────────
  {
    id = "contour"
    extends = "natural"
    name = "Contour map"
    description = "A topographic look: contour lines from zoom 9 (200 → 10 m), pale colours, faint shading"
    relief {
      shadow-opacity = 0.32
      highlight-opacity = 0.2
      tint-opacity = 0.55
      contours {
        depth-interval = [[9, 500], [11, 200], [13, 100]]   # isobaths under the sea, metres
        depth-color = "rgba(46, 96, 146, .5)"
        min-zoom = 9
        interval = [[9, 200], [11, 100], [12, 50], [13, 20], [15, 10]]
        color = "rgba(150, 96, 40, .6)"
        index-color = "rgba(130, 76, 26, .95)"
        width = 0.75
        index-width = 1.6
      }
    }
    layers = [
      { id = "lc-forest", fill = "rgba(70, 122, 66, .22)" }
      { id = "forest",    fill = "rgba(70, 122, 66, .24)" }
      { id = "lc-scrub",  fill = "rgba(128, 136, 74, .14)" }
      { id = "scrub",     fill = "rgba(128, 136, 74, .16)" }
      { id = "farmland",  fill = "rgba(246, 238, 206, .2)" }
    ]
  }

  {
    id = "terrain"
    name = "Terrain"
    description = "Today's terrain, dark and muted so the dots, names and boundaries stay on top"
    tone = "dark"                          # dark or light: the map's own names follow it
    background = "var(--terrain-water)"    # the sea, and where there is no tile
    labels = true                          # draw the label layers below (the physical names)

    relief {                               # shaded from the elevation tiles, over the fills
      enabled = true
      shadow = "var(--terrain-shadow)"     # slopes facing away from the light
      shadow-opacity = 0.72                # 0–1, on the steepest slope
      highlight = "var(--terrain-highlight)"
      highlight-opacity = 0.2
      azimuth = 315                        # where the light comes from, degrees clockwise from north
      altitude = 45                        # how high it stands, degrees
      exaggeration = [[0, 7.6], [11, 1]]   # slopes steepened: relief is invisible at a continent's scale without it
      # colours by height and by depth, carried switched off: a viewer can switch them on in the map's options
      tint = [[0, "#2f3a33"], [300, "#3b3f36"], [800, "#4a4538"], [1500, "#5a5246"], [2500, "#6d675f"], [3500, "#8a8783"],
        [4500, "#b5b5b5"]]
      heights = false
      sea-tint = [[-5000, "#070d16"], [-2000, "#0b1522"], [-1000, "#0f1b2b"], [-210, "#132235"], [-190, "#182b40"], [-1, "#1d3349"]]
      sea-floor = false
    }

    # Bottom to top. Each layer: an id, a type (fill, line or label), the source (vector: coast, water,
    # land cover; labels: the physical names), the data layer (one or a list), and which of its
    # features — geometry (point, line, polygon), kinds (the feature's `kind`), not-kinds, details
    # (its `kind_detail`), min-zoom / max-zoom (the map's zoom).
    layers = [
      { id = "land", type = "fill", layer = "earth", geometry = "polygon", fill = "var(--terrain-land)" }

      # land cover: `landcover` — satellite-derived, the same everywhere. The extract also keeps OSM's
      # `landuse` (far more detailed, but mapped unevenly from country to country, and modern uses too:
      # farmland, towns, quarries); "Terrain + vegetation" draws its woods, scrub and wetlands.
      { id = "forest", type = "fill", layer = "landcover", geometry = "polygon",
        kinds = ["forest", "wood"], fill = "var(--terrain-forest)" }
      { id = "scrub", type = "fill", layer = "landcover", geometry = "polygon",
        kinds = ["scrub", "heath", "grassland", "meadow"], fill = "var(--terrain-scrub)" }
      { id = "wetland", type = "fill", layer = "landcover", geometry = "polygon",
        kinds = ["wetland", "marsh", "swamp", "bog"], fill = "var(--terrain-wetland)" }
      { id = "barren", type = "fill", layer = "landcover", geometry = "polygon",
        kinds = ["barren", "bare_rock", "scree", "desert"], fill = "var(--terrain-barren)" }
      { id = "sand", type = "fill", layer = "landcover", geometry = "polygon",
        kinds = ["sand", "beach"], fill = "var(--terrain-sand)" }
      { id = "ice", type = "fill", layer = "landcover", geometry = "polygon",
        kinds = ["glacier"], fill = "var(--terrain-ice)" }

      # the extract keeps every water feature; the modern ones are not drawn (canals and ditches are
      # lines this style never selects)
      { id = "water", type = "fill", layer = "water", geometry = "polygon", fill = "var(--terrain-water)",
        not-kinds = ["swimming_pool", "fountain", "basin", "dock"] }
      { id = "rivers", type = "line", layer = "water", geometry = "line", kinds = ["river"],
        color = "var(--terrain-river)", width = [[6.3, 0.6], [15, 4.5]] }
      { id = "streams", type = "line", layer = "water", geometry = "line", kinds = ["stream"], min-zoom = 10,
        color = "var(--terrain-river)", width = [[10, 0.4], [15, 2.4]] }

      # Labels, placed in this order (an earlier one wins where two would overlap) and drawn under the
      # map's own markers. `own-min-zoom` (default true) also waits for the feature's own `min_zoom`.
      { id = "oceans", type = "label", layer = "water", geometry = "point", kinds = ["ocean", "sea"],
        color = "var(--terrain-label-water)", halo = "var(--terrain-label-halo)", halo-width = 2,
        font { family = "Georgia, serif", style = "italic", size = [[3, 11], [8, 15]] }, letter-spacing = 1 }
      { id = "ranges", type = "label", source = "labels", layer = "physical",
        kinds = ["range", "desert", "plateau", "region", "peninsula", "plain", "basin", "delta", "valley", "isthmus",
          "coast", "wetland", "foothills", "continent"],
        color = "var(--terrain-label)", halo = "var(--terrain-label-halo)", halo-width = 2, transform = "uppercase",
        letter-spacing = 2, max-line-chars = 14, font { size = [[3, 10], [9, 12]], weight = "600" } }
      { id = "gulfs", type = "label", layer = "water", geometry = "point", kinds = ["bay", "strait", "gulf", "sound", "channel"],
        min-zoom = 6, color = "var(--terrain-label-water)", halo = "var(--terrain-label-halo)", halo-width = 2,
        font { family = "Georgia, serif", style = "italic", size = 11 } }
      { id = "lakes", type = "label", source = "labels", layer = "physical", kinds = ["lake"],
        color = "var(--terrain-label-water)", halo = "var(--terrain-label-halo)", halo-width = 2,
        font { family = "Georgia, serif", style = "italic", size = 11 } }
      { id = "lakes-detail", type = "label", layer = "water", geometry = "point", details = ["lake"], min-zoom = 9,
        color = "var(--terrain-label-water)", halo = "var(--terrain-label-halo)", halo-width = 2,
        font { family = "Georgia, serif", style = "italic", size = 11 } }
      { id = "rivers-major", type = "label", source = "labels", layer = "rivers", placement = "line",
        color = "var(--terrain-label-water)", halo = "var(--terrain-label-halo)", halo-width = 2,
        font { family = "Georgia, serif", style = "italic", size = 11 } }
      { id = "rivers-detail", type = "label", layer = "water", geometry = "line", kinds = ["river"], placement = "line",
        min-zoom = 10, color = "var(--terrain-label-water)", halo = "var(--terrain-label-halo)", halo-width = 2,
        font { family = "Georgia, serif", style = "italic", size = 10 } }
      { id = "island-groups", type = "label", source = "labels", layer = "physical", kinds = ["island_group", "island"],
        max-zoom = 8, color = "var(--terrain-label)", halo = "var(--terrain-label-halo)", halo-width = 2, font { size = 11 } }
      { id = "islands", type = "label", layer = "earth", geometry = "point", kinds = ["island"], min-zoom = 8.01,
        color = "var(--terrain-label)", halo = "var(--terrain-label-halo)", halo-width = 2, font { size = 11 } }
      { id = "peaks", type = "label", source = "labels", layer = "physical", kinds = ["peak", "pass", "depression"],
        min-zoom = 7, color = "var(--terrain-label)", halo = "var(--terrain-label-halo)", halo-width = 2, font { size = 10 } }
      { id = "peaks-detail", type = "label", layer = "pois", geometry = "point", kinds = ["peak", "volcano"], min-zoom = 10,
        color = "var(--terrain-label)", halo = "var(--terrain-label-halo)", halo-width = 2, font { size = 10 } }
      { id = "capes", type = "label", source = "labels", layer = "physical", kinds = ["cape", "waterfall"],
        min-zoom = 8, color = "var(--terrain-label)", halo = "var(--terrain-label-halo)", halo-width = 2, font { size = 10 } }
    ]
  }

  {
    id = "terrain-vegetation"
    extends = "terrain"
    name = "Terrain + vegetation"
    description = "The land cover drawn strongly, with OpenStreetMap's woods, scrub and wetlands where they are mapped"
    layers = [
      { id = "forest",  fill = "rgba(78,128,74,.52)" }
      { id = "scrub",   fill = "rgba(132,138,84,.36)" }
      { id = "wetland", fill = "rgba(70,124,124,.45)" }
      { id = "osm-woods", type = "fill", layer = "landuse", geometry = "polygon", kinds = ["forest", "wood"],
        fill = "rgba(78,128,74,.3)", before = "water" }
      { id = "osm-scrub", type = "fill", layer = "landuse", geometry = "polygon", kinds = ["scrub", "heath", "grassland", "meadow"],
        fill = "rgba(132,138,84,.22)", before = "water" }
      { id = "osm-wetland", type = "fill", layer = "landuse", geometry = "polygon", kinds = ["wetland", "marsh", "swamp", "bog"],
        fill = "rgba(70,124,124,.3)", before = "water" }
      { id = "barren",  fill = "rgba(164,138,100,.34)" }
      { id = "sand",    fill = "rgba(190,164,110,.42)" }
      { id = "ice",     fill = "rgba(224,234,244,.55)" }
    ]
  }

  {
    id = "relief"
    extends = "terrain"
    name = "Relief only"
    description = "Land, water and the relief: no land cover, no names"
    labels = false
    relief { shadow-opacity = 0.85, highlight-opacity = 0.3, exaggeration = [[0, 9], [11, 1.4]] }
    layers = [
      { id = "forest", remove = true }, { id = "scrub", remove = true }, { id = "wetland", remove = true }
      { id = "barren", remove = true }, { id = "sand", remove = true }, { id = "ice", remove = true }
    ]
  }

  {
    id = "parchment"
    extends = "terrain"
    name = "Parchment"
    description = "A light, old-atlas look: pale land and sea, sepia relief, brown names"
    tone = "light"
    background = "#c6d3d0"
    relief { shadow = "#4a3620", shadow-opacity = 0.85, highlight = "#fffaf0", highlight-opacity = 0.4,
      tint = [[0, "#efe4c6"], [500, "#e6d5ad"], [1200, "#d8c193"], [2000, "#c9ae86"], [3000, "#d9d0c3"]],
      sea-tint = [[-4000, "#8fa5ac"], [-1000, "#a7b8ba"], [-210, "#b4c4c4"], [-190, "#bfccca"], [-1, "#c9d4d1"]] }
    layers = [
      { id = "land",    fill = "#efe4c6" }
      { id = "forest",  fill = "rgba(112,132,82,.26)" }
      { id = "scrub",   fill = "rgba(150,146,96,.18)" }
      { id = "wetland", fill = "rgba(96,130,124,.22)" }
      { id = "barren",  fill = "rgba(176,146,104,.16)" }
      { id = "sand",    fill = "rgba(206,178,120,.24)" }
      { id = "ice",     fill = "rgba(250,252,255,.6)" }
      { id = "water",   fill = "#c6d3d0" }
      { id = "rivers",  color = "#7f9aa6" }
      { id = "streams", color = "#93abb5" }
      { id = "oceans",        color = "#4d6b7d", halo = "rgba(240,233,212,.8)" }
