# The terrain map's built-in styles (docs/user-guide/how-to/terrain-styles.md).
#
# This is the file a person copies to start their own: `histmersion basemap styles --example` prints it.
# Put yours at ~/.config/histmersion/basemap-style.conf (beside histmersion.conf; `basemap.style` names
# another path) — HOCON or JSON. Its `styles` are merged over these by `id`: the same id replaces a
# built-in style, `extends = "<id>"` starts from one and changes only the keys given, a new id adds an
# entry to the base-map menu, `hidden = true` takes one out. The server reads the file again when it
# changes; a file with an error is refused whole (the built-in styles stay, the error is in
# `histmersion basemap styles` and `histmersion about`).
#
# Colours: #rgb, #rrggbb, #rrggbbaa, rgb(…), rgba(…), hsl(…), a CSS colour name, or var(--token) — a
# token of the web UI's stylesheet, so a theme still applies.
# Zoom-dependent numbers: a number, or [[zoom, value], …] — linear between the stops, constant beyond.

version = 1
default = "standard"         # the local map a page shows first when it has only the local maps (ui.base-map-source)
# language = "en"            # the names shown: en, local (each in its own language), de, fr, el, tr, …
                             # (default basemap.labels.language)

styles = [
  # ── today's map: roads, towns, borders (`modern = true`) ─────────────────────────────────────────
  # They draw the layers `basemap.vector.drop` leaves out by default — roads, places, boundaries — so
  # they need the whole vector layer once: `histmersion basemap fetch --layer vector --keep-all`. Until
  # then the menu marks them and they are drawn with what is there. There are no settlement dots: the
  # dots on the map are your corpus's.
  {
    id = "standard"
    name = "Standard"
    description = "Today's map: land use, water, roads by class, borders and place names"
    modern = true
    tone = "light"
    background = "#a8cbdc"                 # the sea
    relief { shadow = "#5b5141", shadow-opacity = 0.32, highlight = "#ffffff", highlight-opacity = 0.18,
             exaggeration = [[0, 6], [11, 1]] }
    layers = [
      { id = "land", type = "fill", layer = "earth", geometry = "polygon", fill = "#f2efe8" }
      # land cover to zoom 8 (satellite-derived, the same everywhere), OSM's land use from 9
      { id = "lc-forest", type = "fill", layer = "landcover", geometry = "polygon", kinds = ["forest"], fill = "#cfe2bf", max-zoom = 8.99 }
      { id = "lc-grass", type = "fill", layer = "landcover", geometry = "polygon", kinds = ["grassland", "scrub"], fill = "#e4ead0", max-zoom = 8.99 }
      { id = "lc-barren", type = "fill", layer = "landcover", geometry = "polygon", kinds = ["barren"], fill = "#efe8da", max-zoom = 8.99 }
      { id = "lc-urban", type = "fill", layer = "landcover", geometry = "polygon", kinds = ["urban_area"], fill = "#e3ded8", max-zoom = 8.99 }
      { id = "lc-ice", type = "fill", layer = "landcover", geometry = "polygon", kinds = ["glacier"], fill = "#f7fbfd", max-zoom = 8.99 }
      { id = "lu-wood", type = "fill", layer = "landuse", geometry = "polygon", kinds = ["forest", "wood"], fill = "#c6ddb3", min-zoom = 9 }
      { id = "lu-green", type = "fill", layer = "landuse", geometry = "polygon",
        kinds = ["scrub", "grassland", "meadow", "grass", "park", "nature_reserve", "national_park", "recreation_ground"],
        fill = "#dde9c9", min-zoom = 9 }
      { id = "lu-town", type = "fill", layer = "landuse", geometry = "polygon", kinds = ["residential"], fill = "#e4dfda", min-zoom = 9 }
      { id = "lu-works", type = "fill", layer = "landuse", geometry = "polygon",
        kinds = ["industrial", "commercial", "railway", "military", "aerodrome", "airfield"], fill = "#e8dde2", min-zoom = 9 }
      { id = "lu-rock", type = "fill", layer = "landuse", geometry = "polygon", kinds = ["bare_rock", "wetland"], fill = "#e9e4da", min-zoom = 9 }
      { id = "water", type = "fill", layer = "water", geometry = "polygon", fill = "#a8cbdc",
        not-kinds = ["swimming_pool", "fountain"] }
      { id = "rivers", type = "line", layer = "water", geometry = "line", kinds = ["river", "canal"],
        color = "#a8cbdc", width = [[6, 0.6], [10, 1.6], [14, 4]] }
      { id = "streams", type = "line", layer = "water", geometry = "line", kinds = ["stream"], min-zoom = 10,
        color = "#a8cbdc", width = [[10, 0.5], [14, 1.5]] }
      # borders: countries, then provinces (`kind_detail` is the admin level)
      { id = "border-region", type = "line", layer = "boundaries", kinds = ["region"], min-zoom = 5,
        color = "#b7a9c4", width = [[5, 0.5], [10, 1]], dash = [3, 2] }
      { id = "border-country", type = "line", layer = "boundaries", kinds = ["country"],
        color = "#8f7aa3", width = [[3, 0.7], [10, 1.8]] }
      # roads: every class's casing under every class's fill, the larger on top
      { id = "runway", type = "line", layer = "roads", geometry = "line", kinds = ["aeroway"], min-zoom = 10,
        color = "#d4d0dc", width = [[10, 1], [14, 6]] }
      { id = "case-minor", type = "line", layer = "roads", geometry = "line", kinds = ["minor_road"], min-zoom = 11,
        color = "#cfc7bb", width = [[11, 1.6], [14, 5]] }
      { id = "case-major", type = "line", layer = "roads", geometry = "line", kinds = ["major_road"], min-zoom = 7,
        color = "#c7b48f", width = [[7, 1.1], [10, 2.6], [14, 8]] }
      { id = "case-highway", type = "line", layer = "roads", geometry = "line", kinds = ["highway"], min-zoom = 5,
        color = "#b86f7d", width = [[5, 1], [10, 3.4], [14, 9]] }
      { id = "minor", type = "line", layer = "roads", geometry = "line", kinds = ["minor_road"], min-zoom = 11,
        color = "#ffffff", width = [[11, 0.8], [14, 3.6]] }
      { id = "major", type = "line", layer = "roads", geometry = "line", kinds = ["major_road"], min-zoom = 7,
        color = "#fbe6b0", width = [[7, 0.5], [10, 1.6], [14, 6.4]] }
      { id = "trunk", type = "line", layer = "roads", geometry = "line", kinds = ["major_road"], details = ["trunk", "trunk_link"],
        min-zoom = 6, color = "#f5bd94", width = [[6, 0.6], [10, 2], [14, 7]] }
      { id = "highway", type = "line", layer = "roads", geometry = "line", kinds = ["highway"], min-zoom = 5,
        color = "#e8949f", width = [[5, 0.5], [10, 2.2], [14, 7.4]] }
      { id = "rail", type = "line", layer = "roads", geometry = "line", kinds = ["rail"], min-zoom = 9,
        color = "#9a9a9a", width = 1, dash = [4, 3] }

      # names: countries, then the larger places first (each also waits for its own min_zoom), the seas
      { id = "countries", type = "label", layer = "places", geometry = "point", kinds = ["country"], max-zoom = 7,
        color = "#6e5a82", halo = "rgba(255,255,255,.8)", halo-width = 2, transform = "uppercase", letter-spacing = 1.5,
        max-line-chars = 12, font { size = [[3, 10], [7, 13]], weight = "600" } }
      { id = "cities", type = "label", layer = "places", geometry = "point", kinds = ["locality"], details = ["city"],
        color = "#2b2b2b", halo = "rgba(255,255,255,.85)", halo-width = 2, font { size = [[5, 11], [10, 14]], weight = "600" } }
      { id = "oceans", type = "label", layer = "water", geometry = "point", kinds = ["ocean", "sea"],
        color = "#4a7186", halo = "rgba(255,255,255,.6)", halo-width = 1.5, letter-spacing = 1,
        font { family = "Georgia, serif", style = "italic", size = [[3, 11], [8, 14]] } }
      { id = "regions", type = "label", layer = "places", geometry = "point", kinds = ["region"], min-zoom = 5, max-zoom = 8,
        color = "#8a7a96", halo = "rgba(255,255,255,.75)", halo-width = 2, transform = "uppercase", letter-spacing = 1,
        max-line-chars = 14, font { size = 10 } }
      { id = "towns", type = "label", layer = "places", geometry = "point", kinds = ["locality"], details = ["town"],
        color = "#3a3a3a", halo = "rgba(255,255,255,.85)", halo-width = 2, font { size = [[7, 10], [11, 12]] } }
      { id = "gulfs", type = "label", layer = "water", geometry = "point", kinds = ["bay", "strait", "gulf", "sound", "channel"],
        min-zoom = 7, color = "#4a7186", halo = "rgba(255,255,255,.6)", halo-width = 1.5,
        font { family = "Georgia, serif", style = "italic", size = 11 } }
      { id = "villages", type = "label", layer = "places", geometry = "point", kinds = ["locality"], details = ["village"],
        min-zoom = 10, color = "#4a4a4a", halo = "rgba(255,255,255,.85)", halo-width = 2, font { size = 10 } }
      { id = "islands", type = "label", layer = "earth", geometry = "point", kinds = ["island"], min-zoom = 8,
        color = "#555046", halo = "rgba(255,255,255,.8)", halo-width = 2, font { size = 10, style = "italic" } }
      { id = "hamlets", type = "label", layer = "places", geometry = "point", kinds = ["locality", "macrohood", "neighbourhood"],
        details = ["hamlet", "suburb", "quarter", "neighbourhood"], min-zoom = 12,
        color = "#5a5a5a", halo = "rgba(255,255,255,.85)", halo-width = 2, font { size = 9 } }
    ]
  }

  {
    id = "muted"
    extends = "standard"
    name = "Muted"
    description = "Today's map in pale, quiet colours, so your markers stand out"
    background = "#ccd9e0"
    relief { enabled = false }
    layers = [
      { id = "land", fill = "#f5f4f0" }
      { id = "lc-forest", fill = "#e3ebdb" }, { id = "lc-grass", fill = "#eef0e4" }, { id = "lc-barren", fill = "#f3f0e9" }
      { id = "lc-urban", fill = "#ebe9e5" }, { id = "lc-ice", fill = "#fbfcfd" }
      { id = "lu-wood", fill = "#dfe8d6" }, { id = "lu-green", fill = "#e9eee0" }, { id = "lu-town", fill = "#ebe8e4" }
      { id = "lu-works", fill = "#ece7e9" }, { id = "lu-rock", fill = "#efece6" }
      { id = "water", fill = "#ccd9e0" }, { id = "rivers", color = "#ccd9e0" }, { id = "streams", color = "#ccd9e0" }
      { id = "border-region", color = "#cdc6d2" }, { id = "border-country", color = "#ab9fb6" }
      { id = "runway", color = "#e2e0e6" }
      { id = "case-minor", color = "#dedad3" }, { id = "case-major", color = "#d9d2c4" }, { id = "case-highway", color = "#d2bfb5" }
      { id = "minor", color = "#ffffff" }, { id = "major", color = "#ffffff" }, { id = "trunk", color = "#fbf3ea" }
      { id = "highway", color = "#f4e3d8" }, { id = "rail", color = "#bdbdbd" }
      { id = "countries", color = "#8b7f96" }, { id = "cities", color = "#4a4a4a" }, { id = "towns", color = "#5c5c5c" }
      { id = "villages", color = "#6e6e6e" }, { id = "hamlets", color = "#7a7a7a" }, { id = "regions", color = "#a69cae" }
      { id = "oceans", color = "#7c97a6" }, { id = "gulfs", color = "#7c97a6" }, { id = "islands", color = "#77736b" }
    ]
  }

  {
    id = "dark"
    extends = "standard"
    name = "Dark"
    description = "Today's map in dark colours: land use, water, roads, borders and place names"
    tone = "dark"
    background = "#121821"
    relief { shadow = "#000000", shadow-opacity = 0.45, highlight = "#ffffff", highlight-opacity = 0.08 }
    layers = [
      { id = "land", fill = "#22262d" }
      { id = "lc-forest", fill = "#243029" }, { id = "lc-grass", fill = "#272c27" }, { id = "lc-barren", fill = "#2a2a28" }
      { id = "lc-urban", fill = "#2b2d32" }, { id = "lc-ice", fill = "#3a414a" }
      { id = "lu-wood", fill = "#23302a" }, { id = "lu-green", fill = "#262d27" }, { id = "lu-town", fill = "#2b2e34" }
      { id = "lu-works", fill = "#2e2c33" }, { id = "lu-rock", fill = "#2b2b2a" }
      { id = "water", fill = "#121821" }, { id = "rivers", color = "#22364a" }, { id = "streams", color = "#22364a" }
      { id = "border-region", color = "#4d475a" }, { id = "border-country", color = "#776d8c" }
      { id = "runway", color = "#3a3d45" }
      { id = "case-minor", color = "#1a1d22" }, { id = "case-major", color = "#1a1d22" }, { id = "case-highway", color = "#1a1d22" }
      { id = "minor", color = "#3a3f48" }, { id = "major", color = "#4a515c" }, { id = "trunk", color = "#5a5450" }
      { id = "highway", color = "#6e5b4c" }, { id = "rail", color = "#555a62" }
      { id = "countries", color = "#a99cbc", halo = "rgba(14,17,22,.85)" }
      { id = "cities", color = "#d6d9de", halo = "rgba(14,17,22,.85)" }
      { id = "towns", color = "#b9bdc4", halo = "rgba(14,17,22,.85)" }
      { id = "villages", color = "#9da2aa", halo = "rgba(14,17,22,.85)" }
      { id = "hamlets", color = "#8e939b", halo = "rgba(14,17,22,.85)" }
      { id = "regions", color = "#857b98", halo = "rgba(14,17,22,.85)" }
      { id = "oceans", color = "#5f84a0", halo = "rgba(14,17,22,.7)" }
      { id = "gulfs", color = "#5f84a0", halo = "rgba(14,17,22,.7)" }
      { id = "islands", color = "#a39d90", halo = "rgba(14,17,22,.85)" }
    ]
  }

  # ── today's terrain, without modern features ────────────────────────────────────────────────────
  {
    id = "terrain"
    name = "Terrain"
    description = "Today's terrain, dark and muted so the dots, names and boundaries stay on top"
    tone = "dark"                          # dark or light: the map's own names follow it
    background = "var(--terrain-water)"    # the sea, and where there is no tile
    labels = true                          # draw the label layers below (the physical names)

    relief {                               # shaded from the elevation tiles, over the fills
      enabled = true
      shadow = "var(--terrain-shadow)"     # slopes facing away from the light
      shadow-opacity = 0.72                # 0–1, on the steepest slope
      highlight = "var(--terrain-highlight)"
      highlight-opacity = 0.2
      azimuth = 315                        # where the light comes from, degrees clockwise from north
      altitude = 45                        # how high it stands, degrees
      exaggeration = [[0, 7.6], [11, 1]]   # slopes steepened: relief is invisible at a continent's scale without it
    }

    # Bottom to top. Each layer: an id, a type (fill, line or label), the source (vector: coast, water,
    # land cover; labels: the physical names), the data layer (one or a list), and which of its
    # features — geometry (point, line, polygon), kinds (the feature's `kind`), not-kinds, details
    # (its `kind_detail`), min-zoom / max-zoom (the map's zoom).
    layers = [
      { id = "land", type = "fill", layer = "earth", geometry = "polygon", fill = "var(--terrain-land)" }

      # land cover: `landcover` — satellite-derived, the same everywhere. The extract also keeps OSM's
      # `landuse` (far more detailed, but mapped unevenly from country to country, and modern uses too:
      # farmland, towns, quarries); "Terrain + vegetation" draws its woods, scrub and wetlands.
      { id = "forest", type = "fill", layer = "landcover", geometry = "polygon",
        kinds = ["forest", "wood"], fill = "var(--terrain-forest)" }
      { id = "scrub", type = "fill", layer = "landcover", geometry = "polygon",
        kinds = ["scrub", "heath", "grassland", "meadow"], fill = "var(--terrain-scrub)" }
      { id = "wetland", type = "fill", layer = "landcover", geometry = "polygon",
        kinds = ["wetland", "marsh", "swamp", "bog"], fill = "var(--terrain-wetland)" }
      { id = "barren", type = "fill", layer = "landcover", geometry = "polygon",
        kinds = ["barren", "bare_rock", "scree", "desert"], fill = "var(--terrain-barren)" }
      { id = "sand", type = "fill", layer = "landcover", geometry = "polygon",
        kinds = ["sand", "beach"], fill = "var(--terrain-sand)" }
      { id = "ice", type = "fill", layer = "landcover", geometry = "polygon",
        kinds = ["glacier"], fill = "var(--terrain-ice)" }

      # the extract keeps every water feature; the modern ones are not drawn (canals and ditches are
      # lines this style never selects)
      { id = "water", type = "fill", layer = "water", geometry = "polygon", fill = "var(--terrain-water)",
        not-kinds = ["swimming_pool", "fountain", "basin", "dock"] }
      { id = "rivers", type = "line", layer = "water", geometry = "line", kinds = ["river"],
        color = "var(--terrain-river)", width = [[6.3, 0.6], [15, 4.5]] }
      { id = "streams", type = "line", layer = "water", geometry = "line", kinds = ["stream"], min-zoom = 10,
        color = "var(--terrain-river)", width = [[10, 0.4], [15, 2.4]] }

      # Labels, placed in this order (an earlier one wins where two would overlap) and drawn under the
      # map's own markers. `own-min-zoom` (default true) also waits for the feature's own `min_zoom`.
      { id = "oceans", type = "label", layer = "water", geometry = "point", kinds = ["ocean", "sea"],
        color = "var(--terrain-label-water)", halo = "var(--terrain-label-halo)", halo-width = 2,
        font { family = "Georgia, serif", style = "italic", size = [[3, 11], [8, 15]] }, letter-spacing = 1 }
      { id = "ranges", type = "label", source = "labels", layer = "physical",
        kinds = ["range", "desert", "plateau", "region", "peninsula", "plain", "basin", "delta", "valley", "isthmus",
          "coast", "wetland", "foothills", "continent"],
        color = "var(--terrain-label)", halo = "var(--terrain-label-halo)", halo-width = 2, transform = "uppercase",
        letter-spacing = 2, max-line-chars = 14, font { size = [[3, 10], [9, 12]], weight = "600" } }
      { id = "gulfs", type = "label", layer = "water", geometry = "point", kinds = ["bay", "strait", "gulf", "sound", "channel"],
        min-zoom = 6, color = "var(--terrain-label-water)", halo = "var(--terrain-label-halo)", halo-width = 2,
        font { family = "Georgia, serif", style = "italic", size = 11 } }
      { id = "lakes", type = "label", source = "labels", layer = "physical", kinds = ["lake"],
        color = "var(--terrain-label-water)", halo = "var(--terrain-label-halo)", halo-width = 2,
        font { family = "Georgia, serif", style = "italic", size = 11 } }
      { id = "lakes-detail", type = "label", layer = "water", geometry = "point", details = ["lake"], min-zoom = 9,
        color = "var(--terrain-label-water)", halo = "var(--terrain-label-halo)", halo-width = 2,
        font { family = "Georgia, serif", style = "italic", size = 11 } }
      { id = "rivers-major", type = "label", source = "labels", layer = "rivers", placement = "line",
        color = "var(--terrain-label-water)", halo = "var(--terrain-label-halo)", halo-width = 2,
        font { family = "Georgia, serif", style = "italic", size = 11 } }
      { id = "rivers-detail", type = "label", layer = "water", geometry = "line", kinds = ["river"], placement = "line",
        min-zoom = 10, color = "var(--terrain-label-water)", halo = "var(--terrain-label-halo)", halo-width = 2,
        font { family = "Georgia, serif", style = "italic", size = 10 } }
      { id = "island-groups", type = "label", source = "labels", layer = "physical", kinds = ["island_group", "island"],
        max-zoom = 8, color = "var(--terrain-label)", halo = "var(--terrain-label-halo)", halo-width = 2, font { size = 11 } }
      { id = "islands", type = "label", layer = "earth", geometry = "point", kinds = ["island"], min-zoom = 8.01,
        color = "var(--terrain-label)", halo = "var(--terrain-label-halo)", halo-width = 2, font { size = 11 } }
      { id = "peaks", type = "label", source = "labels", layer = "physical", kinds = ["peak", "pass", "depression"],
        min-zoom = 7, color = "var(--terrain-label)", halo = "var(--terrain-label-halo)", halo-width = 2, font { size = 10 } }
      { id = "peaks-detail", type = "label", layer = "pois", geometry = "point", kinds = ["peak", "volcano"], min-zoom = 10,
        color = "var(--terrain-label)", halo = "var(--terrain-label-halo)", halo-width = 2, font { size = 10 } }
      { id = "capes", type = "label", source = "labels", layer = "physical", kinds = ["cape", "waterfall"],
        min-zoom = 8, color = "var(--terrain-label)", halo = "var(--terrain-label-halo)", halo-width = 2, font { size = 10 } }
    ]
  }

  {
    id = "terrain-vegetation"
    extends = "terrain"
    name = "Terrain + vegetation"
    description = "The land cover drawn strongly, with OpenStreetMap's woods, scrub and wetlands where they are mapped"
    layers = [
      { id = "forest",  fill = "rgba(78,128,74,.52)" }
      { id = "scrub",   fill = "rgba(132,138,84,.36)" }
      { id = "wetland", fill = "rgba(70,124,124,.45)" }
      { id = "osm-woods", type = "fill", layer = "landuse", geometry = "polygon", kinds = ["forest", "wood"],
        fill = "rgba(78,128,74,.3)", before = "water" }
      { id = "osm-scrub", type = "fill", layer = "landuse", geometry = "polygon", kinds = ["scrub", "heath", "grassland", "meadow"],
        fill = "rgba(132,138,84,.22)", before = "water" }
      { id = "osm-wetland", type = "fill", layer = "landuse", geometry = "polygon", kinds = ["wetland", "marsh", "swamp", "bog"],
        fill = "rgba(70,124,124,.3)", before = "water" }
      { id = "barren",  fill = "rgba(164,138,100,.34)" }
      { id = "sand",    fill = "rgba(190,164,110,.42)" }
      { id = "ice",     fill = "rgba(224,234,244,.55)" }
    ]
  }

  {
    id = "relief"
    extends = "terrain"
    name = "Relief only"
    description = "Land, water and the relief: no land cover, no names"
    labels = false
    relief { shadow-opacity = 0.85, highlight-opacity = 0.3, exaggeration = [[0, 9], [11, 1.4]] }
    layers = [
      { id = "forest", remove = true }, { id = "scrub", remove = true }, { id = "wetland", remove = true }
      { id = "barren", remove = true }, { id = "sand", remove = true }, { id = "ice", remove = true }
    ]
  }

  {
    id = "parchment"
    extends = "terrain"
    name = "Parchment"
    description = "A light, old-atlas look: pale land and sea, sepia relief, brown names"
    tone = "light"
    background = "#c6d3d0"
    relief { shadow = "#4a3620", shadow-opacity = 0.85, highlight = "#fffaf0", highlight-opacity = 0.4 }
    layers = [
      { id = "land",    fill = "#efe4c6" }
      { id = "forest",  fill = "rgba(112,132,82,.26)" }
      { id = "scrub",   fill = "rgba(150,146,96,.18)" }
      { id = "wetland", fill = "rgba(96,130,124,.22)" }
      { id = "barren",  fill = "rgba(176,146,104,.16)" }
      { id = "sand",    fill = "rgba(206,178,120,.24)" }
      { id = "ice",     fill = "rgba(250,252,255,.6)" }
      { id = "water",   fill = "#c6d3d0" }
      { id = "rivers",  color = "#7f9aa6" }
      { id = "streams", color = "#93abb5" }
