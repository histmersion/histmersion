# hist-db defaults (keys are kebab-case ↔ camelCase fields). Every value can be overridden by the matching env var (HOCON `${?VAR}`).
# NO OTHER CONSTANTS EXIST IN THE CODE: ports, URLs, limits and UI defaults all come from here.
histdb {
  server {
    host = "0.0.0.0"                      # bind address inside the container / process
    host = ${?HISTDB_BIND}
    port = 8000
    port = ${?HISTDB_PORT}
    public-url = "http://localhost:8000"   # how clients reach the server (absolute asset URLs in MCP output)
    public-url = ${?HISTDB_PUBLIC_URL}
  }
  db {
    url = "jdbc:postgresql://localhost:5432/histdb"
    url = ${?HISTDB_DB_URL}
    user = "histdb"
    user = ${?HISTDB_DB_USER}
    password = "histdb"
    password = ${?HISTDB_DB_PASS}
  }
  converter {
    url = "http://localhost:8100"
    url = ${?HISTDB_CONVERTER_URL}
    timeout-seconds = 600
    parallelism = 1
  }
  corpus {
    dir = ""                              # server-side path of wiki/sources for `seed` (bind-mounted in Docker)
    dir = ${?HISTDB_CORPUS_DIR}
  }
  limits {
    search = 20                           # default result page size
    findings = 4000                       # max map points per request
    snippet-chars = 240                   # ts_headline budget per hit (MaxWords = this / 6)
    chunk-chars = 4000                    # max size of one FTS body chunk (tsvector caps a row at ~1 MB)
    reindex-chars = 2000000               # body characters re-chunked per /api/reindex call (keeps it well under the 20 s HTTP timeout)
  }
  ui {
    tiles = "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
    tiles = ${?HISTDB_TILES}
    tiles-max-zoom = 12
    marker-radius = 5                     # drawn radius of a finding dot, px; clustering joins dots
                                          # whose centres are closer than 2 x this (they overlap)
    viewport-debounce-ms = 250            # "only papers in view": delay after moveend/zoomend
    page-size = 20                        # sources listed in the sidebar per request
    facet-suggestions = 12                # max rows in a chip autocomplete menu
    debounce { suggest-ms = 150           # keystroke → /api/facets
               search-ms = 400            # keystroke → State (search box, year boxes)
               reload-ms = 250 }          # State change → /api/findings + /api/sources
    time { min = -12000, max = 2026, default-from = -3500, default-to = -500 }
  }
  # ── stream 2.8: lint · queue · read-only query ──────────────────────────────────────────────
  query {
    timeout-ms = 10000                    # SET LOCAL statement_timeout for `histdb query` (read-only txn)
    timeout-ms = ${?HISTDB_QUERY_TIMEOUT_MS}
    max-rows = 500                        # row cap; a result hitting it comes back marked truncated
    max-rows = ${?HISTDB_QUERY_MAX_ROWS}
    max-cell-chars = 2000                 # a single cell is truncated at this many chars (ocr_markdown is megabytes)
    max-cell-chars = ${?HISTDB_QUERY_MAX_CELL_CHARS}
  }
  lint {
    max-items = 50                        # offending rows LISTED per rule (`count` is always the true total)
    max-items = ${?HISTDB_LINT_MAX_ITEMS}
    suggestions = 3                       # closest citekey prefix matches offered per dangling edge target
    suggestions = ${?HISTDB_LINT_SUGGESTIONS}
  }
  cli {
    server-url = "http://localhost:8000"
    server-url = ${?HISTDB_SERVER_URL}
  }
}
