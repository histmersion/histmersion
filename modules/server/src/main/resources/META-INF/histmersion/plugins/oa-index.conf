# The built-in `oa-index` plugin (acquisition): Unpaywall, CORE, OpenAlex OA locations and repository landing pages, by DOI.
# Its endpoints and rules are Histmersion's own `histmersion.acquire` settings; this block has only the
# host's `enabled`. On by default; histmersion.plugins.oa-index.enabled = false takes its fetchers out of the chain.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_OA_INDEX_ENABLED}
