# The built-in `ai-codex` plugin (AI provider `codex`): the person's own `codex exec` on its ChatGPT login (`codex:<model>`).
# Its settings are Histmersion's own `agents.providers.codex.*`, read at each call; this block has only the host's
# `enabled`. On by default; histmersion.plugins.ai-codex.enabled = false takes `codex:*` models out of every
# role's chain (a chain passes them over, naming this switch) and out of `agent doctor`.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_AI_CODEX_ENABLED}
