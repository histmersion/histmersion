# The built-in `oa-core` plugin (acquisition): CORE's download URLs for a DOI (api.core.ac.uk), with an API key.
# One of the four open-access index plugins (oa-unpaywall, oa-core, oa-openalex, oa-landing), which were
# ONE plugin, `oa-index`, until 2026-10-18 — its settings still apply, with a deprecation warning.
# CORE's endpoint is Histmersion's own `histmersion.acquire.core.url`. On by default;
# histmersion.plugins.oa-core.enabled = false takes the `core` fetcher out of the chain.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_OA_CORE_ENABLED}
# CORE's API key as a SECRET REFERENCE — "env:<NAME>" or a vault's ("keepassxc:CORE#password"), never
# the key itself. null = Histmersion's `acquire.core.api-key` (HISTMERSION_ACQUIRE_CORE_API_KEY); with
# no key at all, CORE is not asked.
api-key = null
