# The built-in `media-pleiades` plugin (media): `histmersion media import pleiades` — the Commons files Pleiades place records link.
# Its settings are Histmersion's own `media.pleiades.*`, read at each import; this block has only the host's
# `enabled`. On by default; histmersion.plugins.media-pleiades.enabled = false takes the collection out of
# `media import` and `histmersion media providers`.
# Its own switch `media.pleiades.enabled = false` still refuses the import too.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_MEDIA_PLEIADES_ENABLED}
