# The built-in `pmc` plugin (acquisition): Europe PMC / PMC Article Datasets: the PDF, else the JATS full text, by DOI.
# Its endpoints and rules are Histmersion's own `histmersion.acquire` settings; this block has only the
# host's `enabled`. On by default; histmersion.plugins.pmc.enabled = false takes its fetchers out of the chain.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_PMC_ENABLED}
