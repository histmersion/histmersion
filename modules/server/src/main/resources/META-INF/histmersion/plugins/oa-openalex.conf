# The built-in `oa-openalex` plugin (acquisition): OpenAlex's open-access locations of a work, by DOI.
# One of the four open-access index plugins (oa-unpaywall, oa-core, oa-openalex, oa-landing), which were
# ONE plugin, `oa-index`, until 2026-10-18 — its settings still apply, with a deprecation warning.
# OpenAlex's endpoint and its polite-pool contact are Histmersion's own (`acquire.openalex.url`,
# `acquire.contact-email`, shared with discover and followups); this block has only the host's `enabled`.
# On by default; histmersion.plugins.oa-openalex.enabled = false takes the `openalex` fetcher out of the chain.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_OA_OPENALEX_ENABLED}
