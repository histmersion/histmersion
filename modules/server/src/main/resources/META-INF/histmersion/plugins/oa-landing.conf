# The built-in `oa-landing` plugin (acquisition): the repository LANDING PAGES the open-access indexes and
# DataCite name for a DOI, resolved one step — Zenodo by its API, a repository by its citation_pdf_url.
# One of the four open-access index plugins (oa-unpaywall, oa-core, oa-openalex, oa-landing), which were
# ONE plugin, `oa-index`, until 2026-10-18 — its settings still apply, with a deprecation warning.
# It reads the Unpaywall and OpenAlex records of the work (shared with those fetchers within one fetch).
# Its rules are Histmersion's own `histmersion.acquire.landing.*` (and `acquire.landing.enabled` still
# switches it off too); this block has only the host's `enabled`. On by default;
# histmersion.plugins.oa-landing.enabled = false takes the `landing` fetcher out of the chain.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_OA_LANDING_ENABLED}
