# The built-in `media-smithsonian` plugin (media): `histmersion media import smithsonian` — Smithsonian Open Access
# objects whose image is CC0. The Open Access API needs an api.data.gov key (free: api.data.gov/signup), so the
# plugin is OFF by default. Its other settings are Histmersion's own `media.smithsonian.*`, read at each import;
# its own switch `media.smithsonian.enabled = false` still refuses the import too.
enabled = false
enabled = ${?HISTMERSION_PLUGIN_MEDIA_SMITHSONIAN_ENABLED}
# The api.data.gov key as a SECRET REFERENCE — "env:<NAME>" or a vault's ("keepassxc:Histmersion/api.data.gov#password"),
# never the key itself. null = no key: the collection is listed, its import says the key is missing, and the API
# is not asked. The key is sent as the X-Api-Key header, never in a URL.
api-key = null
