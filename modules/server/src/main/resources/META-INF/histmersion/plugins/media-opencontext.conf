# The built-in `media-opencontext` plugin (media): `histmersion media import opencontext` — Open Context's excavation media.
# Its settings are Histmersion's own `media.open-context.*`, read at each import; this block has only the host's
# `enabled`. On by default; histmersion.plugins.media-opencontext.enabled = false takes the collection out of
# `media import` and `histmersion media providers`.
# Its own switch `media.open-context.enabled = false` still refuses the import too.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_MEDIA_OPENCONTEXT_ENABLED}
