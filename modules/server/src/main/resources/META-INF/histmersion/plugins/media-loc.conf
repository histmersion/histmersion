# The built-in `media-loc` plugin (media): `histmersion media import loc` — the Library of Congress's public-domain maps.
# Its settings are Histmersion's own `media.loc.*`, read at each import; this block has only the host's
# `enabled`. On by default; histmersion.plugins.media-loc.enabled = false takes the collection out of
# `media import` and `histmersion media providers`.
# Its own switch `media.loc.enabled = false` still refuses the import too.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_MEDIA_LOC_ENABLED}
