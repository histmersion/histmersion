# The built-in `events-gvp` plugin (event catalogue): `histmersion events import gvp` — the Smithsonian Global Volcanism Program's Holocene eruptions.
# Its settings are Histmersion's own `events.gvp.*`, read at each import; this block has only the host's
# `enabled`. On by default; histmersion.plugins.events-gvp.enabled = false takes the catalogue out of
# `events import` and `histmersion events catalogues` (its events already on the map stay).
enabled = true
enabled = ${?HISTMERSION_PLUGIN_EVENTS_GVP_ENABLED}
