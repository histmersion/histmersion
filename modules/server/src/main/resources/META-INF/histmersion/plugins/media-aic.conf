# The built-in `media-aic` plugin (media): `histmersion media import aic` — The Art Institute of Chicago's public-domain objects.
# Its settings are Histmersion's own `media.aic.*`, read at each import; this block has only the host's
# `enabled`. On by default; histmersion.plugins.media-aic.enabled = false takes the collection out of
# `media import` and `histmersion media providers`.
# Its own switch `media.aic.enabled = false` still refuses the import too.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_MEDIA_AIC_ENABLED}
