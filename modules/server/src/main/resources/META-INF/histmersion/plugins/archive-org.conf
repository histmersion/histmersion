# The built-in `archive-org` plugin (acquisition): a public archive.org item's file, by its identifier (lending-only items are refused).
# Its endpoints and rules are Histmersion's own `histmersion.acquire` settings; this block has only the
# host's `enabled`. On by default; histmersion.plugins.archive-org.enabled = false takes its fetchers out of the chain.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_ARCHIVE_ORG_ENABLED}
