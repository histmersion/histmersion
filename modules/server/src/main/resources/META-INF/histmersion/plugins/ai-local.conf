# The built-in `ai-local` plugin (AI provider `local`): any OpenAI-compatible local server — llama.cpp, LM Studio, vLLM, Ollama (`local:<model>`).
# Its settings are Histmersion's own `agents.providers.local.*`, read at each call; this block has only the host's
# `enabled`. On by default; histmersion.plugins.ai-local.enabled = false takes `local:*` models out of every
# role's chain (a chain passes them over, naming this switch) and out of `agent doctor`.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_AI_LOCAL_ENABLED}
