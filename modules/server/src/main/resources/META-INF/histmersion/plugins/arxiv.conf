# The built-in `arxiv` plugin (acquisition): an arXiv preprint's PDF, by its arXiv id.
# Its endpoints and rules are Histmersion's own `histmersion.acquire` settings; this block has only the
# host's `enabled`. On by default; histmersion.plugins.arxiv.enabled = false takes its fetchers out of the chain.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_ARXIV_ENABLED}
