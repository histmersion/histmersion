# The built-in `ai-claude-code` plugin (AI provider `claude-code`): the person's own `claude -p` on their Claude login (`claude-code:<model>`).
# Its settings are Histmersion's own `agents.providers.claude-code.*`, read at each call; this block has only the host's
# `enabled`. On by default; histmersion.plugins.ai-claude-code.enabled = false takes `claude-code:*` models out of every
# role's chain (a chain passes them over, naming this switch) and out of `agent doctor`.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_AI_CLAUDE_CODE_ENABLED}
