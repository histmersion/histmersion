# The built-in `oa-unpaywall` plugin (acquisition): Unpaywall's best open-access location, by DOI.
# One of the four open-access index plugins (oa-unpaywall, oa-core, oa-openalex, oa-landing), which were
# ONE plugin, `oa-index`, until 2026-10-18 — its settings still apply, with a deprecation warning.
# Unpaywall's endpoint is Histmersion's own `histmersion.acquire.unpaywall.url`. On by default;
# histmersion.plugins.oa-unpaywall.enabled = false takes the `unpaywall` fetcher out of the chain.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_OA_UNPAYWALL_ENABLED}
# The e-mail Unpaywall requires with every request — sent ONLY as its `email` parameter, never in a
# header. Per install, never in the repository: null = Histmersion's `acquire.contact-email`
# (HISTMERSION_ACQUIRE_CONTACT_EMAIL, which the installers pass on); with neither, Unpaywall is not asked.
contact-email = null
contact-email = ${?HISTMERSION_PLUGIN_OA_UNPAYWALL_CONTACT_EMAIL}
