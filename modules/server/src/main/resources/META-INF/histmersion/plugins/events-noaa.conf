# The built-in `events-noaa` plugin (event catalogue): `histmersion events import noaa` — NOAA NCEI's significant earthquakes, eruptions and tsunamis.
# Its settings are Histmersion's own `events.noaa.*`, read at each import; this block has only the host's
# `enabled`. On by default; histmersion.plugins.events-noaa.enabled = false takes the catalogue out of
# `events import` and `histmersion events catalogues` (its events already on the map stay).
enabled = true
enabled = ${?HISTMERSION_PLUGIN_EVENTS_NOAA_ENABLED}
