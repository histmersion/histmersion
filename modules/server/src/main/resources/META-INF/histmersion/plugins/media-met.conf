# The built-in `media-met` plugin (media): `histmersion media import met` — The Metropolitan Museum of Art's Open Access objects.
# Its settings are Histmersion's own `media.met.*`, read at each import; this block has only the host's
# `enabled`. On by default; histmersion.plugins.media-met.enabled = false takes the collection out of
# `media import` and `histmersion media providers`.
# Its own switch `media.met.enabled = false` still refuses the import too.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_MEDIA_MET_ENABLED}
