# The built-in `media-cleveland` plugin (media): `histmersion media import cleveland` — The Cleveland Museum of Art's Open Access objects.
# Its settings are Histmersion's own `media.cleveland.*`, read at each import; this block has only the host's
# `enabled`. On by default; histmersion.plugins.media-cleveland.enabled = false takes the collection out of
# `media import` and `histmersion media providers`.
# Its own switch `media.cleveland.enabled = false` still refuses the import too.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_MEDIA_CLEVELAND_ENABLED}
