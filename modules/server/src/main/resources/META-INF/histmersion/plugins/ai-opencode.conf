# The built-in `ai-opencode` plugin (AI provider `opencode`): `opencode run` on the generated config (`opencode:<provider>/<model>`).
# Its settings are Histmersion's own `agents.providers.opencode.*`, read at each call; this block has only the host's
# `enabled`. On by default; histmersion.plugins.ai-opencode.enabled = false takes `opencode:*` models out of every
# role's chain (a chain passes them over, naming this switch) and out of `agent doctor`.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_AI_OPENCODE_ENABLED}
