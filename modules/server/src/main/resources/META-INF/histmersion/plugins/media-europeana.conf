# The built-in `media-europeana` plugin (media): `histmersion media import europeana` — Europeana's openly licensed
# images (CC0, PDM, CC BY, CC BY-SA). Europeana's APIs need a personal API key (free, with a Europeana account), so
# the plugin is OFF by default. Its other settings are Histmersion's own `media.europeana.*`, read at each import;
# its own switch `media.europeana.enabled = false` still refuses the import too.
enabled = false
enabled = ${?HISTMERSION_PLUGIN_MEDIA_EUROPEANA_ENABLED}
# The personal API key as a SECRET REFERENCE — "env:<NAME>" or a vault's ("keepassxc:Histmersion/Europeana#password"),
# never the key itself. null = no key: the collection is listed, its import says the key is missing, and the API
# is not asked. The key is sent as the X-Api-Key header (Europeana's preferred form), never in a URL.
api-key = null
