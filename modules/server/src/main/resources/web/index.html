<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hist-db — atlas</title>
  <link rel="stylesheet" href="/web/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/web/vendor/leaflet.markercluster/MarkerCluster.css" />
  <link rel="stylesheet" href="/web/vendor/leaflet.markercluster/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="/web/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>hist-db <span class="muted">· atlas</span></h1>
      <div id="controls">
        <div id="filters"></div>
        <span id="viewport"></span>
      </div>
      <div class="muted" id="status"></div>
    </header>
    <div id="timeline"></div>
    <div id="map"></div>
    <aside>
      <!-- sidebar tabs: the filtered SOURCES (plan §1.0) and the compiled ARTICLES (§5.2 stream 2.7) -->
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="sources" type="button">sources</button>
        <button class="tab" data-tab="articles" type="button">articles</button>
        <!-- §1.6: the same filter as "sources", grouped into a tree instead of listed -->
        <button class="tab" data-tab="bytime" type="button">by time</button>
        <button class="tab" data-tab="byregion" type="button">by region</button>
      </div>
      <div class="count" id="count">…</div><div id="list"></div>
      <div id="tree-pane" hidden>
        <div class="count" id="tree-count">…</div>
        <div id="tree-list"></div>
      </div>
      <div id="articles-pane" hidden>
        <div class="articles-search">
          <input id="articles-q" type="search" placeholder="search articles by title or text" />
        </div>
        <div class="count" id="articles-count">…</div>
        <div id="articles-list"></div>
      </div>
    </aside>
  </div>

  <div id="modal" class="modal-backdrop" hidden>
    <div class="modal">
      <div class="modal-bar">
        <a id="modal-newtab" href="#" target="_blank" rel="noopener">open in new tab ↗</a>
        <button id="modal-close" title="Close (Esc)">✕</button>
      </div>
      <div id="modal-content" class="modal-content"></div>
    </div>
  </div>

  <script src="/web/vendor/leaflet/leaflet.js"></script>
  <script src="/web/vendor/leaflet.markercluster/leaflet.markercluster.js"></script>
  <script src="/web/fmt.js"></script>
  <script src="/web/api.js"></script>
  <script src="/web/state.js"></script>
  <script src="/web/article.js"></script>
  <script src="/web/map.js"></script>
  <script src="/web/viewport.js"></script>
  <script src="/web/results.js"></script>
  <script src="/web/articles.js"></script>
  <!-- after articles.js: both listen on the same tab bar and tree.js must have the last word -->
  <script src="/web/tree.js"></script>
  <script src="/web/chips.js"></script>
  <script src="/web/places.js"></script>
  <script src="/web/filters.js"></script>
  <script src="/web/timeline.js"></script>
  <script src="/web/app.js"></script>
</body>
</html>
