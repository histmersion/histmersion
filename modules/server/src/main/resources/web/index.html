<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hist-db — atlas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --bg:#12141a; --panel:#1b1e27; --ink:#e6e8ee; --muted:#9aa3b2; --accent:#6ea8fe; --line:#2a2f3a; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); }
    #app { display:grid; grid-template-columns: 1fr 360px; grid-template-rows: auto 1fr; height:100%; }
    header { grid-column:1/3; display:flex; gap:16px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
    header h1 { font-size:15px; margin:0; font-weight:650; letter-spacing:.02em; }
    header .muted { color:var(--muted); font-size:12px; }
    #controls { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
    #controls label { color:var(--muted); font-size:12px; margin-right:6px; }
    input[type=text] { background:#0e1016; border:1px solid var(--line); color:var(--ink); border-radius:6px; padding:5px 8px; width:150px; }
    input[type=range] { vertical-align:middle; width:150px; accent-color:var(--accent); }
    #map { grid-column:1; grid-row:2; }
    aside { grid-column:2; grid-row:2; background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; }
    .count { padding:10px 14px; color:var(--muted); font-size:12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); }
    .hit { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
    .hit:hover { background:#222634; }
    .hit .ck { color:var(--accent); font-weight:600; font-size:12px; }
    .hit .claim { font-size:12.5px; margin-top:2px; }
    .hit .meta { color:var(--muted); font-size:11px; margin-top:3px; }
    .yv { display:inline-block; min-width:78px; color:var(--ink); font-variant-numeric:tabular-nums; }
    .leaflet-popup-content { font:12px system-ui; }
    .leaflet-popup-content b { color:#1a3; }
    [hidden] { display:none !important; }
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.62); display:flex; justify-content:center; align-items:flex-start; padding:40px 16px; z-index:1000; overflow:auto; }
    .modal { background:var(--bg); border:1px solid var(--line); border-radius:10px; max-width:820px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.5); }
    .modal-bar { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:9px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); border-radius:10px 10px 0 0; }
    .modal-bar a { color:var(--accent); font-size:13px; text-decoration:none; }
    .modal-bar button { background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; line-height:1; }
    .modal-content { padding:18px 26px 28px; }
    .modal-content h1 { font-size:20px; line-height:1.3; } .modal-content h2 { font-size:15px; color:var(--muted); border-top:1px solid var(--line); padding-top:12px; margin-top:22px; }
    .modal-content a { color:var(--accent); } .modal-content em { color:var(--muted); }
    .modal-content code { background:var(--panel); padding:1px 4px; border-radius:4px; } .modal-content pre { background:var(--panel); padding:12px; border-radius:6px; overflow:auto; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>hist-db <span class="muted">· atlas</span></h1>
      <div id="controls">
        <span><label>region</label><input type="text" id="region" placeholder="e.g. Anatolia" /></span>
        <span><label>from</label><input type="range" id="from" min="-7000" max="0" step="25" value="-3500"><span class="yv" id="fromv"></span></span>
        <span><label>to</label><input type="range" id="to" min="-7000" max="0" step="25" value="-500"><span class="yv" id="tov"></span></span>
      </div>
      <div class="muted" id="status" style="margin-left:auto"></div>
    </header>
    <div id="map"></div>
    <aside><div class="count" id="count">…</div><div id="list"></div></aside>
  </div>

  <div id="modal" class="modal-backdrop" hidden>
    <div class="modal">
      <div class="modal-bar">
        <a id="modal-newtab" href="#" target="_blank" rel="noopener">open in new tab ↗</a>
        <button id="modal-close" title="Close (Esc)">✕</button>
      </div>
      <div id="modal-content" class="modal-content"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const yr = y => y == null ? "?" : (y < 0 ? `${-y} BCE` : `${y} CE`);
    const periodStr = (a, b) => (a == null || b == null) ? "" : (a === b ? yr(a) : `${yr(a)}–${yr(b)}`);
    // viridis-ish ramp for the period midpoint (older = purple, newer = yellow)
    const stops = [[68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]];
    const color = t => {
      t = Math.max(0, Math.min(1, t)); const f = t * (stops.length - 1); const i = Math.floor(f); const g = f - i;
      const a = stops[i], b = stops[Math.min(i + 1, stops.length - 1)];
      return `rgb(${Math.round(a[0]+(b[0]-a[0])*g)},${Math.round(a[1]+(b[1]-a[1])*g)},${Math.round(a[2]+(b[2]-a[2])*g)})`;
    };

    const map = L.map('map', { worldCopyJump: true }).setView([37, 30], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      { attribution: '© OpenStreetMap', maxZoom: 12, opacity: 0.85 }).addTo(map);
    const layer = L.layerGroup().addTo(map);

    const $ = id => document.getElementById(id);
    const fromEl = $('from'), toEl = $('to'), regionEl = $('region');

    function syncLabels() { $('fromv').textContent = yr(+fromEl.value); $('tov').textContent = yr(+toEl.value); }

    let timer = null;
    function schedule() { clearTimeout(timer); timer = setTimeout(load, 250); syncLabels(); }

    async function load() {
      let a = +fromEl.value, b = +toEl.value; if (a > b) [a, b] = [b, a];
      const p = new URLSearchParams({ from: a, to: b, limit: 4000 });
      const r = regionEl.value.trim(); if (r) p.set('region', r);
      $('status').textContent = 'loading…';
      const res = await fetch('/api/findings?' + p.toString());
      const data = await res.json();
      render(data, a, b);
      $('status').textContent = '';
    }

    function render(points, a, b) {
      layer.clearLayers();
      const list = $('list'); list.innerHTML = '';
      $('count').textContent = `${points.length} finding(s) · ${yr(a)} → ${yr(b)}`;
      const span = 7000;
      for (const pt of points) {
        const mid = (pt.periodStart != null && pt.periodEnd != null) ? (pt.periodStart + pt.periodEnd) / 2 : a;
        const c = color((mid + span) / span);
        L.circleMarker([pt.lat, pt.lon], { radius: 5, color: '#000', weight: 0.5, fillColor: c, fillOpacity: 0.85 })
          .bindPopup(`<b>${pt.citekey}</b> — ${pt.title}<br><i>${periodStr(pt.periodStart, pt.periodEnd)}</i><br>${pt.claim}<br><a href="#" onclick="openArticle('${pt.citekey}');return false;">open article</a> · <a href="/source/${pt.citekey}" target="_blank">new tab ↗</a>`)
          .addTo(layer);
      }
      points.slice(0, 300).forEach(pt => {
        const d = document.createElement('div'); d.className = 'hit';
        d.innerHTML = `<div class="ck">${pt.citekey}</div><div class="claim">${pt.claim.slice(0,160)}</div>`
          + `<div class="meta">${periodStr(pt.periodStart, pt.periodEnd)}</div>`;
        d.onclick = () => openArticle(pt.citekey);
        list.appendChild(d);
      });
    }

    // ── article modal ──
    const modal = $('modal'), modalContent = $('modal-content'), modalNewtab = $('modal-newtab');
    async function openArticle(ck, full = false) {
      modalNewtab.href = '/source/' + ck;
      modalContent.innerHTML = '<p style="color:#9aa3b2">loading…</p>';
      modal.hidden = false;
      try {
        const html = await (await fetch('/source/' + ck + '?fragment=true' + (full ? '&full=true' : ''))).text();
        modalContent.innerHTML = html;
        modal.querySelector('.modal').scrollTop = 0; modal.scrollTop = 0;
      } catch (e) { modalContent.innerHTML = '<p>failed to load</p>'; }
    }
    window.openArticle = openArticle;
    function closeModal() { modal.hidden = true; modalContent.innerHTML = ''; }
    $('modal-close').onclick = closeModal;
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) closeModal(); });
    // keep /source links (references, full-text toggle) inside the modal
    modalContent.addEventListener('click', e => {
      const a = e.target.closest('a'); if (!a) return;
      const m = (a.getAttribute('href') || '').match(/^\/source\/([a-z0-9_]+)(\?full=true)?$/);
      if (m) { e.preventDefault(); openArticle(m[1], !!m[2]); }
    });

    [fromEl, toEl].forEach(e => e.addEventListener('input', schedule));
    regionEl.addEventListener('input', schedule);
    syncLabels(); load();
  </script>
</body>
</html>
