<title>Methoden der prähistorisch-archäologischen Ausgrabung und stratigraphischen Analyse in Troia</title>

<meta name="DCTERMS.abstract" content="Eine archäologische Ausgrabung versucht mittels Abtragung von Schichten und der Freilegung von Befunden bestimmte kulturhistorische Fragestellungen zu beantworten. Der physische Eingriff in die Depositionen einer Siedlung, die sich oftmals über einen sehr langen Zeitraum abgelagert haben, bedeutet zugleich eine unwiederbringliche Zerstörung des ausgegrabenen Teilbereichs; die sorgfältige und gewissenhafte Dokumentation des Grabungsablaufs sowie der aufgedeckten Befunde und Funde ist daher unerläßlich. In vorliegendem Beitrag werden die im Rahmen der prähistorisch-archäologischen Untersuchungen in Hisarlık/Troia zwischen 1988 bis 2012 angewandten grabungs- und dokumentationstechnischen Verfahren vorgestellt sowie die Grundlagen und Vorgehensweise der Auswertung der Grabungsergebnisse im Rahmen der stratigraphischen Analyse aufgezeigt." xml:lang="de_DE" />
<meta name="DCTERMS.abstract" content="An archaeological excavation attempts to answer particular questions in cultural history by removing strata and uncovering features. A settlement’s deposits have often been laid down only over a very long period, and physical intervention of this sort means that in the area excavated they will be irretrievably destroyed. Careful and conscientious recording is therefore indispensable – of the features and finds revealed, but also of the course of the excavation itself. The following article describes the technical methods used in excavation and documentation within the prehistoric research programme at Hisarlık/Troy from 1988 to 2012. It also discusses the basics of stratigraphic analysis and the particular procedures adopted at Troy for evaluating the results of the excavations." xml:lang="en" />
