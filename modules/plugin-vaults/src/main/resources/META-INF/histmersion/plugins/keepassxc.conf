# The KeePassXC secret vault (keys relative to histmersion.plugins.keepassxc). Built in, DISABLED by
# default. References: "keepassxc:<entry>[#<attribute>]", e.g. "keepassxc:Histmersion/Portal#password".
# It runs `keepassxc-cli show -q -a <attribute> [-k <key-file>] [--no-password] <database> <entry>`.
enabled = false
enabled = ${?HISTMERSION_PLUGIN_KEEPASSXC_ENABLED}
cli = "keepassxc-cli"                 # a name on the server's PATH, or a full path
database = ""                         # the .kdbx file (required when enabled)
database = ${?HISTMERSION_PLUGIN_KEEPASSXC_DATABASE}
key-file = ""                         # optional key file
password = null                       # optional: a SECRET REFERENCE such as "env:KEEPASSXC_PASSWORD" —
                                      # never stored; without it --no-password is passed
attribute = "password"                # the attribute when a reference names none
timeout-seconds = 10
