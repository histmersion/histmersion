# The Bitwarden secret vault (keys relative to histmersion.plugins.bitwarden). Built in, DISABLED by
# default. References: "bitwarden:<item id or search>[#<field>]".
# It runs `bw get <field> <item> --nointeraction` with BW_SESSION from `session`.
enabled = false
enabled = ${?HISTMERSION_PLUGIN_BITWARDEN_ENABLED}
cli = "bw"                            # a name on the server's PATH, or a full path
session = null                        # a SECRET REFERENCE such as "env:BW_SESSION" (from `bw unlock`);
                                      # without it the vault reports locked
field = "password"                    # the field when a reference names none
timeout-seconds = 10
