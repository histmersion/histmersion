# The 1Password secret vault (keys relative to histmersion.plugins.1password). Built in, DISABLED by
# default. References: "1password:op://<vault>/<item>/<field>" (or without "op://").
# It runs `op read op://… [--account <account>]`.
enabled = false
enabled = ${?HISTMERSION_PLUGIN_1PASSWORD_ENABLED}
cli = "op"                            # a name on the server's PATH, or a full path
account = ""                          # optional: --account (several signed-in accounts)
service-account-token = null          # optional: a SECRET REFERENCE such as "env:OP_SERVICE_ACCOUNT_TOKEN",
                                      # passed to `op` only (otherwise the desktop app signs it in)
timeout-seconds = 10
