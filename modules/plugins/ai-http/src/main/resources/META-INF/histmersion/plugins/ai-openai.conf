# The built-in `ai-openai` plugin (AI provider `openai`): the OpenAI chat-completions API (`openai:<model>`).
# Its settings are Histmersion's own `agents.providers.openai.*` (base URL, key, strict tools, timeout), which the
# host supplies it; this block has only the host's `enabled`. On by default; histmersion.plugins.ai-openai.enabled =
# false takes `openai:*` models out of every role's chain (a chain passes them over, naming this switch) and out of
# `agent doctor`.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_AI_OPENAI_ENABLED}
