# The built-in `ai-anthropic` plugin (AI provider `anthropic`): the Anthropic Messages API (`anthropic:<model>`).
# Its settings are Histmersion's own `agents.providers.anthropic.*` (base URL, key, strict tools, timeout), which the
# host supplies it; this block has only the host's `enabled`. On by default; histmersion.plugins.ai-anthropic.enabled =
# false takes `anthropic:*` models out of every role's chain (a chain passes them over, naming this switch) and out of
# `agent doctor`.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_AI_ANTHROPIC_ENABLED}
