# The built-in `media-wikidata` plugin (media): `histmersion media import wikidata` — pictures of places and events from their Wikidata items, licensed on Wikimedia Commons.
# Its settings are Histmersion's own `media.wikidata.* and media.commons.*`, which the host supplies the plugin; this block has only the host's
# `enabled`. On by default; histmersion.plugins.media-wikidata.enabled = false takes the collection out of
# `media import` and `histmersion media providers`.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_MEDIA_WIKIDATA_ENABLED}
