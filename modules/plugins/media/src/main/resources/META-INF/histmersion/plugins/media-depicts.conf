# The built-in `media-depicts` plugin (media): `histmersion media import depicts` — Commons files that depict events (P180 depicts, P1299 depicted by).
# Its settings are Histmersion's own `media.depicts.* and media.commons.*`, which the host supplies the plugin; this block has only the host's
# `enabled`. On by default; histmersion.plugins.media-depicts.enabled = false takes the collection out of
# `media import` and `histmersion media providers`.
enabled = true
enabled = ${?HISTMERSION_PLUGIN_MEDIA_DEPICTS_ENABLED}
