# The built-in `calibre` plugin: the local Calibre library as a source collection — `histmersion calibre
# search|import|link|push|update|set|audit|sync|gaps` run on the server through it. On by default;
# histmersion.plugins.calibre.enabled = false takes it out (the CLI then reads the library on its own machine).
enabled = true
enabled = ${?HISTMERSION_PLUGIN_CALIBRE_ENABLED}
# The library's folder, the one holding metadata.db (~ is the server's home directory). On macOS a library in
# Documents, Desktop, Downloads, iCloud Drive or on an external volume needs Full Disk Access (or Files and
# Folders) for the server's binary; a server in a container needs the folder mounted.
library-path = "~/Calibre Library"
library-path = ${?HISTMERSION_CALIBRE_LIBRARY_DIR}
calibredb = "calibredb"            # absolute path if it is not on the server's PATH
calibredb = ${?HISTMERSION_CALIBRE_CALIBREDB}
sqlite = "sqlite3"                 # the read-only fallback while the Calibre GUI holds the library
sqlite = ${?HISTMERSION_CALIBRE_SQLITE3}
# Whether the server may write to the library: `calibre push`, `sync --apply`, `update` and `set` are this
# install's write path (and the research workspace's Calibre-gap hook depends on them), so it is on. Off, the
# collection is read-only and those commands refuse, naming this switch. Writes are always refused while the
# Calibre GUI holds the library.
write-back = true
write-back = ${?HISTMERSION_PLUGIN_CALIBRE_WRITE_BACK}
gui-process = "/Applications/calibre.app/Contents/MacOS/calibre"   # its presence means the GUI holds the library
