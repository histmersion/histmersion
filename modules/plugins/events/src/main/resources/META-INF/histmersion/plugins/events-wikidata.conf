# The built-in `events-wikidata` plugin (event catalogue): `histmersion events import wikidata` — Wikidata's battles, sieges, wars, treaties … (the configured classes).
# Its settings are Histmersion's own `events.wikidata.*`, which the host supplies the plugin; this block has only the host's
# `enabled`. On by default; histmersion.plugins.events-wikidata.enabled = false takes the catalogue out of
# `events import` and `histmersion events catalogues` (its events already on the map stay).
enabled = true
enabled = ${?HISTMERSION_PLUGIN_EVENTS_WIKIDATA_ENABLED}
