# The built-in `gazetteer-cliopatria` plugin (gazetteer source): `histmersion places fetch cliopatria` — Seshat Cliopatria's polity outlines, 3400 BCE to the present (CC BY 4.0).
# It has no settings of its own: the host lends its download the client `histmersion.places.fetch-*` sets; this block
# has only the host's `enabled`. On by default; histmersion.plugins.gazetteer-cliopatria.enabled = false takes the source out
# of `places fetch` and `init.fetch-sources` (its places already on the map stay).
enabled = true
enabled = ${?HISTMERSION_PLUGIN_GAZETTEER_CLIOPATRIA_ENABLED}
