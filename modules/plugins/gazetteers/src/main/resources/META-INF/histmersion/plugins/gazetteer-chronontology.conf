# The built-in `gazetteer-chronontology` plugin (gazetteer source): `histmersion places fetch chronontology` — ChronOntology's named periods (DAI, open access).
# It has no settings of its own: the host lends its download the client `histmersion.places.fetch-*` sets; this block
# has only the host's `enabled`. On by default; histmersion.plugins.gazetteer-chronontology.enabled = false takes the source out
# of `places fetch` and `init.fetch-sources` (its places already on the map stay).
enabled = true
enabled = ${?HISTMERSION_PLUGIN_GAZETTEER_CHRONONTOLOGY_ENABLED}
