name: thread-dumps
description: >-
  Uploads what scripts/ci/watched.sh wrote when a command it ran went quiet: a jstack of every java process and the
  process list, taken after HISTMERSION_WATCHDOG_QUIET_SECONDS with no output (issue #144). Nothing is uploaded when no
  command went quiet. Use it as a job's last step, under `if: always()`, so a step that times out still leaves them.
inputs:
  suffix:
    description: what tells this job's artifact apart from the other jobs of its matrix (the matrix entry)
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: thread-dumps-${{ github.job }}${{ inputs.suffix && format('-{0}', inputs.suffix) || '' }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/thread-dumps
        retention-days: 14
        if-no-files-found: ignore
