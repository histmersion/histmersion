name: bundle
# Build the native bundle (server + CLI, PostgreSQL 18 + PostGIS, the OCR converter with its models)
# on every platform we ship, and prove each one works: scripts/bundle/smoke.sh starts it in
# isolation (first-run initdb, children, health, CLI, offline OCR, clean stop).
#
# Runs on demand (workflow_dispatch) and for releases, never on a push or a pull request: no PR check
# waits for it, and it becomes a required check at the first release (docs/adr/0031-ci-on-linux-bundles-on-demand.md).
# The application code is the same on every platform and is tested on Linux by ci.yml; what differs per
# platform is the packaging, which this workflow builds, self-checks and smoke-starts. A `v*` tag attaches
# the archives to a GitHub release; other runs upload no bundle (a bundle is ~1 GB compressed).
#
# The RELINK KIT of each platform (docs/research-plugins.md §21.1) is packaged on every run, after its
# checksums are verified: kit/ (the server's Sloth-patched jars in class-path order, the native-image
# arguments, kit.json, SHA256SUMS, graalvm-version), libexec/ and the relink scripts —
# histmersion-<ref>-<platform>-kit.tar.zst (~100 MB), its .sha256, and its kit.json as -kit.json. A tag
# attaches the three to the release next to the bundle; a manual run (workflow_dispatch) uploads them as
# a workflow artifact kept 7 days; push and pull-request runs upload nothing (storage, as above).
#
# The PLUGIN REPOSITORY (the Maven repository a plugin compiles against: the plugin API with its sources,
# and the plugin platform's POM) is the same on every platform, so one job (linux-x64) attaches it to a
# tagged release as histmersion-maven-<tag>.zip, with the API's two jars beside it as
# histmersion-plugin-api-<tag>.jar and histmersion-plugin-api-<tag>-sources.jar; every bundle carries the
# same repository in maven/.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}
# read-only by default (a public repository); the bundle job asks for write, which only a tag's release upload uses
permissions:
  contents: read
concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: linux-x64,   runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
    name: bundle (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions: { contents: write }   # the release upload on tags
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      # the PINNED GraalVM CE (scripts/bundle/graalvm-pins.txt: version, URL, SHA-256), provisioned by the
      # same script the installers use — setup-graalvm cannot name an innovation release (25.5's assets are
      # `graalvm-community-jdk-25i5-…` under the tag graal-25.5.5.0.3)
      - name: GraalVM CE (the pin)
        run: |
          export HISTMERSION_DATA_DIR="$RUNNER_TEMP/histmersion-toolchain" HISTMERSION_HOME=
          bash scripts/bundle/toolchain.sh install
          home="$(bash scripts/bundle/toolchain.sh path)"
          echo "JAVA_HOME=$home" >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/coursier
            ~/Library/Caches/Coursier
            ~/.sbt
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.sbt', 'project/**') }}
          restore-keys: sbt-${{ runner.os }}-${{ runner.arch }}-
      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with: { enable-cache: true, cache-dependency-glob: converter/uv.lock }
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with: { tool: just }
      # pixi from a pinned action (no `curl | bash` of an unpinned script); it installs runtime/postgres and caches
      # the environment per pixi.lock
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          manifest-path: runtime/postgres/pixi.toml
          cache: true
      - name: system libraries the converter's OpenCV needs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0t64 zstd

      - name: Sloth (patches pre-3.8 lazy vals, so the binaries print no sun.misc.Unsafe warning)
        run: |
          git clone -q https://github.com/VirtusLab/sloth.git ../sloth
          git -C ../sloth checkout -q ed68a4abad1f5c098a7ff48a30c273b8791e5a69
          (cd ../sloth && sbt -batch cli/assembly)
      - name: install script tests (macOS — the LaunchAgent environment merge)
        if: runner.os == 'macOS'
        run: just test-scripts
      - name: more swap for the native-image builder (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo fallocate -l 10G /mnt/hm-swap && sudo chmod 600 /mnt/hm-swap
          sudo mkswap /mnt/hm-swap >/dev/null && sudo swapon /mnt/hm-swap
          free -g
      - name: build the bundle
        env:
          SBT_OPTS: ${{ runner.os == 'Linux' && '-Xss16m -Xmx6g' || '-Xss16m -Xmx5g' }}
          HISTMERSION_NATIVE_XMX: ${{ runner.os == 'Linux' && '14g' || '' }}
        run: just bundle dist/histmersion
      - name: the native server's self-check (time zones, the linked resources)
        run: dist/histmersion/bin/histmersion-server --self-check
      - name: smoke test
        run: scripts/bundle/smoke.sh dist/histmersion
      - name: install as a systemd user service, then uninstall (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"; export XDG_RUNTIME_DIR
          for _ in $(seq 30); do systemctl --user show-environment >/dev/null 2>&1 && break; sleep 1; done
          scripts/bundle/install-linux.sh dist/histmersion   # a copy: relocates the PostgreSQL again
          ~/.local/bin/histmersion health
          scripts/bundle/uninstall-linux.sh --purge
      - name: package
        run: |
          name="histmersion-${GITHUB_REF_NAME//\//-}-${{ matrix.platform }}.tar.zst"
          tar -C dist -cf - histmersion | zstd -T0 -12 -q -o "$name"
          du -sh dist/histmersion/* "$name"
          echo "ARCHIVE=$name" >> "$GITHUB_ENV"
      - name: package the relink kit
        run: |
          (cd dist/histmersion/kit && shasum -a 256 -c --quiet SHA256SUMS)   # publish only a consistent kit
          kit="histmersion-${GITHUB_REF_NAME//\//-}-${{ matrix.platform }}-kit"
          tar -C dist/histmersion -cf - kit libexec \
              bin/histmersion-relink bin/histmersion-toolchain bin/histmersion-signing bin/histmersion-server-jvm \
            | zstd -T0 -12 -q -o "$kit.tar.zst"
          shasum -a 256 "$kit.tar.zst" > "$kit.tar.zst.sha256"
          cp dist/histmersion/kit/kit.json "$kit.json"
          du -sh dist/histmersion/kit "$kit.tar.zst"
          echo "KIT=$kit" >> "$GITHUB_ENV"
      - name: upload the relink kit (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relink-kit-${{ matrix.platform }}
          path: |
            ${{ env.KIT }}.tar.zst
            ${{ env.KIT }}.tar.zst.sha256
            ${{ env.KIT }}.json
          retention-days: 7
          compression-level: 0   # zstd already
          if-no-files-found: error
      - name: package the plugin repository
        run: |
          tag="${GITHUB_REF_NAME//\//-}"
          api="histmersion-plugin-api-$tag"
          cp "$(find dist/histmersion/maven -name 'histmersion-plugin-api_3-*.jar' ! -name '*-sources.jar' | head -1)" "$api.jar"
          cp "$(find dist/histmersion/maven -name 'histmersion-plugin-api_3-*-sources.jar' | head -1)" "$api-sources.jar"
          (cd dist/histmersion && zip -qr "$GITHUB_WORKSPACE/histmersion-maven-$tag.zip" maven)
          echo "API=$api" >> "$GITHUB_ENV"
          echo "MAVEN=histmersion-maven-$tag.zip" >> "$GITHUB_ENV"
      - name: attach the plugin repository to the release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'linux-x64'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ${{ env.MAVEN }}
            ${{ env.API }}.jar
            ${{ env.API }}-sources.jar
      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.KIT }}.tar.zst
            ${{ env.KIT }}.tar.zst.sha256
            ${{ env.KIT }}.json
