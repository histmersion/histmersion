name: ci
# Every push and PR: the whole test suite against the PostgreSQL Histmersion actually ships
# (runtime/postgres — PG 18 + PostGIS 3.6), the converter's tests, and the README's CLI
# table. Building and smoke-testing the per-platform bundles is bundle.yml.
on:
  push: { branches: [master] }
  pull_request: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with: { java-version: '25', distribution: 'graalvm-community', cache: 'sbt' }
      - uses: sbt/setup-sbt@v1
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: converter/uv.lock }
      - uses: taiki-e/install-action@v2
        with: { tool: just }
      - name: pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rattler
          key: rattler-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/postgres/pixi.lock') }}

      - name: throwaway PostgreSQL 18 + PostGIS (the bundled runtime)
        run: just test-db
      - name: unit + integration tests
        env:
          HISTMERSION_TEST_DB_URL: "jdbc:postgresql://127.0.0.1:55432/histmersion_test"
          # the backup/restore suite runs the SAME pg_dump/pg_restore the bundle ships
          HISTMERSION_PG_BIN_DIR: ${{ github.workspace }}/runtime/postgres/.pixi/envs/default/bin
        run: sbt --server -batch 'testOnly *'
      - name: converter tests
        working-directory: converter
        run: uv run --frozen pytest -q
      - name: CLI reference in README is current
        run: |
          sbt --server -batch cli/nativeImage
          ./tools/gen-cli-docs.sh --check
      - if: always()
        run: just test-db-down
