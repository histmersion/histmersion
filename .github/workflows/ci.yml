name: ci
# Every push to master and the refactor branches (contracts3-**), every PR, and on demand: the whole forced test
# suite, split into shards that run side by side.
#
#   format     scalafmt alone, beside everything else: a formatting failure never skips or cancels a test job
#   converter  the OCR converter's pytest
#   build      compiles every module once (sbt 2's disk cache, target/sbt-cache, carried from earlier runs of the
#              week), lists every test suite (`sbt ciSuites`, project/CiShard.scala), classes each as unit or IT
#              from the test sources (scripts/ci/classify.py) and deals them into shards (scripts/ci/plan.py). It
#              hands the test jobs its compilation output (the sbt cache they replay) and the shard plan
#   unit / it  one job per shard: `testOnly *` narrowed to the shard's suites (HISTMERSION_CI_SHARD_FILE), every
#              finished suite recorded (HISTMERSION_CI_REPORT_DIR). Every shard sets HISTMERSION_TEST_DB_REQUIRED:
#              a unit shard has no database, so a unit suite that reaches TestDb fails loudly; an IT shard starts
#              its own throwaway PostgreSQL (runtime/postgres, PG 18 + PostGIS 3.6), so an IT suite never skips (B8)
#   shards     each suite classed, and run in exactly one shard of its class (scripts/ci/check.py); skips listed
#   native     ON DEMAND (workflow_dispatch): the native server and CLI built from the branch, its self-check, and
#              the CLI reference against the native CLI's help — no free runner has the memory to link the server
#   scripts    the scripts' tests and the CLI reference against the CLI's help (on the JVM)
#   browser    the browser tests (Playwright, modules/web/test) but the `budgets: …` ones, against the server on the
#              JVM, dealt into parallel shards (test/shard-preload.mjs: perf.test.mjs whole to shard 1, every other
#              test by its name to one of the others) — a skipped browser test fails (G125)
#   browser-shards  every browser test listed by the shards ran exactly once, in the shard it was dealt to
#   budgets    the `budgets: …` browser tests alone (the same files, the complementary name pattern), this change
#              and its merge base on this runner, interleaved: red on a regression past the runs' noise (budgets-ab.mjs)
#
# Every job runs on Linux: no application code is platform-specific, and the hosted macOS runner was no user's
# device (docs/adr/0031-ci-on-linux-bundles-on-demand.md). The lint job's suppression count and CommentGrowthSuite
# compare against the merge base with contracts3-pilot: those jobs check out the full history, so origin/contracts3-pilot
# is there (HISTMERSION_MERGE_BASE overrides it). Building and smoke-testing the per-platform bundles is
# bundle.yml, on demand and weekly.
on:
  push:
    branches: [master, 'contracts3-**']
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  # the server shards: build.sbt deals a shard's server suites into this many forked groups, at most this many JVMs
  # at once (4 vCPU / 16 GB runner; sbt itself beside them)
  HISTMERSION_TEST_FORKS: "3"
  HISTMERSION_TEST_GROUPS_SERVER: "3"
  # -Xss16m: the compiler's deep recursion (forced-run.sh's flag; the default stack overflows in Namer)
  # -Dsbt.cache_test_result=false: a forced run — sbt 2 replays a passed suite's result from its disk cache otherwise
  SBT: >-
    ${{ github.workspace }}/scripts/ci/watched.sh sbt --server -batch -J-Xss16m -Dsbt.cache_test_result=false
    -Dsbt.global.localcache=${{ github.workspace }}/target/sbt-cache
  # what forced-run.sh sets: compiling never rewrites the sources (the format job checks them)
  NOFMT: set every scalafmtOnCompile := false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: coursier/setup-action@d5a17f9aaeb260f9ba336a5b582fb49f79c64ac4 # v3.1.0
        with: { apps: scalafmt }
      - name: formatting (the scalafmt CLI over every file .scalafmt.conf covers; `just fmt` fixes it)
        timeout-minutes: 5
        run: scalafmt --check

  converter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { enable-cache: true, cache-dependency-glob: converter/uv.lock }
      - name: converter tests
        working-directory: converter
        run: uv run --frozen pytest -q

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: free disk space (the runner's preinstalled SDKs we never use)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL &
      # the launcher alone, pinned and checked: scala-cli-setup also installs a JVM (moving JAVA_HOME off the pinned
      # GraalVM, so every module compiled again) and fetches sbtn from Maven Central, which rate-limits runners
      - name: scala-cli (the ledger sites run Scalafix through it, here and nowhere else)
        env:
          SCALA_CLI_URL: https://github.com/VirtusLab/scala-cli/releases/download/v1.18.0/scala-cli-x86_64-pc-linux.gz
          SCALA_CLI_SHA256: eb41442f870bcae75aa5d6622ac96a173dae14fed59f71c97125eb21536bb060
        run: |
          mkdir -p "$RUNNER_TEMP/scala-cli"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/scala-cli.gz" "$SCALA_CLI_URL"
          echo "$SCALA_CLI_SHA256  $RUNNER_TEMP/scala-cli.gz" | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/scala-cli.gz" > "$RUNNER_TEMP/scala-cli/scala-cli"
          chmod +x "$RUNNER_TEMP/scala-cli/scala-cli"
          echo "$RUNNER_TEMP/scala-cli" >> "$GITHUB_PATH"
      - uses: ./.github/actions/setup
        with: { save-deps: "true" }
      - name: the week (the compile cache starts afresh each ISO week, so it never grows without bound)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: compile cache (restore)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/sbt-cache
          key: sbt-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.week.outputs.week }}-${{ github.sha }}
          restore-keys: sbt-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.week.outputs.week }}-
      - name: compile every module, write the ledger sites once for every shard (docs/adr/0033), list every suite
        timeout-minutes: 30
        env:
          HISTMERSION_LEDGER_SITES_TIMEOUT: "600"
        run: $SBT -J-Xmx6g "$NOFMT" Test/compile server/ledgerSites ciSuites
      - name: class the suites (unit or IT) and deal them into shards
        id: plan
        run: |
          python3 -m unittest scripts/ci/tests/test_plan.py scripts/ci/tests/test_check.py scripts/ci/tests/test_classify.py
          # an unclassified suite is named here and dealt nowhere; the shards job fails the run on it
          python3 scripts/ci/classify.py target/ci/suites target/ci/sources --out target/ci/classes.tsv || true
          python3 scripts/ci/plan.py target/ci/classes.tsv target/ci/shards > "$RUNNER_TEMP/matrix.json"
          echo "matrix=$(cat "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"
          du -sh target/sbt-cache
      - name: the compilation output and the ledger sites, for the test jobs
        run: |
          tar -C target -cf - sbt-cache guidelines | zstd -T0 -3 -q -o "$RUNNER_TEMP/compiled.tar.zst"
          ls -l "$RUNNER_TEMP/compiled.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled
          path: ${{ runner.temp }}/compiled.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: the plan (which suites each shard runs; the classes the shards job checks against)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan
          path: |
            target/ci/classes.tsv
            target/ci/shards
          retention-days: 7
          if-no-files-found: error
      - name: compile cache (save)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/sbt-cache
          key: sbt-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.week.outputs.week }}-${{ github.sha }}
      - name: dependency cache (save)
        if: env.HISTMERSION_CI_SAVE_DEPS != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/coursier
            ~/Library/Caches/Coursier
            ~/.sbt
            ~/.ivy2/cache
          key: ${{ env.HISTMERSION_CI_SAVE_DEPS }}
      - if: always()
        uses: ./.github/actions/thread-dumps

  # the lint rules (tools/lint, docs/adr/0032): every rule over every module, main and test, on the SemanticDB of
  # the build job's compile; a finding fails unless its definition carries @tolerated(LintRule.X, "why"), and a
  # @tolerated with no finding left fails too. Then no rule may have more suppressions than at the merge base with
  # contracts3-pilot (counted from git, nothing stored); a rule the merge base does not know starts at its baseline.
  lint:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: the merge base's branch is there
        run: |
          git rev-parse --verify -q origin/contracts3-pilot >/dev/null \
            || git fetch -q --no-tags origin contracts3-pilot:refs/remotes/origin/contracts3-pilot
          echo "merge base: $(git merge-base HEAD origin/contracts3-pilot)"
      - name: scala-cli (the lint rules run Scalafix through it)
        env:
          SCALA_CLI_URL: https://github.com/VirtusLab/scala-cli/releases/download/v1.18.0/scala-cli-x86_64-pc-linux.gz
          SCALA_CLI_SHA256: eb41442f870bcae75aa5d6622ac96a173dae14fed59f71c97125eb21536bb060
        run: |
          mkdir -p "$RUNNER_TEMP/scala-cli"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/scala-cli.gz" "$SCALA_CLI_URL"
          echo "$SCALA_CLI_SHA256  $RUNNER_TEMP/scala-cli.gz" | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/scala-cli.gz" > "$RUNNER_TEMP/scala-cli/scala-cli"
          chmod +x "$RUNNER_TEMP/scala-cli/scala-cli"
          echo "$RUNNER_TEMP/scala-cli" >> "$GITHUB_PATH"
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: compiled, path: "${{ runner.temp }}" }
      - name: the build job's compilation output, replayed into target/out (the SemanticDB the rules read)
        timeout-minutes: 10
        run: |
          mkdir -p target
          zstd -d -q -c "$RUNNER_TEMP/compiled.tar.zst" | tar -C target -xf -
          rm "$RUNNER_TEMP/compiled.tar.zst"
          $SBT "$NOFMT" Test/compile
      - name: the lint rules' own tests (unit tests, and the guideline rule over its fixture)
        timeout-minutes: 8
        run: tools/lint/test.sh
      - name: every lint rule over every module
        timeout-minutes: 8
        run: tools/lint/lint.sh
      - name: no rule has more suppressions than at the merge base
        timeout-minutes: 5
        run: tools/lint/count.sh
      - if: always()
        uses: ./.github/actions/thread-dumps

  test:
    needs: build
    name: ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.matrix) }}
    env:
      HISTMERSION_CI_SHARD_FILE: ${{ github.workspace }}/target/ci/shards/${{ matrix.shard }}.tsv
      HISTMERSION_CI_REPORT_DIR: ${{ github.workspace }}/target/ci/report/${{ matrix.shard }}
      # unit shards: no database at all, so a unit suite that reaches TestDb fails instead of skipping; IT shards:
      # their database is set below, and a DB suite that loses it fails too (B8, TestDb.RequiredEnv)
      HISTMERSION_TEST_DB_REQUIRED: "1"
    steps:
      # full history: CommentGrowthSuite compares every file with the merge base with origin/contracts3-pilot
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: the merge base's branch is there
        run: |
          git rev-parse --verify -q origin/contracts3-pilot >/dev/null \
            || git fetch -q --no-tags origin contracts3-pilot:refs/remotes/origin/contracts3-pilot
          echo "merge base: $(git merge-base HEAD origin/contracts3-pilot)"
      - name: free disk space (the runner's preinstalled SDKs we never use)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL &
      - uses: ./.github/actions/setup
      - name: the pinned GraalVM is the JDK
        run: test "$(command -v java)" = "$JAVA_HOME/bin/java" && java -version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: compiled, path: "${{ runner.temp }}" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: plan, path: target/ci }
      - name: the build job's compilation output
        run: |
          mkdir -p target
          zstd -d -q -c "$RUNNER_TEMP/compiled.tar.zst" | tar -C target -xf -
          rm "$RUNNER_TEMP/compiled.tar.zst"
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        if: matrix.db
        with: { tool: just }
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        if: matrix.db
        with:
          manifest-path: runtime/postgres/pixi.toml
          cache: true
      - name: throwaway PostgreSQL 18 + PostGIS (the bundled runtime)
        if: matrix.db
        run: |
          just test-db
          {
            echo "HISTMERSION_TEST_DB_URL=jdbc:postgresql://127.0.0.1:55432/histmersion_test"
            # the backup/restore suites run the SAME pg_dump/pg_restore the bundle ships
            echo "HISTMERSION_PG_BIN_DIR=$GITHUB_WORKSPACE/runtime/postgres/.pixi/envs/default/bin"
          } >> "$GITHUB_ENV"
      - name: forced tests of the shard
        timeout-minutes: 20
        run: |
          projects="$(cut -f1 "$HISTMERSION_CI_SHARD_FILE" | sort -u)"
          echo "shard ${{ matrix.shard }}: $(wc -l < "$HISTMERSION_CI_SHARD_FILE") suite(s) of" $projects
          echo "database: ${HISTMERSION_TEST_DB_URL:-none}"
          # one project: its own testOnly (no other project links its tests for nothing); several: the root's,
          # which runs each aggregated project's and reports every failure, not only the first
          if [ "$(echo "$projects" | wc -l)" -eq 1 ]; then cmd="$projects/testOnly *"; else cmd="testOnly *"; fi
          # every module compiled first: the ledger sites from the build job are checked against all of them
          set +e
          $SBT "$NOFMT" Test/compile "$cmd" 2>&1 | tee "$RUNNER_TEMP/sbt.log"
          rc=${PIPESTATUS[0]}
          # forced: no suite's result replayed from the cache (lane rule: `cached 0`)
          if sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/sbt.log" | grep -E 'cached [1-9]'; then
            echo "::error::a test result was replayed from sbt's cache: not a forced run"; rc=1
          fi
          exit $rc
      - name: no suite skipped for want of a database (B8)
        if: always()
        run: |
          shopt -s nullglob
          bad=0
          for f in "$HISTMERSION_CI_REPORT_DIR"/*.skips.tsv; do
            if grep -n 'HISTMERSION_TEST_DB_URL' "$f"; then bad=1; fi
          done
          exit $bad
      # the ledger sites' log (LedgerSites: SentenceLedgerSuite, ProblemCasesSuite) goes with the report, so a failed
      # run can be read afterwards; scripts/ci/check.py reads only the report's .tsv files
      - name: the ledger sites' log, with the report
        if: always()
        run: |
          if [ -f target/guidelines/ledger-sites.log ]; then
            mkdir -p "$HISTMERSION_CI_REPORT_DIR"
            cp target/guidelines/ledger-sites.log "$HISTMERSION_CI_REPORT_DIR/ledger-sites.log"
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ matrix.shard }}
          path: target/ci/report/${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: warn
      - if: always() && matrix.db
        run: just test-db-down
      - if: always()
        uses: ./.github/actions/thread-dumps
        with: { suffix: "${{ matrix.shard }}" }

  shards:
    needs: [build, test]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: plan, path: target/ci }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: report-*, path: target/ci/report }
      - name: every suite classed, and run in exactly one shard of its class
        run: |
          mkdir -p target/ci/report
          python3 scripts/ci/check.py target/ci/classes.tsv target/ci/report --summary "$GITHUB_STEP_SUMMARY"

  native:
    # The native server and CLI from this branch (scripts/bundle/server.sh, as `just native`) over the build job's
    # compile; its self-check; the CLI reference checked against the native CLI's help.
    # ON DEMAND ONLY (workflow_dispatch): no free runner can link the server today. On the 16 GB Linux runner the
    # builder's analysis ran out of heap at 80% of 13 GB (run 44791490700), at -Xmx12g (run 44800796510) and at -Xmx14g
    # with 12 GB of swap (run 44807036456); the 7 GB macOS runner thrashed for two hours (run 44769953576). A larger
    # runner (paid) or a smaller image would bring it back on every push.
    name: native (server and CLI, CLI docs)
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: free disk space (the runner's preinstalled SDKs we never use)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL &
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: compiled, path: "${{ runner.temp }}" }
      - name: the build job's compilation output
        run: |
          mkdir -p target
          zstd -d -q -c "$RUNNER_TEMP/compiled.tar.zst" | tar -C target -xf -
          rm "$RUNNER_TEMP/compiled.tar.zst"
      # the server's image needs more heap than this 16 GB runner has free beside sbt: its analysis ran out of heap with
      # the builder's default (80% of 13 GB; run 44791490700) and with -Xmx12g (run 44800796510). So: 10 GB more swap,
      # sbt kept at 2 GB, and the builder at 14 GB
      - name: more swap for the native-image builder
        run: |
          sudo fallocate -l 10G /mnt/hm-swap && sudo chmod 600 /mnt/hm-swap
          sudo mkswap /mnt/hm-swap >/dev/null && sudo swapon /mnt/hm-swap
          free -g
      - name: the native server and CLI
        env:
          SBT_OPTS: -Xss16m -Xmx2g
          HISTMERSION_NATIVE_XMX: 14g
        run: |
          free -g
          bash scripts/bundle/server.sh target/native
      - name: the native server's self-check (time zones, the linked resources)
        run: target/native/bin/histmersion-server --self-check
      - name: CLI reference in the docs is current (the native CLI's help)
        run: ./tools/gen-cli-docs.sh --check

  scripts:
    # The scripts' own tests and the unit tests of the browser tests' tools; the CLI reference checked against the
    # CLI's help (run on the JVM: tools/gen-cli-docs.sh's fallback). The NATIVE build is the `native` job's.
    name: scripts (scripts' tests, CLI docs)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with: { tool: just }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: compiled, path: "${{ runner.temp }}" }
      - name: the build job's compilation output
        run: |
          mkdir -p target
          zstd -d -q -c "$RUNNER_TEMP/compiled.tar.zst" | tar -C target -xf -
          rm "$RUNNER_TEMP/compiled.tar.zst"
      - name: the CLI's class path (from the replay)
        timeout-minutes: 8
        run: $SBT "$NOFMT" cli/writeClasspath
      - name: the scripts' own tests (the LaunchAgent environment merge, the CI shard tools, …)
        timeout-minutes: 8
        run: just test-scripts
      - name: unit tests of the browser tests' tools (the shards, the budget comparison)
        timeout-minutes: 5
        working-directory: modules/web
        run: node --test test/test-shards.unit.test.mjs test/budget-figures.unit.test.mjs
      - name: CLI reference in the docs is current (the CLI's help, on the JVM)
        timeout-minutes: 15
        run: ./tools/gen-cli-docs.sh --check
      - if: always()
        uses: ./.github/actions/thread-dumps

  browser:
    # The browser tests but the budgets, against the server on the JVM from the build job's compile, in Chromium
    # headless. The runner has no GPU: WebGL is drawn by SwiftShader and the pages take the no-GPU path, but for the
    # tests of the GPU path, whose pages are told a GPU renderer (test/engine.mjs standInGpu, withPage's `gpu`).
    # Every shard loads every file; test/shard-preload.mjs registers only
    # the shard's own tests (perf.test.mjs whole to shard 1, every other test by a hash of its name to shards 2…n)
    # and lists every test it saw with its shard (the manifest), so browser-shards can check the union.
    name: browser ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      HISTMERSION_SERVER_URL: http://127.0.0.1:18080
      HISTMERSION_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      HISTMERSION_TEST_SHARD_PINS: perf.test.mjs=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: ./.github/actions/setup
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with: { tool: just }
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          manifest-path: runtime/postgres/pixi.toml
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modules/web/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: compiled, path: "${{ runner.temp }}" }
      - name: the build job's compilation output
        run: |
          mkdir -p target
          zstd -d -q -c "$RUNNER_TEMP/compiled.tar.zst" | tar -C target -xf -
          rm "$RUNNER_TEMP/compiled.tar.zst"
      - name: the server's class path (from the replay)
        timeout-minutes: 8
        run: |
          $SBT "$NOFMT" server/writeClasspath
          cp="$(find target/out -path '*histmersion-server/classpath.txt' | head -1)"
          test -s "$cp" && echo "SERVER_CLASSPATH_FILE=$cp" >> "$GITHUB_ENV"
      - name: throwaway PostgreSQL 18 + PostGIS
        run: just test-db
      - name: the test server on the JVM (no runtime children, scratch settings, the Aegean base-map extract)
        run: |
          conf="$RUNNER_TEMP/histmersion-test.conf"; : > "$conf"
          echo "HISTMERSION_TEST_CONFIG_FILE=$conf" >> "$GITHUB_ENV"
          HISTMERSION_RUNTIME=false HISTMERSION_CONFIG="$conf" \
          HISTMERSION_DATA_DIR="$RUNNER_TEMP/histmersion-data" \
          HISTMERSION_DB_URL=jdbc:postgresql://127.0.0.1:55432/histmersion_test \
          HISTMERSION_PORT=18080 HISTMERSION_PUBLIC_URL="$HISTMERSION_SERVER_URL" \
          HISTMERSION_BASEMAP_DIR=modules/web/test/fixtures/basemap \
          HISTMERSION_BASEMAP_TERRAIN_ON_DEMAND=false HISTMERSION_BASEMAP_VECTOR_ON_DEMAND=false \
          HISTMERSION_BASEMAP_BATHYMETRY_ON_DEMAND=false \
            nohup java --sun-misc-unsafe-memory-access=allow -Xss4m -cp "$(cat "$SERVER_CLASSPATH_FILE")" \
              com.histmersion.server.histmersionServer > "$RUNNER_TEMP/server.log" 2>&1 &
          curl -fsS --retry 90 --retry-delay 2 --retry-connrefused --retry-all-errors "$HISTMERSION_SERVER_URL/api/health"
      - name: Playwright's browsers (cached per lock file)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('modules/web/package-lock.json') }}
      - name: browser dependencies (Playwright's Chromium and the system libraries it needs)
        working-directory: modules/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: browser tests of this shard (the files of `npm run test:browser` but the `budgets:` tests; a skipped test fails, G125)
        timeout-minutes: 30
        working-directory: modules/web
        run: |
          files="$(node -p "require('./package.json').scripts['test:browser'].split(' ').filter(a => a.startsWith('test/')).join(' ')")"
          out="$RUNNER_TEMP/browser"; mkdir -p "$out"
          report="$out/browser-junit.xml"
          export HISTMERSION_TEST_SHARD_MANIFEST="$out/manifest.jsonl"
          rc=0
          node --import ./test/shard-preload.mjs --test --test-concurrency=1 --test-force-exit --test-skip-pattern='^budgets: ' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$out/browser.tap" \
            --test-reporter=junit --test-reporter-destination="$report" $files || rc=$?
          tests="$(grep -c '<testcase' "$report" || true)"
          skipped="$(grep -c '<skipped' "$report" || true)"
          echo "browser tests, shard $HISTMERSION_TEST_SHARD: exit $rc, $tests run, $skipped skipped"
          if [ "$tests" = 0 ]; then
            echo "::error::no browser test ran"
            rc=1
          fi
          if [ "$skipped" != 0 ]; then
            echo "::error::$skipped browser test(s) skipped (G125: a skip fails the run)"
            rc=1
          fi
          exit $rc
      - name: the shard's test list and report (browser-shards checks them)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/browser/manifest.jsonl
            ${{ runner.temp }}/browser/browser-junit.xml
          retention-days: 7
          if-no-files-found: ignore
      - name: logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-logs-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/browser/browser.tap
            target/test-pg.log
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        run: just test-db-down
      - if: always()
        uses: ./.github/actions/thread-dumps
        with: { suffix: "${{ matrix.shard }}" }

  browser-shards:
    needs: [build, browser]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: browser-shard-*, path: target/browser-shards }
      - name: every browser test listed by the shards ran exactly once, in the shard it was dealt to; none skipped
        run: |
          mkdir -p target/browser-shards
          node modules/web/test/shards-check.mjs --dir target/browser-shards --exclude '^budgets: ' --summary "$GITHUB_STEP_SUMMARY"

  budgets:
    name: budgets (browser speed against the merge base, on the same runner)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HISTMERSION_SERVER_URL: http://127.0.0.1:18080
      HISTMERSION_BASE_URL: http://127.0.0.1:18081
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with: { tool: just }
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          manifest-path: runtime/postgres/pixi.toml
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modules/web/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: compiled, path: "${{ runner.temp }}" }
      - name: the build job's compilation output
        run: |
          mkdir -p target
          zstd -d -q -c "$RUNNER_TEMP/compiled.tar.zst" | tar -C target -xf -
          rm "$RUNNER_TEMP/compiled.tar.zst"
      - name: the server's class path (from the replay)
        timeout-minutes: 8
        run: |
          $SBT "$NOFMT" server/writeClasspath
          cp="$(find target/out -path '*histmersion-server/classpath.txt' | head -1)"
          test -s "$cp" && echo "SERVER_CLASSPATH_FILE=$cp" >> "$GITHUB_ENV"
      - name: the merge base's server class path (a worktree of it, compiled from the same replay where unchanged)
        timeout-minutes: 20
        run: |
          base="$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-contracts3-pilot}")"
          echo "the merge base: $base (this change: $(git rev-parse HEAD))"
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          (cd "$RUNNER_TEMP/base" && $SBT "$NOFMT" server/writeClasspath)
          cp="$(find "$RUNNER_TEMP/base/target/out" -path '*histmersion-server/classpath.txt' | head -1)"
          test -s "$cp" && echo "BASE_CLASSPATH_FILE=$cp" >> "$GITHUB_ENV"
      - name: throwaway PostgreSQL 18 + PostGIS (a database each)
        run: |
          just test-db
          runtime/postgres/.pixi/envs/default/bin/createdb -h 127.0.0.1 -p 55432 -U histmersion histmersion_base_test
      - name: the test servers on the JVM, this change's and the merge base's (no runtime children, scratch settings, the Aegean base-map extract)
        run: |
          start() {
            conf="$RUNNER_TEMP/histmersion-$1.conf"; : > "$conf"
            HISTMERSION_RUNTIME=false HISTMERSION_CONFIG="$conf" \
            HISTMERSION_DATA_DIR="$RUNNER_TEMP/histmersion-data-$1" \
            HISTMERSION_DB_URL="jdbc:postgresql://127.0.0.1:55432/$2" \
            HISTMERSION_PORT="$3" HISTMERSION_PUBLIC_URL="http://127.0.0.1:$3" \
            HISTMERSION_BASEMAP_DIR=modules/web/test/fixtures/basemap \
            HISTMERSION_BASEMAP_TERRAIN_ON_DEMAND=false HISTMERSION_BASEMAP_VECTOR_ON_DEMAND=false \
            HISTMERSION_BASEMAP_BATHYMETRY_ON_DEMAND=false \
              nohup java --sun-misc-unsafe-memory-access=allow -Xss4m -cp "$(cat "$4")" \
                com.histmersion.server.histmersionServer > "$RUNNER_TEMP/$5" 2>&1 &
          }
          start pr histmersion_test 18080 "$SERVER_CLASSPATH_FILE" server.log
          start base histmersion_base_test 18081 "$BASE_CLASSPATH_FILE" server-base.log
          curl -fsS --retry 90 --retry-delay 2 --retry-connrefused --retry-all-errors "$HISTMERSION_SERVER_URL/api/health"
          curl -fsS --retry 90 --retry-delay 2 --retry-connrefused --retry-all-errors "$HISTMERSION_BASE_URL/api/health"
      - name: Playwright's browsers (cached per lock file)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('modules/web/package-lock.json') }}
      - name: browser dependencies (Playwright's Chromium and the system libraries it needs)
        working-directory: modules/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: the merge base's browser dependencies (each side runs its own test code)
        working-directory: ${{ runner.temp }}/base/modules/web
        run: |
          npm ci
          npx playwright install chromium
      - name: the machine the budgets are measured on (CPU, memory)
        run: |
          lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core)'
          free -m
      - name: this change against its merge base, interleaved on this runner (budgets-ab.mjs; a regression past the runs' noise fails)
        timeout-minutes: 60
        working-directory: modules/web
        env:
          HISTMERSION_BUDGETS_INJECT_ZOOM_MS: ""
        run: |
          node test/budgets-ab.mjs --base-url "$HISTMERSION_BASE_URL" --pr-url "$HISTMERSION_SERVER_URL" \
            --base-web "$RUNNER_TEMP/base/modules/web" --rounds 3 --out "$RUNNER_TEMP/budgets-ab"
      - name: logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: budgets-logs
          path: |
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/server-base.log
            ${{ runner.temp }}/budgets-ab
            target/test-pg.log
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        run: just test-db-down
      - if: always()
        uses: ./.github/actions/thread-dumps
