name: ci
# Every push to master and the refactor branches (contracts3-**), every PR, and on demand: the whole forced test
# suite, split into shards that run side by side.
#
#   format     scalafmt alone, beside everything else: a formatting failure never skips or cancels a test job
#   converter  the OCR converter's pytest
#   build      compiles every module once (sbt 2's disk cache, target/sbt-cache, carried from earlier runs of the
#              week), lists every test suite (`sbt ciSuites`, project/CiShard.scala), classes each as unit or IT
#              from the test sources (scripts/ci/classify.py) and deals them into shards (scripts/ci/plan.py). It
#              hands the test jobs its compilation output (the sbt cache they replay) and the shard plan
#   unit / it  one job per shard: `testOnly *` narrowed to the shard's suites (HISTMERSION_CI_SHARD_FILE), every
#              finished suite recorded (HISTMERSION_CI_REPORT_DIR). Every shard sets HISTMERSION_TEST_DB_REQUIRED:
#              a unit shard has no database, so a unit suite that reaches TestDb fails loudly; an IT shard starts
#              its own throwaway PostgreSQL (runtime/postgres, PG 18 + PostGIS 3.6), so an IT suite never skips (B8)
#   shards     each suite classed, and run in exactly one shard of its class (scripts/ci/check.py); skips listed
#   native     ON DEMAND (workflow_dispatch): the native server and CLI built from the branch, its self-check, and
#              the CLI reference against the native CLI's help — no free runner has the memory to link the server
#   macos      on macOS arm64 (the platform the owner runs): the scripts' tests, the CLI reference against the
#              CLI's help (on the JVM), and the browser tests (Playwright, modules/web/test) against the server on
#              the JVM but the `budgets: …` ones, one file at a time — a skipped browser test fails (G125)
#   macos-budgets  the `budgets: …` browser tests alone (the same files, the complementary name pattern): timing on
#              a shared runner, so a budget over its figure warns and never blocks; a skip or no test run fails
#
# The ratchet suites compare against the merge base with contracts3-pilot: the test jobs check out the full
# history, so origin/contracts3-pilot is there (RatchetBase's fallback; HISTMERSION_RATCHET_BASE overrides it).
# Building and smoke-testing the per-platform bundles is bundle.yml.
on:
  push:
    branches: [master, 'contracts3-**']
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  # the server shards: build.sbt deals a shard's server suites into this many forked groups, at most this many JVMs
  # at once (4 vCPU / 16 GB runner; sbt itself, and scala-cli for the guideline ratchet, beside them)
  HISTMERSION_TEST_FORKS: "3"
  HISTMERSION_TEST_GROUPS_SERVER: "3"
  # -Xss16m: the compiler's deep recursion (forced-run.sh's flag; the default stack overflows in Namer)
  # -Dsbt.cache_test_result=false: a forced run — sbt 2 replays a passed suite's result from its disk cache otherwise
  SBT: >-
    sbt --server -batch -J-Xss16m -Dsbt.cache_test_result=false
    -Dsbt.global.localcache=${{ github.workspace }}/target/sbt-cache
  # what forced-run.sh sets: compiling never rewrites the sources (the format job checks them)
  NOFMT: set every scalafmtOnCompile := false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - name: formatting (scalafmt; `just fmt` fixes it)
        run: $SBT scalafmtCheckAll scalafmtSbtCheck

  converter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { enable-cache: true, cache-dependency-glob: converter/uv.lock }
      - name: converter tests
        working-directory: converter
        run: uv run --frozen pytest -q

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: free disk space (the runner's preinstalled SDKs we never use)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL &
      - uses: ./.github/actions/setup
        with: { save-deps: "true" }
      - name: the week (the compile cache starts afresh each ISO week, so it never grows without bound)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: compile cache (restore)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/sbt-cache
          key: sbt-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.week.outputs.week }}-${{ github.sha }}
          restore-keys: sbt-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.week.outputs.week }}-
      - name: compile every module, list every suite
        run: $SBT -J-Xmx6g "$NOFMT" Test/compile ciSuites
      - name: class the suites (unit or IT) and deal them into shards
        id: plan
        run: |
          python3 -m unittest scripts/ci/tests/test_plan.py scripts/ci/tests/test_check.py scripts/ci/tests/test_classify.py
          # an unclassified suite is named here and dealt nowhere; the shards job fails the run on it
          python3 scripts/ci/classify.py target/ci/suites target/ci/sources --out target/ci/classes.tsv || true
          python3 scripts/ci/plan.py target/ci/classes.tsv target/ci/shards > "$RUNNER_TEMP/matrix.json"
          echo "matrix=$(cat "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"
          du -sh target/sbt-cache
      - name: the compilation output, for the test jobs
        run: |
          tar -C target -cf - sbt-cache | zstd -T0 -3 -q -o "$RUNNER_TEMP/compiled.tar.zst"
          ls -l "$RUNNER_TEMP/compiled.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled
          path: ${{ runner.temp }}/compiled.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: the plan (which suites each shard runs; the classes the shards job checks against)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan
          path: |
            target/ci/classes.tsv
            target/ci/shards
          retention-days: 7
          if-no-files-found: error
      - name: compile cache (save)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/sbt-cache
          key: sbt-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.week.outputs.week }}-${{ github.sha }}
      - name: dependency cache (save)
        if: env.HISTMERSION_CI_SAVE_DEPS != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/coursier
            ~/Library/Caches/Coursier
            ~/.sbt
            ~/.ivy2/cache
          key: ${{ env.HISTMERSION_CI_SAVE_DEPS }}

  test:
    needs: build
    name: ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.matrix) }}
    env:
      HISTMERSION_CI_SHARD_FILE: ${{ github.workspace }}/target/ci/shards/${{ matrix.shard }}.tsv
      HISTMERSION_CI_REPORT_DIR: ${{ github.workspace }}/target/ci/report/${{ matrix.shard }}
      # unit shards: no database at all, so a unit suite that reaches TestDb fails instead of skipping; IT shards:
      # their database is set below, and a DB suite that loses it fails too (B8, TestDb.RequiredEnv)
      HISTMERSION_TEST_DB_REQUIRED: "1"
    steps:
      # full history: the ratchet suites take their limits from the merge base with origin/contracts3-pilot
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: the ratchets' base branch is there
        run: |
          git rev-parse --verify -q origin/contracts3-pilot >/dev/null \
            || git fetch -q --no-tags origin contracts3-pilot:refs/remotes/origin/contracts3-pilot
          echo "ratchet base: $(git merge-base HEAD origin/contracts3-pilot)"
      - name: free disk space (the runner's preinstalled SDKs we never use)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL &
      # the launcher alone, pinned and checked: scala-cli-setup also installs a JVM (moving JAVA_HOME off the pinned
      # GraalVM, so every module compiled again) and fetches sbtn from Maven Central, which rate-limits runners
      - name: scala-cli (the guideline ratchet runs Scalafix through it)
        if: contains(matrix.shard, 'server')
        env:
          SCALA_CLI_URL: https://github.com/VirtusLab/scala-cli/releases/download/v1.18.0/scala-cli-x86_64-pc-linux.gz
          SCALA_CLI_SHA256: eb41442f870bcae75aa5d6622ac96a173dae14fed59f71c97125eb21536bb060
        run: |
          mkdir -p "$RUNNER_TEMP/scala-cli"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/scala-cli.gz" "$SCALA_CLI_URL"
          echo "$SCALA_CLI_SHA256  $RUNNER_TEMP/scala-cli.gz" | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/scala-cli.gz" > "$RUNNER_TEMP/scala-cli/scala-cli"
          chmod +x "$RUNNER_TEMP/scala-cli/scala-cli"
          echo "$RUNNER_TEMP/scala-cli" >> "$GITHUB_PATH"
      - uses: ./.github/actions/setup
      - name: the pinned GraalVM is the JDK
        run: test "$(command -v java)" = "$JAVA_HOME/bin/java" && java -version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: compiled, path: "${{ runner.temp }}" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: plan, path: target/ci }
      - name: the build job's compilation output
        run: |
          mkdir -p target
          zstd -d -q -c "$RUNNER_TEMP/compiled.tar.zst" | tar -C target -xf -
          rm "$RUNNER_TEMP/compiled.tar.zst"
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        if: matrix.db
        with: { tool: just }
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        if: matrix.db
        with:
          manifest-path: runtime/postgres/pixi.toml
          cache: true
      - name: throwaway PostgreSQL 18 + PostGIS (the bundled runtime)
        if: matrix.db
        run: |
          just test-db
          {
            echo "HISTMERSION_TEST_DB_URL=jdbc:postgresql://127.0.0.1:55432/histmersion_test"
            # the backup/restore suites run the SAME pg_dump/pg_restore the bundle ships
            echo "HISTMERSION_PG_BIN_DIR=$GITHUB_WORKSPACE/runtime/postgres/.pixi/envs/default/bin"
          } >> "$GITHUB_ENV"
      - name: forced tests of the shard
        run: |
          projects="$(cut -f1 "$HISTMERSION_CI_SHARD_FILE" | sort -u)"
          echo "shard ${{ matrix.shard }}: $(wc -l < "$HISTMERSION_CI_SHARD_FILE") suite(s) of" $projects
          echo "database: ${HISTMERSION_TEST_DB_URL:-none}"
          # one project: its own testOnly (no other project links its tests for nothing); several: the root's,
          # which runs each aggregated project's and reports every failure, not only the first
          if [ "$(echo "$projects" | wc -l)" -eq 1 ]; then cmd="$projects/testOnly *"; else cmd="testOnly *"; fi
          # every module compiled first: the guideline ratchet reads the SemanticDB of all of them
          set +e
          $SBT "$NOFMT" Test/compile "$cmd" 2>&1 | tee "$RUNNER_TEMP/sbt.log"
          rc=${PIPESTATUS[0]}
          # forced: no suite's result replayed from the cache (lane rule: `cached 0`)
          if sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/sbt.log" | grep -E 'cached [1-9]'; then
            echo "::error::a test result was replayed from sbt's cache: not a forced run"; rc=1
          fi
          exit $rc
      - name: no suite skipped for want of a database (B8)
        if: always()
        run: |
          shopt -s nullglob
          bad=0
          for f in "$HISTMERSION_CI_REPORT_DIR"/*.skips.tsv; do
            if grep -n 'HISTMERSION_TEST_DB_URL' "$f"; then bad=1; fi
          done
          exit $bad
      # the guideline inventory's log (GuidelineRatchetSuite, SentenceLedgerSuite) goes with the report, so a failed
      # inventory run can be read afterwards; scripts/ci/check.py reads only the report's .tsv files
      - name: the guideline inventory's log, with the report
        if: always()
        run: |
          if [ -f target/guidelines/inventory.log ]; then
            mkdir -p "$HISTMERSION_CI_REPORT_DIR"
            cp target/guidelines/inventory.log "$HISTMERSION_CI_REPORT_DIR/guideline-inventory.log"
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ matrix.shard }}
          path: target/ci/report/${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: warn
      - if: always() && matrix.db
        run: just test-db-down

  shards:
    needs: [build, test]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: plan, path: target/ci }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: report-*, path: target/ci/report }
      - name: every suite classed, and run in exactly one shard of its class
        run: |
          mkdir -p target/ci/report
          python3 scripts/ci/check.py target/ci/classes.tsv target/ci/report --summary "$GITHUB_STEP_SUMMARY"

  native:
    # The native server and CLI from this branch (scripts/bundle/server.sh, as `just native`) over the build job's
    # compile; its self-check; the CLI reference checked against the native CLI's help.
    # ON DEMAND ONLY (workflow_dispatch): no free runner can link the server today. On the 16 GB Linux runner the
    # builder's analysis ran out of heap at 80% of 13 GB (run 44791490700), at -Xmx12g (run 44800796510) and at -Xmx14g
    # with 12 GB of swap (run 44807036456); the 7 GB macOS runner thrashed for two hours (run 44769953576). A larger
    # runner (paid) or a smaller image would bring it back on every push.
    name: native (server and CLI, CLI docs)
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: free disk space (the runner's preinstalled SDKs we never use)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL &
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: compiled, path: "${{ runner.temp }}" }
      - name: the build job's compilation output
        run: |
          mkdir -p target
          zstd -d -q -c "$RUNNER_TEMP/compiled.tar.zst" | tar -C target -xf -
          rm "$RUNNER_TEMP/compiled.tar.zst"
      # the server's image needs more heap than this 16 GB runner has free beside sbt: its analysis ran out of heap with
      # the builder's default (80% of 13 GB; run 44791490700) and with -Xmx12g (run 44800796510). So: 10 GB more swap,
      # sbt kept at 2 GB, and the builder at 14 GB
      - name: more swap for the native-image builder
        run: |
          sudo fallocate -l 10G /mnt/hm-swap && sudo chmod 600 /mnt/hm-swap
          sudo mkswap /mnt/hm-swap >/dev/null && sudo swapon /mnt/hm-swap
          free -g
      - name: the native server and CLI
        env:
          SBT_OPTS: -Xss16m -Xmx2g
          HISTMERSION_NATIVE_XMX: 14g
        run: |
          free -g
          bash scripts/bundle/server.sh target/native
      - name: the native server's self-check (time zones, the linked resources)
        run: target/native/bin/histmersion-server --self-check
      - name: CLI reference in the docs is current (the native CLI's help)
        run: ./tools/gen-cli-docs.sh --check

  macos:
    # The browser tests on macOS arm64, the platform the owner runs (Chromium draws the map on the GPU there), against
    # the server on the JVM from the build job's compile; the scripts' tests; the CLI reference checked against the
    # CLI's help (run on the JVM: tools/gen-cli-docs.sh's fallback). The NATIVE build is the `native` job's.
    name: macos (browser tests but the budgets, scripts' tests, CLI docs)
    needs: build
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HISTMERSION_SERVER_URL: http://127.0.0.1:18080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { save-deps: "true" }
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with: { tool: just }
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          manifest-path: runtime/postgres/pixi.toml
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modules/web/package-lock.json
      # the build job's compilation output: bytecode is the same on every platform, and replaying it spares this
      # 3-core runner the compile, where Kindlings' derivations overrun their fixed 5 s per macro expansion
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: compiled, path: "${{ runner.temp }}" }
      - name: the build job's compilation output
        run: |
          mkdir -p target
          zstd -d -q -c "$RUNNER_TEMP/compiled.tar.zst" | tar -C target -xf -
          rm "$RUNNER_TEMP/compiled.tar.zst"
      - name: the server's and the CLI's class paths (compiled from the replay, one module at a time where not)
        run: |
          $SBT "set Global / concurrentRestrictions += Tags.limit(Tags.Compile, 1)" server/writeClasspath cli/writeClasspath
          cp="$(find target/out -path '*histmersion-server/classpath.txt' | head -1)"
          test -s "$cp" && echo "SERVER_CLASSPATH_FILE=$cp" >> "$GITHUB_ENV"
      - name: dependency cache (save)
        if: always() && env.HISTMERSION_CI_SAVE_DEPS != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/coursier
            ~/Library/Caches/Coursier
            ~/.sbt
            ~/.ivy2/cache
          key: ${{ env.HISTMERSION_CI_SAVE_DEPS }}
      - name: the scripts' own tests (the LaunchAgent environment merge, the CI shard tools, …)
        run: just test-scripts
      - name: CLI reference in the docs is current (the CLI's help, on the JVM)
        run: ./tools/gen-cli-docs.sh --check

      - name: throwaway PostgreSQL 18 + PostGIS
        run: just test-db
      - name: the test server on the JVM (no runtime children, scratch settings, the Aegean base-map extract)
        run: |
          conf="$RUNNER_TEMP/histmersion-test.conf"; : > "$conf"
          echo "HISTMERSION_TEST_CONFIG_FILE=$conf" >> "$GITHUB_ENV"
          HISTMERSION_RUNTIME=false HISTMERSION_CONFIG="$conf" \
          HISTMERSION_DATA_DIR="$RUNNER_TEMP/histmersion-data" \
          HISTMERSION_DB_URL=jdbc:postgresql://127.0.0.1:55432/histmersion_test \
          HISTMERSION_PORT=18080 HISTMERSION_PUBLIC_URL="$HISTMERSION_SERVER_URL" \
          HISTMERSION_BASEMAP_DIR=modules/web/test/fixtures/basemap \
          HISTMERSION_BASEMAP_TERRAIN_ON_DEMAND=false HISTMERSION_BASEMAP_VECTOR_ON_DEMAND=false \
          HISTMERSION_BASEMAP_BATHYMETRY_ON_DEMAND=false \
            nohup java --sun-misc-unsafe-memory-access=allow -Xss4m -cp "$(cat "$SERVER_CLASSPATH_FILE")" \
              com.histmersion.server.histmersionServer > "$RUNNER_TEMP/server.log" 2>&1 &
          curl -fsS --retry 90 --retry-delay 2 --retry-connrefused --retry-all-errors "$HISTMERSION_SERVER_URL/api/health"
      - name: browser dependencies (Playwright's Chromium)
        working-directory: modules/web
        run: |
          npm ci
          npx playwright install chromium
      - name: browser tests (the files of `npm run test:browser` but the `budgets:` tests; a skipped test fails, G125)
        working-directory: modules/web
        run: |
          files="$(node -p "require('./package.json').scripts['test:browser'].split(' ').filter(a => a.startsWith('test/')).join(' ')")"
          report="$RUNNER_TEMP/browser-junit.xml"
          rc=0
          node --test --test-concurrency=1 --test-skip-pattern='^budgets: ' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination="$report" $files || rc=$?
          tests="$(grep -c '<testcase' "$report" || true)"
          skipped="$(grep -c '<skipped' "$report" || true)"
          echo "browser tests: exit $rc, $tests run, $skipped skipped"
          if [ "$tests" = 0 ]; then
            echo "::error::no browser test ran"
            rc=1
          fi
          if [ "$skipped" != 0 ]; then
            echo "::error::$skipped browser test(s) skipped (G125: a skip fails the run)"
            rc=1
          fi
          exit $rc
      - name: logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-logs
          path: |
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/browser-junit.xml
            target/test-pg.log
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        run: just test-db-down

  macos-budgets:
    name: macos-budgets (browser speed budgets, timing, never blocks)
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HISTMERSION_SERVER_URL: http://127.0.0.1:18080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with: { tool: just }
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          manifest-path: runtime/postgres/pixi.toml
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modules/web/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: compiled, path: "${{ runner.temp }}" }
      - name: the build job's compilation output
        run: |
          mkdir -p target
          zstd -d -q -c "$RUNNER_TEMP/compiled.tar.zst" | tar -C target -xf -
          rm "$RUNNER_TEMP/compiled.tar.zst"
      - name: the server's class path (compiled from the replay, one module at a time where not)
        run: |
          $SBT "set Global / concurrentRestrictions += Tags.limit(Tags.Compile, 1)" server/writeClasspath
          cp="$(find target/out -path '*histmersion-server/classpath.txt' | head -1)"
          test -s "$cp" && echo "SERVER_CLASSPATH_FILE=$cp" >> "$GITHUB_ENV"
      - name: throwaway PostgreSQL 18 + PostGIS
        run: just test-db
      - name: the test server on the JVM (no runtime children, scratch settings, the Aegean base-map extract)
        run: |
          conf="$RUNNER_TEMP/histmersion-test.conf"; : > "$conf"
          echo "HISTMERSION_TEST_CONFIG_FILE=$conf" >> "$GITHUB_ENV"
          HISTMERSION_RUNTIME=false HISTMERSION_CONFIG="$conf" \
          HISTMERSION_DATA_DIR="$RUNNER_TEMP/histmersion-data" \
          HISTMERSION_DB_URL=jdbc:postgresql://127.0.0.1:55432/histmersion_test \
          HISTMERSION_PORT=18080 HISTMERSION_PUBLIC_URL="$HISTMERSION_SERVER_URL" \
          HISTMERSION_BASEMAP_DIR=modules/web/test/fixtures/basemap \
          HISTMERSION_BASEMAP_TERRAIN_ON_DEMAND=false HISTMERSION_BASEMAP_VECTOR_ON_DEMAND=false \
          HISTMERSION_BASEMAP_BATHYMETRY_ON_DEMAND=false \
            nohup java --sun-misc-unsafe-memory-access=allow -Xss4m -cp "$(cat "$SERVER_CLASSPATH_FILE")" \
              com.histmersion.server.histmersionServer > "$RUNNER_TEMP/server.log" 2>&1 &
          curl -fsS --retry 90 --retry-delay 2 --retry-connrefused --retry-all-errors "$HISTMERSION_SERVER_URL/api/health"
      - name: browser dependencies (Playwright's Chromium)
        working-directory: modules/web
        run: |
          npm ci
          npx playwright install chromium
      - name: the speed budgets (the `budgets:` tests of the files of `npm run test:browser`; over a budget warns)
        continue-on-error: true
        working-directory: modules/web
        run: |
          files="$(node -p "require('./package.json').scripts['test:browser'].split(' ').filter(a => a.startsWith('test/')).join(' ')")"
          HISTMERSION_PERF_REPORT=1 node --test --test-concurrency=1 --test-name-pattern='^budgets: ' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/budgets-junit.xml" $files
      - name: every budget test ran and none was skipped (G125)
        if: always()
        run: |
          report="$RUNNER_TEMP/budgets-junit.xml"
          test -s "$report" || { echo "::error::the budget tests wrote no report"; exit 1; }
          tests="$(grep -c '<testcase' "$report" || true)"
          skipped="$(grep -c '<skipped' "$report" || true)"
          failed="$(grep -c '<failure' "$report" || true)"
          echo "budget tests: $tests run, $failed failed, $skipped skipped"
          if [ "$failed" != 0 ]; then
            echo "::warning::$failed browser budget test(s) failed on the macOS runner (the timing job, never blocking)"
          fi
          if [ "$tests" = 0 ]; then
            echo "::error::no budget test ran"
            exit 1
          fi
          if [ "$skipped" != 0 ]; then
            echo "::error::$skipped budget test(s) skipped (G125: a skip fails the run)"
            exit 1
          fi
      - name: logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-budgets-logs
          path: |
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/budgets-junit.xml
            target/test-pg.log
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        run: just test-db-down
