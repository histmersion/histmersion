name: ci
# Every push and PR: the whole test suite against the PostgreSQL Histmersion actually ships
# (runtime/postgres — PG 18 + PostGIS 3.6), the converter's tests, and the docs' CLI
# table. Building and smoke-testing the per-platform bundles is bundle.yml.
on:
  push: { branches: [master] }
  pull_request: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # the PINNED GraalVM CE (scripts/bundle/graalvm-pins.txt: version, URL, SHA-256), provisioned by the
      # same script the installers use — setup-graalvm cannot name an innovation release (25.4's assets are
      # `graalvm-community-jdk-25i4-…` under the tag graal-25.4.4.1.1)
      - name: GraalVM CE (the pin)
        run: |
          export HISTMERSION_DATA_DIR="$RUNNER_TEMP/histmersion-toolchain" HISTMERSION_HOME=
          bash scripts/bundle/toolchain.sh install
          home="$(bash scripts/bundle/toolchain.sh path)"
          { echo "JAVA_HOME=$home"; echo "GRAALVM_HOME=$home"; } >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/Library/Caches/Coursier
            ~/.sbt
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.sbt', 'project/**') }}
          restore-keys: sbt-${{ runner.os }}-${{ runner.arch }}-
      - uses: sbt/setup-sbt@v1
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: converter/uv.lock }
      - uses: taiki-e/install-action@v2
        with: { tool: just }
      - name: pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rattler
          key: rattler-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/postgres/pixi.lock') }}

      - name: throwaway PostgreSQL 18 + PostGIS (the bundled runtime)
        run: just test-db
      - name: unit + integration tests
        env:
          HISTMERSION_TEST_DB_URL: "jdbc:postgresql://127.0.0.1:55432/histmersion_test"
          # the backup/restore suite runs the SAME pg_dump/pg_restore the bundle ships
          HISTMERSION_PG_BIN_DIR: ${{ github.workspace }}/runtime/postgres/.pixi/envs/default/bin
          # the DB suites' forked groups (build.sbt `dbTestGroups`): 4 vCPU / 16 GB runner — 3 JVMs at once
          HISTMERSION_TEST_FORKS: "3"
        run: sbt --server -batch 'testOnly *'
      - name: converter tests
        working-directory: converter
        run: uv run --frozen pytest -q
      - name: CLI reference in the docs is current
        run: |
          sbt --server -batch cli/nativeImage
          ./tools/gen-cli-docs.sh --check
      - if: always()
        run: just test-db-down
