[project]
name = "histdb-converter"
version = "0.1.0"
description = "hist-db OCR/convert sidecar (FastAPI over pymupdf4llm/docling)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.17",
    "pymupdf4llm>=0.0.17",
]

[project.optional-dependencies]
# High-quality OCR for image-only scans (heavy). Enabled in the Docker image.
ocr = ["docling>=2.8"]

[tool.uv]
# This is an application, not a distributable package — don't build/install the project itself.
package = false
