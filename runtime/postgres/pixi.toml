# The PostgreSQL runtime hist-db ships instead of a Docker image: PostgreSQL 18 + PostGIS 3.6
# (pg_trgm and btree_gist are contrib, inside `postgresql`). conda-forge builds are relocatable —
# pixi rewrites install prefixes on unpack — so the environment runs from any directory, and
# `pixi-pack` turns it into an offline, self-extracting archive for distribution.
#
#   pixi install                 # → .pixi/envs/default/{bin,lib,share}
#   pixi run pg-version
[workspace]
name = "histdb-postgres"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
postgresql = "18.*"
postgis = "3.6.*"

[tasks]
pg-version = "postgres --version && pg_config --version && ls $CONDA_PREFIX/share/extension | grep -E '^(postgis|pg_trgm|btree_gist)\\.control$'"
