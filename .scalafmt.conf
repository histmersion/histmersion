version = 3.11.5
project.git = true
# generated sources live under target/; spike/ holds throwaway scala-cli experiments, not modules; tools/ and .claude/ hold Scalafix rules and scripts in Scala 2.13, which this file's scala3 dialect would rewrite
project.excludePaths = [
  "glob:**/target/**",
  "glob:**/node_modules/**",
  "glob:**/spike/**",
  "glob:**/tools/**",
  "glob:**/.claude/**"
]
maxColumn = 120
runner.dialect = scala3
fileOverride {
  # sbt 2 compiles its build definition with Scala 3, so build.sbt and project/*.scala use the scala3
  # dialect: scalafmt's sbt1 dialect is Scala 2.12 and re-indents the build's indentation-based blocks
  "glob:**/*.sbt" { runner.dialect = scala3 }
  "glob:**/project/*.scala" { runner.dialect = scala3 }
}

align.preset = some

rewrite.rules = [Imports, RedundantBraces, SortModifiers]
rewrite.imports.sort = scalastyle
rewrite.redundantBraces.stringInterpolation = true
# a block's braces stay: dropping them from `catch case e => { a; b }` on one line moves `b` out of the catch
rewrite.redundantBraces.generalExpressions = false

# Scala 3 control syntax (`if … then`, `for … do`); braces vs. indentation stays as each block has it
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = no

docstrings.blankFirstLine = no
docstrings.style = SpaceAsterisk
docstrings.wrap = yes

newlines.sometimesBeforeColonInMethodReturnType = true
lineEndings = unix
