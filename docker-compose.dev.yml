# Development override: publishes Postgres on the host so you can run the server outside Docker
# (`sbt server/run`, or the DB-backed test suites with HISTMERSION_TEST_DB_URL).
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres converter
#   sbt server/run
#
# The base compose file does NOT publish Postgres or the converter: in the normal (Docker) setup the
# server is their only client, and unpublished ports are fewer things listening on the machine.
services:
  postgres:
    ports:
      - "127.0.0.1:${HISTMERSION_DB_PORT:-5432}:5432"
  converter:
    ports:
      - "127.0.0.1:${HISTMERSION_CONVERTER_PORT:-8100}:${HISTMERSION_CONVERTER_PORT:-8100}"
