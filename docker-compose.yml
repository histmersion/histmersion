# Histmersion stack — Postgres/PostGIS (bundled: no host DB install) + the OCR converter sidecar + the
# Scala server (GraalVM native image, built from ./Dockerfile).
#
# Defaults come from .env (copy .env.example), and every value falls back to the same default as
# modules/core/src/main/resources/reference.conf, so `docker compose up -d` works with no .env at all.
#
#   docker compose up -d            # the whole stack
#   docker compose logs -f server
#   docker compose down             # keeps the data volume; add -v to wipe it
#
# SECURITY: the server is published on 127.0.0.1 only, because the write endpoints are unauthenticated.
# To expose it on the LAN, set HISTMERSION_BIND=0.0.0.0 in .env (see README "Exposing on the LAN").
# Postgres is deliberately NOT published: the server is its only client. For host-side development
# (`sbt server/run`) use the dev override, which publishes it:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres converter

name: histmersion

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${HISTMERSION_DB_NAME:-histmersion}
      POSTGRES_USER: ${HISTMERSION_DB_USER:-histmersion}
      POSTGRES_PASSWORD: ${HISTMERSION_DB_PASS:-histmersion}
    volumes:
      # Set HISTMERSION_PGDATA_DIR to a host directory to keep the data outside Docker Desktop's VM disk.
      # On macOS that needs VirtioFS file sharing: under gRPC FUSE every file shows as root-owned and
      # Postgres refuses the directory ("data directory has wrong ownership").
      - "${HISTMERSION_PGDATA_DIR:-pgdata}:/var/lib/postgresql/data"
    # schema is owned by the server (Flyway migrations run at startup) — no init script here
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HISTMERSION_DB_USER:-histmersion} -d ${HISTMERSION_DB_NAME:-histmersion}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  converter:
    build: ./converter
    # OCR is CPU/mem heavy; give it room.
    environment:
      HISTMERSION_CONVERTER_PORT: "${HISTMERSION_CONVERTER_PORT:-8100}"
    # NOT published: only the server (inside the Docker network) needs the converter. For host-side
    # development (`sbt server/run`), the dev override publishes it:
    #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres converter
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HISTMERSION_PORT: "${HISTMERSION_PORT:-8000}"
    depends_on:
      postgres: { condition: service_healthy }
      converter: { condition: service_started }
    environment:
      # bind inside the container; the host-side exposure is decided by `ports` below
      HISTMERSION_BIND: "0.0.0.0"
      HISTMERSION_PORT: "${HISTMERSION_PORT:-8000}"
      HISTMERSION_PUBLIC_URL: "${HISTMERSION_PUBLIC_URL:-http://localhost:${HISTMERSION_PORT:-8000}}"
      HISTMERSION_DB_URL: "jdbc:postgresql://postgres:5432/${HISTMERSION_DB_NAME:-histmersion}"
      HISTMERSION_DB_USER: "${HISTMERSION_DB_USER:-histmersion}"
      HISTMERSION_QUERY_PASS: ${HISTMERSION_QUERY_PASS:-change-me-query}
      HISTMERSION_DB_PASS: "${HISTMERSION_DB_PASS:-histmersion}"
      HISTMERSION_CONVERTER_URL: "http://converter:${HISTMERSION_CONVERTER_PORT:-8100}"
      # server-side path of the corpus for `histmersion seed` (the bind-mount below)
      HISTMERSION_CORPUS_DIR: "/corpus"
      # where `histmersion backup` writes pg_dump archives (the `backups` volume below); copy one off the
      # volume with `histmersion backup --download .`
      HISTMERSION_BACKUPS_DIR: "${HISTMERSION_BACKUPS_DIR:-/backups}"
      HISTMERSION_TILES: "${HISTMERSION_TILES:-https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png}"
      HISTMERSION_CONVERTER_TIMEOUT: "${HISTMERSION_CONVERTER_TIMEOUT:-3600}"
    # HISTMERSION_BIND doubles as the host interface to publish on: 127.0.0.1 (default, private) or
    # 0.0.0.0 (LAN opt-in). The in-container bind is always 0.0.0.0, set above.
    ports:
      - "${HISTMERSION_BIND:-127.0.0.1}:${HISTMERSION_PORT:-8000}:${HISTMERSION_PORT:-8000}"
    volumes:
      # the wiki/sources corpus, read-only — `histmersion seed` reads it SERVER-side
      - "${HISTMERSION_CORPUS_DIR:-./corpus}:/corpus:ro"
      # pg_dump archives land on the host (override with HISTMERSION_BACKUPS_HOST_DIR)
      - "${HISTMERSION_BACKUPS_HOST_DIR:-./backups}:/backups"
    restart: unless-stopped

volumes:
  pgdata:
